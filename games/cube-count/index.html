/* Mỗi mức lấy đề trong một dải màn của thư viện [từ, tới) (chủ game chọn: Dễ chương 1-3, Vừa 3-5, Khó 5-6, Khó hơn show chương 7, mức này chỉ chơi một mình) */
const CC_BANDS = { easy: [0, 30], normal: [20, 50], hard: [40, 60], beyond: [60, 70] };
const CC_SOLO = 5;   // chơi một mình: 5 câu mỗi lượt
function ccStage(i) {   // màn thứ i (0..69) của thư viện
  const [wd, s] = CC_LIB[i].split(":"), [w, d] = wd.split("x").map(Number), h = [...s].map(ch => parseInt(ch, 36));
  return { w, d, h, total: h.reduce((a, b) => a + b, 0), lib: i };
}
/* Câu thứ k (0..n-1) của mức level: xếp các màn trong dải theo số khối (dải đi qua nhiều chương nên thứ tự màn chưa chắc đã khó dần),
   chia thành n nhóm liên tiếp, lấy ngẫu nhiên 1 màn trong nhóm k */
const ccSorted = level => { const [lo, hi] = CC_BANDS[level] || CC_BANDS.normal; return Array.from({ length: hi - lo }, (_, j) => lo + j).sort((x, y) => ccStage(x).total - ccStage(y).total || x - y); };
function ccPick(level, k, n, rng) {
  const L = ccSorted(level), a = Math.floor(L.length * k / n), b = Math.max(a + 1, Math.floor(L.length * (k + 1) / n));
  return ccStage(L[a + Math.floor(rng() * (b - a))]);
}
function ccGen(stage, rng, level) { return { ...ccPick(level, stage - 1, CC_SOLO, rng), stage, level }; }
/* Online: 7 đề khó dần trong dải màn của mức chủ phòng chọn */
function ccOnline(k, level, rng) { return { ...ccPick(level, k - 1, 7, rng), stage: k, level }; }
/* RULES-END */

/* ---------- VẼ 3D (phép chiếu song song, xoay quanh trục đứng, vẽ từ xa tới gần) ---------- */
function mountCC(el, pz, ctx) {
  el.innerHTML = `<div class="cc"><canvas></canvas></div>`;
  const wrap = el.firstElementChild, cv = wrap.firstElementChild, g = cv.getContext("2d");
  const W = pz.w, D = pz.d, HM = Math.max(1, ...pz.h);
  const ht = (x, y) => (x < 0 || y < 0 || x >= W || y >= D) ? 0 : pz.h[y * W + x];
  let yaw = 0.55 + Math.random() * 0.4, pitch = 0.56, aimPitch = null, paused = false, drag = null, lastTouch = -1e9, revealed = false, raf = 0, lastT = performance.now(), dpr = 1;
  const ZOOMS = [1, 1.3, 1.7, 2.2]; let zi = 0;   // phóng to cho khối lớn (từ 7×7 trở lên mới hiện nút)

  function size() {
    const cw = Math.max(240, Math.min(wrap.clientWidth || 600, 640));
    const ch = Math.round(Math.max(260, Math.min(cw * 0.86, window.innerHeight - (window.innerWidth <= 780 ? 330 : 220))));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  const lerpCol = (a, b, t) => "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")";
  const SIDE_DARK = [176, 150, 112], SIDE_LIGHT = [236, 220, 188], TOP = "#f8efdc", EDGE = "#3a2f26";
  const LX = -0.55, LY = -0.83;   // hướng ánh sáng trên mặt phẳng (cố định theo thế giới nên bóng đổi khi xoay)
  function draw() {
    const cw = cv.width, ch = cv.height;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cw, ch);
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cx0 = W / 2, cy0 = D / 2, cz0 = HM / 2;
    // Phối cảnh nhẹ (chiếu song song làm mặt trên khối dẹt, nhìn không ra hình lập phương khi xem gần chính diện).
    // Camera quay quanh tâm khối hình, cách tâm DIST; vx,vy,vz là hướng từ tâm về phía camera.
    const DIST = Math.max(7, 3.2 * Math.hypot(W / 2, D / 2, cz0));
    const vx = -sy * cp, vy = -cy * cp, vz = sp, CX = cx0 + vx * DIST, CY = cy0 + vy * DIST, CZ = cz0 + vz * DIST;
    const raw = (X, Y, Z) => { const k = DIST / (DIST - (X * vx + Y * vy + Z * vz)); return [(X * cy - Y * sy) * k, (Z * cp + (X * sy + Y * cy) * sp) * k]; };
    // Cỡ hình: lấy khung bao của 8 góc hộp qua mọi góc xoay, nên hình không to nhỏ theo lúc xoay
    let mx = 0, up = 0, dn = 0;
    for (let j = 0; j < 24; j++) {
      const a = j * Math.PI / 12, ca = Math.cos(a), sa = Math.sin(a), k0 = DIST, dz = cp, du = sp;
      for (const X of [-W / 2 - .3, W / 2 + .3]) for (const Y of [-D / 2 - .3, D / 2 + .3]) for (const Z of [-cz0, cz0]) {
        const hd = X * sa + Y * ca, k = k0 / (k0 - (-hd * cp + Z * sp)), px = (X * ca - Y * sa) * k, py = (Z * dz + hd * du) * k;
        mx = Math.max(mx, Math.abs(px)); up = Math.max(up, py); dn = Math.max(dn, -py);
      }
    }
    const s = Math.min(cw * 0.92 / (2 * mx), ch * 0.9 / (up + dn), Math.min(cw, ch) / 4.2) * ZOOMS[zi];   // khối nhỏ không bị phóng quá to
    const ox = cw / 2, oy = ch / 2 + s * (up - dn) / 2;
    const P = (x, y, z) => { const [a, b] = raw(x - cx0, y - cy0, z - cz0); return [ox + s * a, oy - s * b]; };
    const depth = (x, y, z) => -((x - CX) ** 2 + (y - CY) ** 2 + (z - CZ) ** 2);   // xa camera vẽ trước
    g.lineJoin = "round"; g.lineCap = "round";
    // nền: tấm sàn dưới chân khối (không kẻ lưới bên trong, chủ game chọn)
    const floor = [P(-.25, -.25, 0), P(W + .25, -.25, 0), P(W + .25, D + .25, 0), P(-.25, D + .25, 0)];
    poly(floor, "rgba(74,111,216,.07)", "rgba(74,111,216,.25)", Math.max(1, s * .02));
    const cubes = [];
    for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) for (let z = 0; z < ht(x, y); z++) cubes.push([depth(x + .5, y + .5, z + .5), x, y, z]);
    cubes.sort((a, b) => a[0] - b[0]);
    const lw = Math.max(1.2 * dpr, s * 0.04);
    const shade = (nx, ny) => lerpCol(SIDE_DARK, SIDE_LIGHT, (1 + nx * LX + ny * LY) / 2);
    for (const [, x, y, z] of cubes) {
      if (CX < x && ht(x - 1, y) <= z) poly([P(x, y, z), P(x, y + 1, z), P(x, y + 1, z + 1), P(x, y, z + 1)], shade(-1, 0), EDGE, lw);
      if (CX > x + 1 && ht(x + 1, y) <= z) poly([P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], shade(1, 0), EDGE, lw);
      if (CY < y && ht(x, y - 1) <= z) poly([P(x, y, z), P(x + 1, y, z), P(x + 1, y, z + 1), P(x, y, z + 1)], shade(0, -1), EDGE, lw);
      if (CY > y + 1 && ht(x, y + 1) <= z) poly([P(x, y + 1, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], shade(0, 1), EDGE, lw);
      if (z === ht(x, y) - 1 && CZ > z + 1) {
        poly([P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], TOP, EDGE, lw);
        if (revealed) {   // đáp án: chữ đỏ ghi chiều cao cột lên đỉnh cột, vẽ ngay sau mặt đỉnh nên cột phía trước che được số cột phía sau
          const X = x + .5 - cx0, Y = y + .5 - cy0, Z = z + 1 - cz0, k = DIST / (DIST - (X * vx + Y * vy + Z * vz)), [px, py] = P(x + .5, y + .5, z + 1);
          g.font = `900 ${Math.round(Math.max(10 * dpr, s * k * 0.34))}px Nunito, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
          g.fillStyle = "#c0392b"; g.fillText(z + 1, px, py + s * k * 0.03);
        }
      }
    }
  }
  function poly(pts, fill, stroke, lw) {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath(); g.fillStyle = fill; g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
  }
  function frame(t) {
    const dt = Math.min(60, t - lastT); lastT = t;
    if (!paused && !drag && t - lastTouch > 2200) yaw += dt / 1000 * (2 * Math.PI / 16);   // 16 giây một vòng
    if (aimPitch !== null && !drag) { pitch += (aimPitch - pitch) * Math.min(1, dt / 180); if (Math.abs(aimPitch - pitch) < .002) aimPitch = null; }
    draw(); raf = requestAnimationFrame(frame);
  }
  cv.addEventListener("pointerdown", e => { aimPitch = null; drag = { x: e.clientX, y: e.clientY, yaw, pitch }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
  cv.addEventListener("pointermove", e => {
    if (!drag) return;
    yaw = drag.yaw + (e.clientX - drag.x) * 0.011;
    pitch = Math.max(0.12, Math.min(1.45, drag.pitch - (e.clientY - drag.y) * 0.009));
  });
  const endDrag = () => { if (drag) { drag = null; lastTouch = performance.now(); } };
  cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
  const big = W * D >= 49;
  ctx.tools([
    { id: "spin", label: () => ctx.tr(paused ? "t_play" : "t_pause"), always: true, on() { paused = !paused; ctx.prompt(); paintSpin(); } },
    { id: "view", label: "t_view", always: true, on() { aimPitch = 0.56; lastTouch = -1e9; zi = 0; paintZoom(); } },
    ...(big ? [
      { id: "zin", label: "t_zin", always: true, on() { zi = Math.min(ZOOMS.length - 1, zi + 1); paintZoom(); } },
      { id: "zout", label: "t_zout", always: true, on() { zi = Math.max(0, zi - 1); paintZoom(); } },
    ] : []),
    { id: "giveup", label: "t_giveup", confirm: "t_giveup_sure", cls: "danger wide", on: () => ctx.giveUp() },   // bấm 2 lần mới bỏ cuộc (giống Slitherlink)
  ]);
  function paintSpin() { const b = document.querySelector('#pkTools [data-tool="spin"]'); if (b) b.textContent = ctx.tr(paused ? "t_play" : "t_pause"); }
  function paintZoom() {
    const a = document.querySelector('#pkTools [data-tool="zin"]'), b = document.querySelector('#pkTools [data-tool="zout"]');
    if (a) a.disabled = zi >= ZOOMS.length - 1; if (b) b.disabled = zi <= 0;
  }
  paintZoom();
  // lăn chuột trên khối hình cũng phóng to/thu nhỏ
  if (big) cv.addEventListener("wheel", e => { e.preventDefault(); zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + (e.deltaY < 0 ? 1 : -1))); paintZoom(); }, { passive: false });
  size(); raf = requestAnimationFrame(frame);
  return {
    resize: size,
    reveal() { revealed = true; paused = true; aimPitch = 1.2; paintSpin(); },   // nghiêng gần nhìn từ trên để đọc số trên đỉnh cột
    lang() { paintSpin(); paintZoom(); },
    destroy() { cancelAnimationFrame(raf); },
  };
}

/* ---------- THẺ LUẬT CHƠI ---------- */
/* Vẽ khối isometric từ bản đồ chiều cao H[y][x] (cùng màu với game); labels: ghi chiều cao lên đỉnh mỗi cột */
const CCR_H = [[3, 2, 1], [2, 2, 1], [1, 1, 1]];   // 14 khối, cột cao ở phía sau nên đỉnh nào cũng thấy
function ccrIso(H, labels, arrow) {
  const s = 17, kx = s * .866, ky = s * .5, P = (x, y, z) => [(x - y) * kx, (x + y) * ky - z * s];
  const cubes = [];
  H.forEach((row, y) => row.forEach((h, x) => { for (let z = 0; z < h; z++) cubes.push([x, y, z, z === h - 1 ? h : 0]); }));
  cubes.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[2] - b[2]);
  const pts = [], poly = (cs, fill) => { const q = cs.map(c => P(...c)); pts.push(...q); return `<polygon points="${q.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="${fill}"/>`; };
  let g = "", txt = "";
  for (const [x, y, z, top] of cubes) {
    g += poly([[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], "#f8efdc")
       + poly([[x, y + 1, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], "rgb(236,220,188)")
       + poly([[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]], "rgb(176,150,112)");
    if (labels && top) { const [cx, cy] = P(x + .5, y + .5, z + 1); txt += `<text x="${cx.toFixed(1)}" y="${(cy + 4).toFixed(1)}">${top}</text>`; }
  }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x0 = Math.min(...xs) - 3, y0 = Math.min(...ys) - 3, w = Math.max(...xs) - x0 + 3, h = Math.max(...ys) - y0 + 3, arr = "";
  if (arrow) {   // mũi tên cong bên dưới: khối đang xoay
    const by = y0 + h + 4, l = x0 + 2, r = x0 + w - 2;
    arr = `<path d="M${l} ${by} Q${(l + r) / 2} ${by + 16} ${r - 2} ${by}" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linecap="round"/>`
        + `<path d="M${r - 9} ${by - 2} L${r} ${by - 2} L${r - 4} ${by + 7}" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    h += 20;
  }
  return `<svg class="ccr-svg" width="${w.toFixed(0)}" height="${h.toFixed(0)}" viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" aria-hidden="true">`
    + `<g stroke="#3a2f26" stroke-width="1.1" stroke-linejoin="round">${g}</g>`
    + `<g fill="#c0392b" font-family="Nunito,sans-serif" font-weight="900" font-size="10.5" text-anchor="middle">${txt}</g>${arr}</svg>`;
}
const CC_CARDS = [
  { h: "c1_h", p: "c1_p", fig: () => ccrIso(CCR_H, false, true) },
  { h: "c2_h", p: "c2_p", fig: () => `<span class="ccr-t">= 14</span>` + ccrIso(CCR_H, true) },
  { h: "c3_h", p: "c3_p", fig: () => `<div class="ccr-in">14<span class="ccr-ic" style="background:#1e9e57">✓</span></div>`
      + `<div class="ccr-row"><span class="ccr-pill bad"><s>13</s><span class="ccr-ic" style="background:#e74c3c;width:16px;height:16px;font-size:9px">✕</span></span><span class="ccr-pill">⏱ +5</span></div>` },
];
