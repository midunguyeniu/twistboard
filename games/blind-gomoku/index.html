<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ Ca-rô Mù · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<style>
:root{
  --S:600px; --cell:40px;
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold:#ffc928; --gold-ink:var(--tb-gold-ink);
  --wood:#efc27a; --wood-2:#e3ab58; --grid:#5b3f22;
  /* màu quân: Rõ ràng (đen/trắng), Mù (1 tông duy nhất) */
  --st-1:radial-gradient(circle at 34% 30%,#61656f,#17191e 62%);
  --st-2:radial-gradient(circle at 34% 30%,#fff,#e6e1d3 72%);
  --blind:radial-gradient(circle at 34% 30%,#8d7ea0,#4f4262 64%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.92)}
#app{width:fit-content;margin:0 auto;padding:14px 12px 28px}
body.portrait #app{width:100%;padding:8px 8px 24px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.actions{display:flex;gap:8px}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}

#status{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);margin-bottom:12px;font-size:14px;min-height:42px}
#status .muted{color:var(--muted)}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #2b2f3a}
.dot.c1{background:#1b1b1b;border-color:#1b1b1b} .dot.c2{background:#fffdf3} .dot.c0{background:#999}
.dot.think{animation:blink .9s infinite}
@keyframes blink{50%{opacity:.2}}

#stage{display:flex;gap:20px;align-items:flex-start;justify-content:center}
#boardWrap{position:relative;flex:none}
#board{position:relative;width:var(--S);height:var(--S);background:linear-gradient(135deg,var(--wood),var(--wood-2));border-radius:6px;
  box-shadow:0 0 0 6px #fff,0 0 0 7px var(--tb-border),0 14px 34px rgba(20,30,60,.22);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stones{position:absolute;inset:0;pointer-events:none}
.st{position:absolute;left:calc((var(--c) + .5) * var(--cell));top:calc((var(--r) + .5) * var(--cell));
  width:calc(var(--cell) * .86);height:calc(var(--cell) * .86);margin:calc(var(--cell) * -.43) 0 0 calc(var(--cell) * -.43);
  border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.35);background:var(--blind);transition:background .6s}
.st.new{animation:drop .22s cubic-bezier(.2,.9,.3,1.3)}
@keyframes drop{0%{transform:scale(1.35);opacity:0}100%{transform:none;opacity:1}}
body.look-classic .st.k1,body.reveal .st.k1{background:var(--st-1)}
body.look-classic .st.k2,body.reveal .st.k2{background:var(--st-2)}
.st.ghost{opacity:.42;box-shadow:none}
.st.last::after{content:"";position:absolute;inset:-14%;border:2.5px solid #ff7a1a;border-radius:5px;opacity:.95}
.st.last.mine::after{border-color:#1fae4b}     /* nước vừa đi của người chơi trên máy này: xanh lá */
.st.last.theirs::after{border-color:#e5322b}   /* nước vừa đi của đối thủ (AI hoặc người ở máy kia): đỏ */
.st.win{box-shadow:0 0 0 3px #1fae4b,0 0 14px 4px rgba(31,174,75,.75);animation:winpulse 1s infinite}   /* 5 quân thắng: viền xanh lá */
@keyframes winpulse{50%{box-shadow:0 0 0 3px #1fae4b,0 0 22px 8px rgba(31,174,75,.45)}}

.side{width:300px;flex:none;display:flex;flex-direction:column;gap:10px}
.panel{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px;row-gap:8px;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:2px solid var(--line);box-shadow:var(--tb-shadow);transition:border-color .2s,box-shadow .2s}
.panel.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,40,.35)}
.pdot{width:28px;height:28px;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pdot.c1{background:var(--st-1)} .pdot.c2{background:var(--st-2);box-shadow:0 0 0 1px #d8d2c2,0 2px 3px rgba(0,0,0,.25)}
.pinfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.pinfo b{font-size:15px}
.pinfo span{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptime{font-family:var(--tb-font-brand);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.panel.active .ptime{color:var(--text)}
.ptime.low{color:#d9362b!important;animation:blink .5s infinite}
.pbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--tb-green);border-radius:99px;transform-origin:left;transition:background .3s}
.pbar i.low{background:#e5453b}
#info{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);font-size:13.5px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
#info dt{color:var(--muted)} #info dd{margin:0;font-weight:800;text-align:right}
#tip{margin:10px 0 0;color:var(--gold-ink);font-weight:700;line-height:1.4}

#gameover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,25,40,.35);z-index:20;animation:fade .3s;border-radius:6px}
.go-card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:22px 26px;text-align:center;max-width:90%;box-shadow:var(--tb-shadow-lg)}
.go-card h2{margin:0 0 6px;font-family:var(--tb-font-brand);font-size:30px}
.go-card p{margin:0 0 16px;color:var(--muted)}
.go-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#goNet{margin:-8px 0 14px}
#goNet:empty{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg);position:relative}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:12.5px}
.credit{margin-right:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg button:disabled{cursor:not-allowed;pointer-events:none}
#segLevel button{min-width:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#segLevel button small{font-size:10px;font-weight:700;opacity:.75}
#segLook button .sw{display:inline-flex;gap:3px;vertical-align:-3px;margin-right:8px}
#segLook button .sw i{width:14px;height:14px;border-radius:50%;display:block}
#segSide button[data-v="black"]{background:#141414;color:#f4f1ea;border-color:#5a5a5a;opacity:.82}
#segSide button[data-v="white"]{background:#f4f1ea;color:#1b1b1b;border-color:#d9d3c2;opacity:.82}
#segSide button.on{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.off{opacity:.28;filter:grayscale(1)}
.off .seg button.on{background:var(--btn);color:var(--text);border-color:var(--line);box-shadow:none}
.trow{display:flex;align-items:center;gap:14px}
.trow input[type=range]{flex:1;accent-color:#e3a300}
.trow b{min-width:72px;text-align:right;font-size:16px}
#levelNote,#lookNote{min-height:2.8em;line-height:1.4;margin:6px 0 0}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 240px}
#joinCode{flex:1 1 140px;min-width:0;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;font-size:18px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
#joinCode:disabled{opacity:.35}
#mNet .card{max-width:460px;text-align:center}
#mNet .foot{justify-content:center}
.netcode{font-family:var(--tb-font-brand);font-size:46px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:4px 0 12px;user-select:all}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#netMsg{color:var(--muted);margin:14px 0 0}

body.portrait .brand{display:none}
body.portrait .actions{width:100%} body.portrait #btnNew{margin-left:auto}
body.portrait #status{font-size:13px;margin-bottom:8px;height:58px}
body.portrait #stage{flex-direction:column;align-items:center;gap:10px}
body.portrait .side{display:contents}
body.portrait .panel{width:var(--S)}
body.portrait .panel.top-p{order:1} body.portrait #boardWrap{order:2} body.portrait .panel.bot-p{order:3} body.portrait #info{order:4;width:var(--S)}
body.portrait .ptime{font-size:22px}
@media (max-width:600px){#segLevel button{flex:0 0 calc((100% - 24px) / 4)}#segLevel{justify-content:center}
  #segLook button{min-width:0;padding:10px 4px;font-size:13.5px;white-space:nowrap}#segLook button .sw{display:none}}
</style>
</head>
<body class="look-blind">
<div id="tb-header"></div>
<script>TB.mountHeader({ page: "game", gameId: "blind-gomoku" });</script>
<div id="app">
  <header class="top">
    <div class="brand"><h1 data-i18n="brand">Cờ Ca-rô Mù</h1></div>
    <div class="actions">
      <button class="btn" id="btnRules" data-i18n="b_rules">Luật chơi</button>
      <button class="btn primary" id="btnNew" data-i18n="b_new">Ván mới</button>
    </div>
  </header>
  <div id="status"><span class="dot c1" id="stDot"></span><span id="statusText"></span></div>
  <main id="stage">
    <div id="boardWrap">
      <div id="board"><svg id="grid" viewBox="0 0 15 15" aria-hidden="true"></svg><div id="stones"></div></div>
      <div id="gameover" hidden>
        <div class="go-card">
          <h2 id="goTitle"></h2>
          <p id="goSub"></p>
          <p class="note" id="goNet"></p>
          <div class="row">
            <button class="btn primary" id="goNew" data-i18n="b_new">Ván mới</button>
            <button class="btn" id="goView" data-i18n="b_view">Xem bàn cờ</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side">
      <section class="panel" id="panel-1"><span class="pdot c1"></span><div class="pinfo"><b></b><span></span></div><div class="ptime"></div><div class="pbar"><i></i></div></section>
      <section class="panel" id="panel-2"><span class="pdot c2"></span><div class="pinfo"><b></b><span></span></div><div class="ptime"></div><div class="pbar"><i></i></div></section>
      <section id="info"><dl id="infoList"></dl><p id="tip"></p></section>
    </aside>
  </main>
</div>

<div class="modal" id="mRules" hidden>
  <div class="card">
    <h2 data-i18n="brand">Cờ Ca-rô Mù</h2>
    <p data-i18n="r_intro"></p>
    <h3 data-i18n="r_h_rules"></h3>
    <ul><li data-i18n="r_turn"></li><li data-i18n="r_win"></li><li data-i18n="r_time"></li><li data-i18n="r_occ"></li><li data-i18n="r_draw"></li></ul>
    <h3 data-i18n="r_h_look"></h3>
    <ul><li data-i18n="r_classic"></li><li data-i18n="r_blind"></li><li data-i18n="r_reveal"></li></ul>
    <h3 data-i18n="r_h_opp"></h3>
    <ul><li data-i18n="r_ai"></li><li data-i18n="r_online"></li></ul>
    <p class="note" data-i18n="r_inspired"></p>
    <div class="foot"><span class="note credit" data-i18n="r_credit"></span><button class="btn primary" id="rulesOk" data-i18n="r_ok"></button></div>
  </div>
</div>

<div class="modal" id="mMode" hidden>
  <div class="card">
    <h2 data-i18n="m_title"></h2>
    <h3 data-i18n="m_vs"></h3>
    <div class="seg" id="segVs"><button data-v="bot" data-i18n="m_bot"></button><button data-v="online" data-i18n="m_online"></button></div>
    <div id="netOpts">
      <h3 data-i18n="m_net"></h3>
      <div class="netrow">
        <div class="seg" id="segNet"><button data-v="create" data-i18n="m_create"></button><button data-v="join" data-i18n="m_join"></button></div>
        <input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <p class="note" id="netNote"></p>
    </div>
    <div id="ruleOpts">
      <h3 data-i18n="m_look"></h3>
      <div class="seg" id="segLook">
        <button data-v="classic"><span class="sw"><i style="background:var(--st-1)"></i><i style="background:var(--st-2);box-shadow:0 0 0 1px #ccc"></i></span><span data-i18n="look_classic"></span></button>
        <button data-v="blind"><span class="sw"><i style="background:var(--blind)"></i><i style="background:var(--blind)"></i></span><span data-i18n="look_blind"></span></button>
      </div>
      <p class="note" id="lookNote"></p>
      <h3 data-i18n="m_time"></h3>
      <div class="trow"><input type="range" id="timeRange" min="0" max="9" step="1"><b id="timeVal"></b></div>
      <h3 data-i18n="m_side"></h3>
      <div class="seg" id="segSide"><button data-v="black" data-i18n="m_black"></button><button data-v="white" data-i18n="m_white"></button></div>
    </div>
    <div id="levelOpts">
      <h3 data-i18n="m_level"></h3>
      <div class="seg" id="segLevel"></div>
      <p class="note" id="levelNote"></p>
    </div>
    <div class="foot">
      <button class="btn" id="modeCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="modeStart" data-i18n="m_start"></button>
    </div>
  </div>
</div>

<div class="modal" id="mNet" hidden>
  <div class="card">
    <h2 id="netTitle"></h2>
    <div id="netCodeBox" hidden>
      <div class="netcode" id="netCode"></div>
      <div class="netlink"><input id="netLink" readonly><button class="btn" id="netCopy" data-i18n="n_copy"></button></div>
    </div>
    <p id="netMsg"></p>
    <div class="foot"><button class="btn" id="netCancel" data-i18n="cancel"></button></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   CỜ CA-RÔ MÙ (BLIND GOMOKU)
   Luật theo Devil's Gomoku: bàn 15x15, Đen đi trước, đúng 5 quân liền hàng thì thắng (6+ không tính),
   mỗi lượt có giới hạn giờ (hết giờ là thua), 2 kiểu quân: Rõ ràng / Mù (bản gốc còn có Sương mù, chủ game bỏ).
   Toạ độ: ô i = r*15 + c (r hàng 0-14 từ trên xuống, c cột 0-14 từ trái sang). Màu quân: 1 = Đen, 2 = Trắng.
   ============================================================ */
const $ = (s, root = document) => root.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const N = 15, NN = N * N;

/* ---------- ĐA NGÔN NGỮ (vi / en) ---------- */
const I18N = {
vi: {
  title: "Cờ Ca-rô Mù", brand: "Cờ Ca-rô Mù",
  b_rules: "Luật chơi", b_new: "Ván mới", b_view: "Xem bàn cờ", cancel: "Huỷ",
  r_intro: "Cờ ca-rô trên bàn 15x15, nhưng quân cờ có thể <b>trông giống hệt nhau</b>. Bạn phải tự nhớ quân nào của mình, quân nào của đối thủ.",
  r_h_rules: "Luật chơi",
  r_turn: "<b>Đen đi trước</b>. Hai bên lần lượt đặt 1 quân vào một giao điểm còn trống.",
  r_win: "Ai có <b>đúng 5 quân</b> liền nhau trước (ngang, dọc hoặc chéo) thì thắng. Hàng 6 quân trở lên <b>không tính</b>.",
  r_time: "Mỗi lượt có giới hạn thời gian. <b>Hết giờ là thua.</b>",
  r_occ: "Bấm vào chỗ đã có quân thì không có gì xảy ra, bạn chọn chỗ khác là được.",
  r_draw: "Bàn kín quân mà chưa ai thắng thì hoà.",
  r_h_look: "Kiểu quân",
  r_classic: "<b>Rõ ràng</b>: quân Đen và quân Trắng như cờ ca-rô thường.",
  r_blind: "<b>Mù</b>: mọi quân giống hệt nhau. Chỉ có nước vừa đi được đánh dấu.",
  r_reveal: "Hết ván, màu thật của mọi quân sẽ hiện ra.",
  r_h_opp: "Đối thủ",
  r_ai: "<b>AI</b> có 7 mức, từ IQ 40 đến IQ 160. Ở mức thấp, AI cũng hay nhớ nhầm quân giống người.",
  r_online: "<b>Chơi online</b>: một người tạo phòng rồi gửi mã 5 ký tự hoặc link mời cho bạn. Chủ phòng chọn kiểu quân, thời gian và bên cầm quân. Chơi lại thì hai bên đổi màu.",
  r_inspired: "Lấy cảm hứng từ trò Blind Omok trong The Devil's Plan.",
  r_credit: "Game được làm bởi Gary Duc Nguyen", r_ok: "Đã hiểu", m_back: "Xem lại Luật chơi",
  m_title: "Ván mới", m_vs: "Đối thủ", m_bot: "Chơi với AI", m_online: "Chơi online",
  m_net: "Phòng online", m_create: "Tạo phòng", m_join: "Vào phòng", m_code_ph: "Mã phòng",
  m_net_create: "Kiểu quân, thời gian và bên cầm quân bạn chọn ở dưới sẽ áp dụng cho cả hai người.",
  m_net_join: "Nhập mã phòng bạn bè gửi, hoặc mở thẳng link mời của họ. Chủ phòng chọn luật.",
  m_look: "Kiểu quân", look_classic: "Rõ ràng", look_blind: "Mù",
  lookn_classic: "Quân Đen và quân Trắng khác màu, như cờ ca-rô thường.",
  lookn_blind: "Mọi quân giống hệt nhau. Bạn phải tự nhớ quân nào của ai.",
  m_time: "Thời gian mỗi lượt", m_time_v: "{0} giây",

/* ---------- ÂM THANH (tổng hợp bằng Web Audio, không cần file) ---------- */
let AC = null;
try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
function tone(freq, start, dur, type = "sine", vol = .18) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + .01); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.start(start); o.stop(start + dur + .02);
}
function sfx(name) {
  if (!AC) return;
  try {
    if (AC.state !== "running") AC.resume().catch(() => {});
    const t = AC.currentTime + .01;
    if (name === "stone") {   // tiếng "cạch" của quân cờ: tiếng ồn ngắn lọc dải + tiếng trầm
      const len = Math.floor(AC.sampleRate * .05), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      f.type = "bandpass"; f.frequency.value = 2200; f.Q.value = 1.2; g.gain.value = .55;
      src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
      tone(160, t, .09, "sine", .22);
    } else if (name === "win") [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .11, .3, "triangle", .2));
    else if (name === "lose") [392, 330, 262, 196].forEach((f, i) => tone(f, t + i * .15, .35, "triangle", .18));
    else if (name === "draw") [440, 440].forEach((f, i) => tone(f, t + i * .18, .25, "triangle", .16));
    else if (name === "tick") tone(1100, t, .05, "square", .05);
  } catch (e) {}
}

/* ---------- TRẠNG THÁI ---------- */
let bd = new Int8Array(NN), turn = 1, over = null, moves = [], started = false, gameId = 0, overDismissed = false;
let aiMem = new Map();   // trí nhớ của AI: ô → { c: màu AI tin là đúng, t: số thứ tự nước đi }

const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const inb = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
/* Trả về 5 ô nếu quân màu c ở ô i (đã đặt) tạo thành hàng ĐÚNG 5 quân, ngược lại null. Hàng 6+ không tính. */
function runFive(b, i, c) {
  const r = (i / N) | 0, cc = i % N;
  for (const [dr, dc] of DIRS) {
    const cells = [i];
    let rr = r + dr, c2 = cc + dc;
    while (inb(rr, c2) && b[rr * N + c2] === c) { cells.push(rr * N + c2); rr += dr; c2 += dc; }
    rr = r - dr; c2 = cc - dc;
    while (inb(rr, c2) && b[rr * N + c2] === c) { cells.push(rr * N + c2); rr -= dr; c2 -= dc; }
    if (cells.length === 5) return cells;
  }
  return null;
}
function isFiveMove(b, i, c) { if (b[i]) return false; b[i] = c; const f = runFive(b, i, c); b[i] = 0; return !!f; }

/* ---------- KHỞI TẠO VÁN ---------- */
function newGame(blank) {

function place(i) {   // đặt quân cho bên đang tới lượt (mọi nước đi thật đều qua đây)
  const c = turn;
  bd[i] = c; moves.push(i); aiMem.set(i, { c, t: moves.length });
  newStone = i; sfx("stone");
  const line = runFive(bd, i, c);
  if (line) over = { winner: c, line, move: moves.length };
  else if (moves.length === NN) over = { winner: 0, move: moves.length };
  else turn = 3 - c;

}
function timeUp(c) {   // bên c hết giờ: thua

  over = { winner: 3 - c, timeout: c, move: moves.length };

}
function clickCell(i) {
  if (!started || over || !isLocal(turn) || bd[i]) return;   // ô đã có quân: bỏ qua, không phạt (giống bản gốc)
  place(i);
  if (MODE.vs === "online") netSend({ t: "mv", i, h: stateHash() });

/* ---------- ĐỒNG HỒ MỖI LƯỢT ---------- */
let deadline = 0, clockTimer = null, lastTick = 0, lastBeep = -1;
function startClock() {
  lastBeep = -1;
  deadline = started && !over && !isBot(turn) ? performance.now() + MODE.time * 1000 : 0;   // AI không bị tính giờ (AI đi trong khoảng 1 giây)
  lastTick = performance.now();

}
function anyModal() { return [...document.querySelectorAll(".modal")].some(m => !m.hidden); }
function tickClock() {

  if (!deadline || over || !started) return;
  if (MODE.vs === "bot" && anyModal()) { deadline += dt; return; }   // chơi với AI: mở bảng Luật chơi / Ván mới thì đồng hồ tạm dừng
  const left = deadline - now;
  if (isLocal(turn)) {
    const s = Math.ceil(left / 1000);
    if (s <= 5 && s > 0 && s !== lastBeep) { lastBeep = s; sfx("tick"); }
    if (left <= 0) {
      timeUp(turn);

    }

}
const timeLeft = () => Math.max(0, deadline - performance.now());

  const peer = NET.peer, conn = NET.conn;
  NET.peer = NET.conn = null; NET.playing = false; NET.rm = { me: false, them: false };
  if (peer || conn) setTimeout(() => { try { if (conn) conn.close(); } catch (e) {} try { if (peer) peer.destroy(); } catch (e) {} }, bye ? 400 : 0);
}

/* ---------- RENDER ---------- */
const boardEl = $("#board"), stonesEl = $("#stones");
const stoneEls = new Map();
let newStone = -1, hoverCell = -1;
const ghostEl = document.createElement("div"); ghostEl.className = "st ghost"; ghostEl.hidden = true; stonesEl.appendChild(ghostEl);
(function buildGrid() {
  let s = "";
  for (let k = 0; k < N; k++) {
    s += `<line x1="0.5" y1="${k + .5}" x2="14.5" y2="${k + .5}"/><line x1="${k + .5}" y1="0.5" x2="${k + .5}" y2="14.5"/>`;
  }
  for (const r of [3, 7, 11]) for (const c of [3, 7, 11]) s += `<circle cx="${c + .5}" cy="${r + .5}" r=".11" fill="var(--grid)"/>`;
  $("#grid").innerHTML = `<g stroke="var(--grid)" stroke-width=".045" stroke-linecap="square">${s}</g>`;
})();
const sideName = c => tr("n_" + c);
function renderBoard() {
  const last = moves.length ? moves[moves.length - 1] : -1, win = over && over.line ? over.line : [];
  document.body.classList.toggle("reveal", !!over);
  for (const i of moves) {
    let e = stoneEls.get(i);
    if (!e) {
      e = document.createElement("div");
      e.style.setProperty("--r", (i / N) | 0); e.style.setProperty("--c", i % N);
      stonesEl.appendChild(e); stoneEls.set(i, e);
    }
    e.className = "st k" + bd[i] + (i === last ? " last " + (bd[i] === humanC() ? "mine" : "theirs") : "") + (win.includes(i) ? " win" : "") + (i === newStone ? " new" : "");
  }
  newStone = -1;
  const showGhost = hoverCell >= 0 && started && !over && isLocal(turn) && !bd[hoverCell];
  ghostEl.hidden = !showGhost;
  if (showGhost) {
    ghostEl.className = "st ghost k" + turn;
    ghostEl.style.setProperty("--r", (hoverCell / N) | 0); ghostEl.style.setProperty("--c", hoverCell % N);
  }
  boardEl.style.cursor = showGhost ? "pointer" : "default";
}
function roleOf(c) {
  if (isBot(c)) return tr("role_bot", MODE.level);
  if (isRemote(c)) return tr("role_opp");
  return tr("role_you");
}
function renderClocks() {
  for (const c of [1, 2]) {
    const p = $("#panel-" + c), t = p.querySelector(".ptime"), bar = p.querySelector(".pbar i");
    const active = started && !over && turn === c;
    p.classList.toggle("active", active);
    if (isBot(c)) { t.textContent = ""; t.classList.remove("low"); bar.style.transform = "scaleX(1)"; bar.classList.remove("low"); continue; }
    const left = active && deadline ? timeLeft() : MODE.time * 1000;
    const s = Math.ceil(left / 1000);
    t.textContent = s + "s";
    t.classList.toggle("low", active && s <= 5);
    bar.style.transform = `scaleX(${Math.max(0, Math.min(1, left / (MODE.time * 1000)))})`;
    bar.classList.toggle("low", active && s <= 5);
  }
}
function renderPanels() {
  // màn dọc: đối thủ ở trên, mình ở dưới bàn cờ
  for (const c of [1, 2]) {
    const p = $("#panel-" + c);
    p.querySelector(".pinfo b").textContent = sideName(c);
    p.querySelector(".pinfo span").textContent = started ? roleOf(c) : "";
    p.classList.toggle("top-p", c !== humanC()); p.classList.toggle("bot-p", c === humanC());
  }
  const side = $(".side");   // màn ngang: đối thủ ở trên, mình ở dưới
  if (humanC() === 1) side.insertBefore($("#panel-2"), $("#panel-1")); else side.insertBefore($("#panel-1"), $("#panel-2"));
  renderClocks();
}
function renderStatus() {
  const dot = $("#stDot"); let h;
  dot.className = "dot c" + (over ? (over.winner || 0) : turn);
  if (!started) h = tr("st_notstarted");
  else if (over) {
    const me = humanC();
    if (over.aborted) h = tr("st_aborted");
    else if (over.left) h = tr("st_left");
    else if (over.winner === 0) h = tr("st_draw");
    else if (over.timeout) h = over.timeout === me ? tr("st_to_you") : tr("st_to_opp");
    else h = over.winner === me ? tr("st_win_you") : MODE.vs === "bot" ? tr("st_win_bot") : tr("st_win_opp");
  }
  else if (isBot(turn)) { h = tr("st_bot"); dot.classList.add("think"); }
  else if (isRemote(turn)) h = tr("st_remote", sideName(turn));
  else h = tr("st_you", sideName(turn));
  $("#statusText").innerHTML = h;
}
function renderInfo() {
  $("#infoList").innerHTML = `<dt>${tr("i_look")}</dt><dd>${tr("look_" + MODE.look)}</dd><dt>${tr("i_time")}</dt><dd>${tr("i_time_v", MODE.time)}</dd><dt>${tr("i_moves")}</dt><dd>${moves.length}</dd>`;
  $("#tip").textContent = tr("tip_" + MODE.look);
}
function renderOver() {
  const go = $("#gameover");
  if (!over || overDismissed) { go.hidden = true; return; }
  const me = humanC();
  if (go.hidden) sfx(over.aborted ? "draw" : over.winner === 0 ? "draw" : over.winner === me ? "win" : "lose");
  go.hidden = false;
  $("#goTitle").textContent = over.aborted ? tr("go_aborted") : over.winner === 0 ? tr("go_draw") : over.timeout === me ? tr("go_timeout")
    : over.winner === me ? tr("go_you") : MODE.vs === "bot" ? tr("go_bot") : tr("go_opp");
  $("#goSub").textContent = over.aborted ? tr("gs_aborted") : over.left ? tr("gs_left") : over.winner === 0 ? tr("gs_draw")
    : over.timeout ? (over.timeout === me ? tr("gs_to_you") : tr("gs_to_opp")) : tr("gs_five", over.move);
  const rematch = MODE.vs === "online" && netOpen();
  $("#goNew").textContent = tr(rematch ? "go_rematch" : "b_new");
  $("#goNew").disabled = rematch && NET.rm.me;
  $("#goNet").textContent = !rematch ? "" : NET.rm.me ? tr("go_rm_wait") : NET.rm.them ? tr("go_rm_them") : "";
}
function render() { renderBoard(); renderPanels(); renderStatus(); renderInfo(); renderOver(); }

/* ---------- KÍCH THƯỚC ---------- */
function fit() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight - ((document.getElementById("tb-header") || {}).offsetHeight || 0);
  const portrait = vw < 860;
  document.body.classList.toggle("portrait", portrait);
  let S = portrait ? vw - 16 - 14 : Math.min(vw - 24 - 300 - 20 - 14, vh - 150);
  S = Math.max(300, Math.min(S, 720));
  const cell = Math.floor(S / N); S = cell * N;
  document.documentElement.style.setProperty("--S", S + "px");
  document.documentElement.style.setProperty("--cell", cell + "px");
}

/* ---------- BẢNG CHỌN CHẾ ĐỘ ---------- */
let modeDraft = null;
$("#segLevel").innerHTML = LEVELS.map(l => `<button data-v="${l}"><span>IQ ${l}</span><small data-i18n="lv_${l}"></small></button>`).join("");
const MODE_SEGS = [["#segVs", "vs"], ["#segNet", "net"], ["#segLook", "look"], ["#segSide", "human"], ["#segLevel", "level"]];
function syncMode() {
  for (const [id, key] of MODE_SEGS) document.querySelectorAll(id + " button").forEach(b => b.classList.toggle("on", b.dataset.v === modeDraft[key]));
  const online = modeDraft.vs === "online", join = online && modeDraft.net === "join";
  $("#netOpts").classList.toggle("off", !online);
  $("#segNet").querySelectorAll("button").forEach(b => { b.disabled = !online; });
  $("#joinCode").disabled = !join; $("#joinCode").placeholder = tr("m_code_ph");
  if (!$("#joinCode").value && modeDraft.code) $("#joinCode").value = modeDraft.code;
  $("#netNote").textContent = tr(join ? "m_net_join" : "m_net_create");
  $("#ruleOpts").classList.toggle("off", join);   // vào phòng người khác: chủ phòng chọn luật
  $("#ruleOpts").querySelectorAll("button,input").forEach(b => { b.disabled = join; });
  $("#levelOpts").classList.toggle("off", online);
  $("#segLevel").querySelectorAll("button").forEach(b => { b.disabled = online; });
  $("#lookNote").textContent = tr("lookn_" + modeDraft.look);
  $("#levelNote").textContent = "IQ " + modeDraft.level + " · " + tr("lv_" + modeDraft.level) + ": " + tr("lvn_" + modeDraft.level);
  $("#timeRange").value = TIMES.indexOf(+modeDraft.time);
  $("#timeVal").textContent = tr("m_time_v", modeDraft.time);
  $("#modeStart").textContent = online ? tr(join ? "m_join" : "m_create") : started && !over ? tr("m_forfeit") : tr("m_start");
  if (!started) { MODE.look = modeDraft.look; applyLook(); }
}
function openMode() {
  modeDraft = clone(PREFS); modeDraft.net = MODE.net || "create"; modeDraft.code = "";
  syncMode();
  $("#modeCancel").textContent = started ? tr("cancel") : tr("m_back");
  $("#mMode").hidden = false;
}
let returnToMode = true;
function openRules() { $("#mRules").hidden = false; }

/* ---------- NGÔN NGỮ ---------- */
function setLang(l) {
  LANG = l; try { localStorage.setItem("lang", l); } catch (e) {}
  if (window.TB) TB.setLang(l);
  applyI18n(); if (modeDraft && !$("#mMode").hidden) syncMode();
  render();
}
if (window.TB) TB.onLang(l => { if (l !== LANG) setLang(l); });

/* ---------- SỰ KIỆN ---------- */
for (const [id, key] of MODE_SEGS)
  document.querySelectorAll(id + " button").forEach(b => b.addEventListener("click", () => {
    modeDraft[key] = b.dataset.v; syncMode();
    if (modeDraft.vs === "online" && modeDraft.net === "join" && (key === "net" || key === "vs")) $("#joinCode").focus();
  }));
$("#timeRange").addEventListener("input", e => { modeDraft.time = TIMES[+e.target.value] || 90; syncMode(); });
$("#joinCode").addEventListener("input", e => { const v = normCode(e.target.value); if (e.target.value !== v) e.target.value = v; });
$("#joinCode").addEventListener("keydown", e => { if (e.key === "Enter") $("#modeStart").click(); });
$("#netCancel").addEventListener("click", () => { netClose(true); $("#mNet").hidden = true; if (!started) openMode(); });
$("#netCopy").addEventListener("click", () => {
  const inp = $("#netLink"), btn = $("#netCopy");
  const done = () => { btn.textContent = tr("n_copied"); setTimeout(() => { btn.textContent = tr("n_copy"); }, 1500); };
  const legacy = () => { inp.select(); try { document.execCommand("copy"); done(); } catch (e) {} };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, legacy); else legacy();
});
window.addEventListener("pagehide", () => { if (netOpen()) try { NET.conn.send({ t: "bye" }); } catch (e) {} });
$("#modeCancel").addEventListener("click", () => {
  $("#mMode").hidden = true;
  if (!started) { MODE.look = PREFS.look; applyLook(); returnToMode = true; openRules(); }
});
$("#modeStart").addEventListener("click", () => {
  for (const k of ["vs", "human", "level", "look", "time"]) if (!(modeDraft.vs === "online" && modeDraft.net === "join" && k !== "vs")) PREFS[k] = modeDraft[k];
  savePrefs();
  if (modeDraft.vs === "online") {
    if (modeDraft.net === "join") {
      modeDraft.code = normCode($("#joinCode").value);
      if (modeDraft.code.length !== CODE_LEN) { $("#netNote").textContent = tr("n_err_code"); $("#joinCode").focus(); return; }
    }
    return startOnline();
  }
  netClose(true);
  MODE = clone(modeDraft); $("#mMode").hidden = true; newGame(false);
});
function cellFromEvent(e) {
  const rect = boardEl.getBoundingClientRect(), cw = rect.width / N;
  const c = Math.floor((e.clientX - rect.left) / cw), r = Math.floor((e.clientY - rect.top) / cw);
  return inb(r, c) ? r * N + c : -1;
}
boardEl.addEventListener("click", e => { const i = cellFromEvent(e); if (i >= 0) clickCell(i); });
boardEl.addEventListener("mousemove", e => { const i = cellFromEvent(e); if (i !== hoverCell) { hoverCell = i; renderBoard(); } });
boardEl.addEventListener("mouseleave", () => { hoverCell = -1; renderBoard(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#mNet").hidden) $("#netCancel").click();
  else if (!$("#mRules").hidden) $("#rulesOk").click();
  else if (!$("#mMode").hidden) { if (started) $("#mMode").hidden = true; }
});
$("#btnNew").addEventListener("click", () => {
  if (MODE.vs === "online" && netOpen() && over) { overDismissed = false; return renderOver(); }
  openMode();
});
$("#goNew").addEventListener("click", () => { if (MODE.vs === "online" && netOpen()) return requestRematch(); openMode(); });
$("#goView").addEventListener("click", () => { overDismissed = true; renderOver(); });
$("#btnRules").addEventListener("click", () => { returnToMode = false; openRules(); });
$("#rulesOk").addEventListener("click", () => { $("#mRules").hidden = true; if (returnToMode) { returnToMode = false; openMode(); } });
document.querySelectorAll(".modal").forEach(m => m.addEventListener("mousedown", e => {
  if (e.target !== m || m.id === "mNet" || (m.id === "mMode" && !started)) return;
  if (m.id === "mRules") return $("#rulesOk").click();
  m.hidden = true;
}));
window.addEventListener("resize", fit);

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  applyI18n(); fit(); newGame(true);
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {   // mở từ link mời: vào phòng luôn
    try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
    modeDraft = { ...clone(PREFS), vs: "online", net: "join", code: room };
    startOnline();
  } else openRules();
  window.game = {   // tiện debug ở console
    get mode() { return MODE; }, get state() { return { bd, turn, over, moves, aiMem }; },
    clickCell, place, aiChoose, AI, runFive, moveVal, vcf, candidates, stateHash,
  };
})();
</script>
</body>
