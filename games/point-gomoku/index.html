<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ Ca-rô Cược Điểm · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<style>
:root{
  --S:600px; --cell:40px;
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold:#ffc928; --gold-ink:var(--tb-gold-ink);
  --wood:#efc27a; --wood-2:#e3ab58; --grid:#5b3f22;
  --st-1:radial-gradient(circle at 34% 30%,#61656f,#17191e 62%);
  --st-2:radial-gradient(circle at 34% 30%,#fff,#e6e1d3 72%);
  --mine:#1fae4b; --theirs:#e5322b; --pick:#ff7a1a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.92)}
#app{width:fit-content;margin:0 auto;padding:14px 12px 28px}
body.portrait #app{width:100%;padding:8px 8px 24px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.actions{display:flex;gap:8px}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}

#status{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);margin-bottom:12px;font-size:14px;min-height:46px}
#statusText{flex:1}
#timer{flex:none;font-family:var(--tb-font-brand);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:9px;background:var(--field);border:1px solid var(--line)}
#timer.low{color:#d9362b;animation:blink .5s infinite}
#timer:empty{display:none}
@keyframes blink{50%{opacity:.25}}

#stage{display:flex;gap:20px;align-items:flex-start;justify-content:center}
#boardWrap{position:relative;flex:none}
#board{position:relative;width:var(--S);height:var(--S);background:linear-gradient(135deg,var(--wood),var(--wood-2));border-radius:6px;
  box-shadow:0 0 0 6px #fff,0 0 0 7px var(--tb-border),0 14px 34px rgba(20,30,60,.22);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stones{position:absolute;inset:0;pointer-events:none}
.st,.ring,.hint{position:absolute;left:calc((var(--c) + .5) * var(--cell));top:calc((var(--r) + .5) * var(--cell));
  width:calc(var(--cell) * .86);height:calc(var(--cell) * .86);margin:calc(var(--cell) * -.43) 0 0 calc(var(--cell) * -.43);border-radius:50%}
.st{box-shadow:0 2px 3px rgba(0,0,0,.35)}
.st.k1{background:var(--st-1)} .st.k2{background:var(--st-2)}
.st.new{animation:drop .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes drop{0%{transform:scale(1.35);opacity:0}100%{transform:none;opacity:1}}
.st.last::after{content:"";position:absolute;inset:-14%;border:2.5px solid var(--pick);border-radius:5px}
.st.last.mine::after{border-color:var(--mine)} .st.last.theirs::after{border-color:var(--theirs)}
.st.win{box-shadow:0 0 0 3px var(--mine),0 0 14px 4px rgba(31,174,75,.75);animation:winpulse 1s infinite}
@keyframes winpulse{50%{box-shadow:0 0 0 3px var(--mine),0 0 22px 8px rgba(31,174,75,.45)}}
.ring{border:3px solid var(--pick);background:rgba(255,238,215,.92);display:grid;place-items:center;font-weight:900;color:#a64a00;font-size:calc(var(--cell) * .42);animation:ringin .2s ease-out}
@keyframes ringin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hint{border:2px dashed rgba(166,74,0,.55)}
.ghost{position:absolute;left:calc((var(--c) + .5) * var(--cell));top:calc((var(--r) + .5) * var(--cell));width:calc(var(--cell) * .5);height:calc(var(--cell) * .5);
  margin:calc(var(--cell) * -.25) 0 0 calc(var(--cell) * -.25);border-radius:50%;background:rgba(255,122,26,.35)}

.side{width:330px;flex:none;display:flex;flex-direction:column;gap:10px}
.card2{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--tb-shadow);min-width:0}
.panel.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,40,.35)}
.pdot{width:26px;height:26px;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pdot.c1{background:var(--st-1)} .pdot.c2{background:var(--st-2);box-shadow:0 0 0 1px #d8d2c2,0 2px 3px rgba(0,0,0,.25)}
.pinfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.pinfo b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:11px;font-weight:700;color:var(--muted)}
.pinfo em{font-style:normal;font-family:var(--tb-font-brand);font-weight:800;font-size:18px;color:var(--gold-ink)}
.h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.h3 span{color:var(--muted);letter-spacing:0;text-transform:none}
#action p{margin:0 0 10px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1;padding:8px 10px}
.bank{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.bank b{font-family:var(--tb-font-brand);font-size:30px;line-height:1}
.bank span{font-size:12.5px;color:var(--muted);font-weight:700}
.bank .carry{color:var(--tb-green,#1fae4b)}
.segbar{display:flex;gap:2px;margin:0 0 10px}
.segbar i{flex:1;height:7px;border-radius:2px;background:var(--field);border:1px solid var(--line)}
.segbar i.on{background:var(--pick);border-color:var(--pick)}
.bidrow{display:grid;grid-template-columns:34px 38px 1fr 38px auto;gap:6px;align-items:center;margin-bottom:6px}
.bidrow .num{width:30px;height:30px;border-radius:50%;border:3px solid var(--pick);display:grid;place-items:center;font-weight:900;color:#a64a00}
.bidrow .v{text-align:center;font-family:var(--tb-font-brand);font-size:24px;font-weight:800;line-height:1}
.bidrow button{height:36px;border-radius:9px;border:1.5px solid var(--btn-line);background:var(--btn);font-weight:900;font-size:18px;cursor:pointer;color:var(--text)}
.bidrow button:hover{background:var(--btn-hover)}
.bidrow button.all{font-size:12px;padding:0 10px}
.bidrow button:disabled{opacity:.3;cursor:not-allowed}
.note{color:var(--muted);font-size:12.5px}
#result .pts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#result .pt{border-radius:10px;border:2px solid var(--line);padding:8px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
#result .pt.mine{border-color:var(--mine);color:#137a33} #result .pt.theirs{border-color:var(--theirs);color:#b3241e}
#result .pt i{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:50%}
#result .pt i.c1{background:var(--st-1)} #result .pt i.c2{background:var(--st-2);box-shadow:0 0 0 1px #d8d2c2}
#result .pt small{display:block;color:var(--muted);font-weight:600}
#history ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto;font-size:12.5px}
#history li{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:7px;background:var(--field)}
#history li .rn{font-weight:800;color:var(--muted);min-width:2.2em}
#history li .ms{display:inline-flex;gap:2px}
#history li .ms i{width:11px;height:11px;border-radius:50%}
#history li .ms i.c1{background:#1b1b1b} #history li .ms i.c2{background:#fff;box-shadow:0 0 0 1px #bbb}
#history li .who{flex:1;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#history li .bd{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#history li .bd s{text-decoration:none;color:var(--theirs)}
#history .empty{color:var(--muted);font-size:12.5px;margin:0}

#gameover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,25,40,.35);z-index:20;animation:fade .3s;border-radius:6px}
.go-card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:22px 26px;text-align:center;max-width:90%;box-shadow:var(--tb-shadow-lg)}
.go-card h2{margin:0 0 6px;font-family:var(--tb-font-brand);font-size:30px}
.go-card p{margin:0 0 14px;color:var(--muted)}
.go-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#goNet{margin:-6px 0 14px}
#goNet:empty{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg);position:relative}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.credit{margin-right:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg button:disabled{cursor:not-allowed;pointer-events:none}
#segLevel button{min-width:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#segLevel button small{font-size:10px;font-weight:700;opacity:.75}
.off{opacity:.28;filter:grayscale(1)}
.off .seg button.on{background:var(--btn);color:var(--text);border-color:var(--line)}
#levelNote{min-height:2.8em;line-height:1.4;margin:6px 0 0}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 240px}
#joinCode{flex:1 1 140px;min-width:0;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;font-size:18px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
#joinCode:disabled{opacity:.35}
#mNet .card{max-width:460px;text-align:center}
#mNet .foot{justify-content:center}
.netcode{font-family:var(--tb-font-brand);font-size:46px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:4px 0 12px;user-select:all}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#netMsg{color:var(--muted);margin:14px 0 0}

body.portrait .brand{display:none}
body.portrait .actions{width:100%} body.portrait #btnNew{margin-left:auto}
body.portrait #status{font-size:13px;margin-bottom:8px;min-height:58px}
body.portrait #stage{flex-direction:column;align-items:center;gap:10px}
body.portrait .side{width:var(--S)}
@media (max-width:600px){#segLevel button{flex:0 0 calc((100% - 24px) / 4)}#segLevel{justify-content:center}}
</style>
</head>
<body>
<div id="tb-header"></div>
<script>TB.mountHeader({ page: "game", gameId: "point-gomoku" });</script>
<div id="app">
  <header class="top">
    <div class="brand"><h1 data-i18n="brand">Cờ Ca-rô Cược Điểm</h1></div>
    <div class="actions">
      <button class="btn" id="btnRules" data-i18n="b_rules">Luật chơi</button>
      <button class="btn primary" id="btnNew" data-i18n="b_new">Ván mới</button>
    </div>
  </header>
  <div id="status"><span id="statusText"></span><span id="timer"></span></div>
  <main id="stage">
    <div id="boardWrap">
      <div id="board"><svg id="grid" viewBox="0 0 15 15" aria-hidden="true"></svg><div id="stones"></div></div>
      <div id="gameover" hidden>
        <div class="go-card">
          <h2 id="goTitle"></h2>
          <p id="goSub"></p>
          <p class="note" id="goNet"></p>
          <div class="row">
            <button class="btn primary" id="goNew" data-i18n="b_new">Ván mới</button>
            <button class="btn" id="goView" data-i18n="b_view">Xem bàn cờ</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="players">
        <section class="panel" id="panel-1"><span class="pdot c1"></span><div class="pinfo"><b></b><span class="role"></span><span class="pts"></span></div></section>
        <section class="panel" id="panel-2"><span class="pdot c2"></span><div class="pinfo"><b></b><span class="role"></span><span class="pts"></span></div></section>
      </div>
      <section class="card2" id="action" hidden></section>
      <section class="card2" id="result" hidden></section>
      <section class="card2" id="history" hidden></section>
    </aside>
  </main>
</div>

<div class="modal" id="mRules" hidden>
  <div class="card">
    <h2 data-i18n="brand">Cờ Ca-rô Cược Điểm</h2>
    <p data-i18n="r_intro"></p>
    <h3 data-i18n="r_h_round"></h3>
    <ul><li data-i18n="r_choose"></li><li data-i18n="r_bid"></li><li data-i18n="r_place"></li></ul>
    <h3 data-i18n="r_h_points"></h3>
    <ul><li data-i18n="r_grant"></li><li data-i18n="r_carry"></li><li data-i18n="r_hidden"></li></ul>
    <h3 data-i18n="r_h_win"></h3>
    <ul><li data-i18n="r_five"></li><li data-i18n="r_both"></li><li data-i18n="r_draw"></li><li data-i18n="r_time"></li></ul>
    <h3 data-i18n="r_h_opp"></h3>
    <ul><li data-i18n="r_ai"></li><li data-i18n="r_online"></li></ul>
    <p class="note" data-i18n="r_inspired"></p>
    <div class="foot"><span class="note credit" data-i18n="r_credit"></span><button class="btn primary" id="rulesOk" data-i18n="r_ok"></button></div>
  </div>
</div>

<div class="modal" id="mMode" hidden>
  <div class="card">
    <h2 data-i18n="m_title"></h2>
    <h3 data-i18n="m_vs"></h3>
    <div class="seg" id="segVs"><button data-v="bot" data-i18n="m_bot"></button><button data-v="online" data-i18n="m_online"></button></div>
    <div id="netOpts">
      <h3 data-i18n="m_net"></h3>
      <div class="netrow">
        <div class="seg" id="segNet"><button data-v="create" data-i18n="m_create"></button><button data-v="join" data-i18n="m_join"></button></div>
        <input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <p class="note" id="netNote"></p>
    </div>
    <div id="levelOpts">
      <h3 data-i18n="m_level"></h3>
      <div class="seg" id="segLevel"></div>
      <p class="note" id="levelNote"></p>
    </div>
    <div class="foot">
      <button class="btn" id="modeCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="modeStart" data-i18n="m_start"></button>
    </div>
  </div>
</div>

<div class="modal" id="mNet" hidden>
  <div class="card">
    <h2 id="netTitle"></h2>
    <div id="netCodeBox" hidden>
      <div class="netcode" id="netCode"></div>
      <div class="netlink"><input id="netLink" readonly><button class="btn" id="netCopy" data-i18n="n_copy"></button></div>
    </div>
    <p id="netMsg"></p>
    <div class="foot"><button class="btn" id="netCancel" data-i18n="cancel"></button></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   CỜ CA-RÔ CƯỢC ĐIỂM (POINT GOMOKU)
   Luật theo Point Omok (puzzlthink.com): mỗi vòng = chọn 3 ô liền hàng, hai bên cược kín, ô nào ai cược cao hơn thì được quân ở ô đó
   (hoà điểm: người KHÔNG chọn ô thắng). Mỗi vòng +10 điểm, cộng nửa số điểm chưa tiêu vòng trước (làm tròn xuống).
   Đúng 5 quân liền hàng mới tính (6+ không tính). Hết vòng có hàng 5 thì hết ván: nhiều hàng 5 hơn thắng, bằng nhau hoà.
   Toạ độ: ô i = r*15 + c. Màu: 1 = Đen, 2 = Trắng.
   ============================================================ */
const $ = (s, root = document) => root.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- ĐA NGÔN NGỮ (vi / en) ---------- */
const I18N = {
vi: {
  title: "Cờ Ca-rô Cược Điểm", brand: "Cờ Ca-rô Cược Điểm",
  b_rules: "Luật chơi", b_new: "Ván mới", b_view: "Xem bàn cờ", cancel: "Huỷ",
  r_intro: "Cờ ca-rô 15x15, nhưng không ai tự đặt quân. Mỗi vòng, hai bên <b>cược điểm kín</b> để giành từng ô.",
  r_h_round: "Mỗi vòng có 3 bước",
  r_choose: "<b>Chọn</b>: người chọn (vòng đầu bốc thăm, sau đó hai bên thay phiên) đánh dấu <b>3 ô trống liền nhau trên một đường</b>: ngang, dọc hoặc chéo. Không được cách quãng hay gãy khúc.",
  r_bid: "<b>Cược</b>: mỗi người chia điểm của mình lên 3 ô, <b>ô nào cũng ít nhất 1 điểm</b>. Cược kín, đối thủ không thấy.",
  r_place: "<b>Đặt quân</b>: ô nào ai cược cao hơn thì người đó được quân ở ô đó. <b>Hoà điểm thì người không chọn ô thắng.</b> Cả 3 quân đặt cùng lúc.",
  r_h_points: "Điểm",
  r_grant: "Mỗi vòng mỗi người được cộng <b>10 điểm</b>.",
  r_carry: "Điểm không tiêu thì chuyển <b>một nửa</b> (làm tròn xuống) sang vòng sau. Ví dụ có 10, cược 3-1-1, còn 5 thì vòng sau có 10 + 2 = 12 điểm.",
  r_hidden: "Số điểm còn lại và cược của đối thủ đều ẩn. Mỗi vòng bạn chỉ biết ô nào về tay ai. Hết ván mới lộ toàn bộ cược.",
  r_h_win: "Thắng thua",
  r_five: "Ai có <b>đúng 5 quân</b> liền hàng thì thắng. Hàng 6 quân trở lên không tính.",

let returnToMode = true;
function openRules() { $("#mRules").hidden = false; }

/* ---------- NGÔN NGỮ ---------- */
function setLang(l) {
  LANG = l; try { localStorage.setItem("lang", l); } catch (e) {}
  if (window.TB) TB.setLang(l);
  applyI18n(); if (modeDraft && !$("#mMode").hidden) syncMode();
  render();
}
if (window.TB) TB.onLang(l => { if (l !== LANG) setLang(l); });

/* ---------- SỰ KIỆN ---------- */
for (const [id, key] of MODE_SEGS)
  document.querySelectorAll(id + " button").forEach(b => b.addEventListener("click", () => {
    modeDraft[key] = b.dataset.v; syncMode();
    if (modeDraft.vs === "online" && modeDraft.net === "join" && (key === "net" || key === "vs")) $("#joinCode").focus();
  }));
$("#joinCode").addEventListener("input", e => { const v = normCode(e.target.value); if (e.target.value !== v) e.target.value = v; });
$("#joinCode").addEventListener("keydown", e => { if (e.key === "Enter") $("#modeStart").click(); });
$("#netCancel").addEventListener("click", () => { netClose(true); $("#mNet").hidden = true; if (!started) openMode(); });
$("#netCopy").addEventListener("click", () => {
  const inp = $("#netLink"), btn = $("#netCopy");
  const done = () => { btn.textContent = tr("n_copied"); setTimeout(() => { btn.textContent = tr("n_copy"); }, 1500); };
  const legacy = () => { inp.select(); try { document.execCommand("copy"); done(); } catch (e) {} };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, legacy); else legacy();
});
window.addEventListener("pagehide", () => { if (netOpen()) try { NET.conn.send({ t: "bye" }); } catch (e) {} });
$("#modeCancel").addEventListener("click", () => { $("#mMode").hidden = true; if (!started) { returnToMode = true; openRules(); } });
$("#modeStart").addEventListener("click", () => {
  PREFS.vs = modeDraft.vs; if (modeDraft.vs === "bot") PREFS.level = modeDraft.level; savePrefs();
  if (modeDraft.vs === "online") {
    if (modeDraft.net === "join") {
      modeDraft.code = normCode($("#joinCode").value);
      if (modeDraft.code.length !== CODE_LEN) { $("#netNote").textContent = tr("n_err_code"); $("#joinCode").focus(); return; }
    }
    return startOnline();
  }
  netClose(true);
  MODE = { ...clone(modeDraft), human: 1 }; $("#mMode").hidden = true; newGame(false);
});
function cellFromEvent(e) {
  const rect = boardEl.getBoundingClientRect(), cw = rect.width / N;
  const c = Math.floor((e.clientX - rect.left) / cw), r = Math.floor((e.clientY - rect.top) / cw);
  return inb(r, c) ? r * N + c : -1;
}
function clickCell(i) {
  if (!canChoose() || i < 0 || bd[i]) return;
  if (G.sel.includes(i)) G.sel = G.sel.filter(x => x !== i);
  else {
    const L = legalTriples(bd), cand = G.sel.length >= 3 ? [i] : [...G.sel, i];
    if (L.some(t => cand.every(x => t.includes(x)))) G.sel = cand;
    else if (L.some(t => t.includes(i))) G.sel = [i];
  }
  G.sel.sort((a, b) => a - b);
  render();
}
boardEl.addEventListener("click", e => clickCell(cellFromEvent(e)));
boardEl.addEventListener("mousemove", e => { const i = cellFromEvent(e); if (i !== hoverCell) { hoverCell = i; renderBoard(); } });
boardEl.addEventListener("mouseleave", () => { hoverCell = -1; renderBoard(); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && canChoose() && G.sel.length === 3 && anyModal() === false) return confirmSelection(false);
  if (e.key !== "Escape") return;
  if (!$("#mNet").hidden) $("#netCancel").click();
  else if (!$("#mRules").hidden) $("#rulesOk").click();
  else if (!$("#mMode").hidden) { if (started) $("#mMode").hidden = true; }
});
$("#btnNew").addEventListener("click", () => {
  if (MODE.vs === "online" && netOpen() && G && G.over) { overDismissed = false; return renderOver(); }
  openMode();
});
$("#goNew").addEventListener("click", () => { if (MODE.vs === "online" && netOpen()) return requestRematch(); openMode(); });
$("#goView").addEventListener("click", () => { overDismissed = true; renderOver(); });
$("#btnRules").addEventListener("click", () => { returnToMode = false; openRules(); });
$("#rulesOk").addEventListener("click", () => { $("#mRules").hidden = true; if (returnToMode) { returnToMode = false; openMode(); } });
document.querySelectorAll(".modal").forEach(m => m.addEventListener("mousedown", e => {
  if (e.target !== m || m.id === "mNet" || (m.id === "mMode" && !started)) return;
  if (m.id === "mRules") return $("#rulesOk").click();
  m.hidden = true;
}));
window.addEventListener("resize", fit);

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  applyI18n(); fit(); newGame(true);
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {
    try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
    modeDraft = { ...clone(PREFS), vs: "online", net: "join", code: room };
    startOnline();
  } else openRules();
  window.game = {   // tiện debug ở console
    get mode() { return MODE; }, get G() { return G; }, get bd() { return bd; }, get ai() { return AIS; },
    clickCell, confirmSelection, lockBid, applyTriple, stateHash, fives, aiBid, aiChooseTriple, legalTriples,
    setDraft(d) { if (G) { G.draft = d.slice(); renderAction(); } },
  };
})();
</script>
</body>
</html>
