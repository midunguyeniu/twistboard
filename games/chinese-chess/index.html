<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f6e3bd' stroke='%23c8231b' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23c8231b' stroke-width='2.5'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='900' text-anchor='middle' fill='%23c8231b' font-family='serif'%3E%E5%B8%A5%3C/text%3E%3C/svg%3E">
<title>Cờ Tướng · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<!-- Font chữ Hán cho quân cờ: chỉ tải đúng các chữ cần dùng (tham số text) nên rất nhẹ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=block&text=%E5%B8%A5%E4%BB%95%E7%9B%B8%E4%BF%A5%E5%82%8C%E7%82%AE%E5%85%B5%E5%B0%87%E5%A3%AB%E8%B1%A1%E8%BB%8A%E9%A6%AC%E7%A0%B2%E5%8D%92%E6%A5%9A%E6%B2%B3%E6%BC%A2%E7%95%8C">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<style>
:root{
  --cell:64px; --bd:#E9C48C; --bd-line:#6b4421;
  --gold:#ffc928; --bad:#ff5a4d;
  --red:#c8231b; --red-ink:#b01d15;
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold-ink:var(--tb-gold-ink);
  --han:"Noto Serif TC","KaiTi","STKaiti","DFKai-SB","Microsoft JhengHei","PingFang TC",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.92)}
#app{width:fit-content;margin:0 auto;padding:14px 12px 28px}
body.portrait #app{width:100%;padding:8px 8px 24px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.actions{display:flex;gap:8px}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}

/* status bar */
#status{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);margin-bottom:12px;font-size:14px;min-height:42px}
#status .muted{color:var(--muted)}
#status .warn{color:#d9362b;font-weight:800}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #2b2f3a}
.dot.red{background:var(--red);border-color:var(--red)}
.dot.black{background:#1b1b1b;border-color:#1b1b1b}
.dot.draw{background:#999}
.dot.think{animation:blink .9s infinite}
@keyframes blink{50%{opacity:.2}}

/* layout */
#stage{display:flex;gap:20px;align-items:flex-start;justify-content:center}
#boardWrap{position:relative;flex:none;padding:22px 9px}
.files{position:absolute;left:9px;width:calc(var(--cell)*9);height:22px;display:grid;grid-template-columns:repeat(9,1fr);color:var(--muted);font-size:13px;font-weight:800;user-select:none;pointer-events:none}
.files span{display:grid;place-items:center}
#filesTop{top:-4px} #filesBot{bottom:-4px}
#board{position:relative;width:calc(var(--cell)*9);height:calc(var(--cell)*10);background-color:var(--bd);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.22),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.08),transparent 55%);
  box-shadow:0 0 0 6px #fff,0 0 0 7px var(--tb-border),0 14px 34px rgba(20,30,60,.22);border-radius:3px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#grid line,#grid path,#grid rect{stroke:var(--bd-line);fill:none;vector-effect:non-scaling-stroke;stroke-width:1.3px}
#grid .frame{stroke-width:2.6px}
#grid text{fill:var(--bd-line);font-family:var(--han);font-weight:900;opacity:.62}
.layer{position:absolute;inset:0;pointer-events:none}
.piece,.mk{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);
  transform:translate(calc(var(--c)*var(--cell)),calc(var(--r)*var(--cell)))}

/* quân cờ: đĩa tròn chữ Hán */
.pc{--d:30px;position:relative;flex:none;display:inline-grid;place-items:center;width:var(--d);height:var(--d);border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fffaf0 0,#f6e3bd 55%,#ddb877 100%);
  box-shadow:0 calc(var(--d)*.05) 0 #a87c42,0 calc(var(--d)*.07) calc(var(--d)*.08) rgba(0,0,0,.4);
  font-family:var(--han);font-weight:900;font-size:calc(var(--d)*.56);line-height:1;color:#1d1d1d}
.pc::before{content:"";position:absolute;inset:9%;border-radius:50%;border:max(1px,calc(var(--d)*.035)) solid currentColor;opacity:.85}
.pc.red{color:var(--red)}
.pc b{position:relative;font-weight:900;transform:translateY(-3%)}
.piece{display:flex;align-items:center;justify-content:center;transition:transform .24s cubic-bezier(.3,.8,.3,1);z-index:1}
.piece.top{z-index:3}
.piece .pc{--d:calc(var(--cell)*.88);transition:transform .28s,opacity .28s}
.piece.dying .pc{transform:scale(.3) rotate(25deg);opacity:0}
.piece.spawn .pc{animation:spawnIn .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes spawnIn{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}

/* điểm đánh dấu trên giao điểm */
.mk::before{content:"";position:absolute;inset:4%;border-radius:50%}
.mk.last::before{box-shadow:0 0 0 3px rgba(255,170,20,.85)}
.mk.last.from::before{inset:34%;box-shadow:none;background:rgba(255,170,20,.55)}
.mk.sel::before{box-shadow:0 0 0 4px var(--gold),0 0 16px 4px rgba(255,201,40,.7)}
.mk.mv::before{inset:37%;background:rgba(40,170,90,.9);box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.mk.cap::before{box-shadow:0 0 0 4px var(--bad),inset 0 0 0 999px rgba(255,80,70,.18)}
.mk.danger::before{animation:danger 1s infinite}
.mk.hover::before{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
@keyframes danger{0%,100%{box-shadow:0 0 0 4px rgba(230,50,40,.95)}50%{box-shadow:0 0 0 4px rgba(230,50,40,.95),0 0 24px 8px rgba(255,60,50,.75)}}
.mk.kflag{z-index:5}
.kflag span{position:absolute;left:50%;bottom:calc(100% - 1px);transform:translateX(-50%);background:#d3261b;color:#fff;font-weight:800;
  font-size:max(10px,calc(var(--cell)*.17));letter-spacing:.06em;line-height:1;padding:.32em .9em;border-radius:99px;white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.55);animation:flagpulse 1s infinite}
.kflag.in span{bottom:auto;top:calc(100% - 1px)}
@keyframes flagpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}

/* side column */
.side{width:312px;flex:none;height:calc(var(--cell)*10 + 44px);display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.side #panel-black{order:1} .side #mid{order:2} .side #panel-red{order:3}
body.flip .side #panel-red{order:1} body.flip .side #panel-black{order:3}
.panel{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s;border:2px solid transparent}
.panel.red{background:#fff1ec;color:#5a1712;border-color:#f4cfc6}
.panel.black{background:#23252b;color:#f3ecd0;border-color:#23252b}
.panel.active{box-shadow:0 0 0 3px var(--gold),0 6px 24px rgba(255,180,0,.35)}
.p-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:.1em}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.role{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.05em;opacity:.65;margin-left:6px}
.badge{white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.08)}
.panel.black .badge{background:rgba(255,255,255,.12)}
.badge:empty{display:none}
.panel.active .badge{background:var(--gold);color:#3a2a00}
.capsrow{display:flex;align-items:center;min-height:34px}
.caps{display:flex;align-items:center;flex-wrap:wrap;row-gap:3px}
.caps .pc{--d:27px;margin-right:-7px}
.caps .gap{width:12px}
.adv{margin-left:16px;font-size:15px;font-weight:900;opacity:.75}
.clock{margin-left:auto;flex:none;font-variant-numeric:tabular-nums;font-weight:900;font-size:24px;line-height:1;padding:7px 12px;border-radius:10px;
  background:rgba(0,0,0,.07);min-width:96px;text-align:center;transition:background-color .2s,color .2s}
.panel.black .clock{background:rgba(255,255,255,.1)}
.clock.run{background:#1d2330;color:#fff}
.panel.black .clock.run{background:#fff;color:#1d2330}
.clock.low{color:#e8473e}
.clock.low.run,.panel.black .clock.low.run{background:#e8473e;color:#fff}

#mid{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;padding:2px 2px}
.tally{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
#log{list-style:none;margin:0;padding:0 4px 0 0;display:flex;flex-direction:column;gap:3px;overflow-y:auto;font-size:12.5px;line-height:1.35;flex:1;min-height:0;
  scrollbar-width:thin;scrollbar-color:#c5ccd8 transparent}
#log li{display:flex;align-items:baseline;gap:6px;padding-left:8px;border-left:3px solid #d5dbe5;flex:none}
#log .mn{flex:none;min-width:2.4em;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
#log li.sys{border-color:var(--gold);color:var(--gold-ink);font-weight:700}
#log li.mvrow{display:grid;grid-template-columns:2.8em 1fr 1fr;align-items:center;gap:4px;border-left:0;padding:1px 2px}
#log li.mvrow:nth-child(odd){background:var(--field);border-radius:6px}
#log .sm{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
#log .sm .pc{--d:20px}
#log .ck{color:#d3261b;font-weight:900;margin-left:-2px}

/* game over */
#gameover{position:absolute;inset:22px 9px;display:grid;place-items:center;background:rgba(20,25,40,.45);z-index:20;animation:fade .3s}
.go-card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:22px 26px;text-align:center;max-width:90%;box-shadow:var(--tb-shadow-lg)}
.go-card h2{margin:0 0 6px;font-family:var(--tb-font-brand);font-size:30px;letter-spacing:.02em}
.go-card p{margin:0 0 16px;color:var(--muted)}
.go-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* modals */
.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg)}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:18px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.note{color:var(--muted);font-size:12.5px}
#levelNote{line-height:1.4;min-height:2.8em}
.credit{margin-right:auto;align-self:center}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button:disabled{cursor:not-allowed;pointer-events:none}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg .sw{display:inline-flex;vertical-align:middle;margin-right:8px;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.seg .sw i{display:block;width:14px;height:20px}
#botOpts.off{opacity:.28;filter:grayscale(1)}
#botOpts.off .seg button.on{background:var(--btn);color:var(--text);border-color:var(--line)}
/* chọn bên cầm quân: Đỏ = nền đỏ, Đen = nền đen */
#segSide button{opacity:.82}
#segSide button[data-v="red"]{background:var(--red);color:#fff;border-color:#a51b14}
#segSide button[data-v="black"]{background:#141414;color:#f4f1ea;border-color:#5a5a5a}
#segSide button:hover:not(.on):not(:disabled){opacity:1}
#segSide button.on{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
#botOpts.off #segSide button.on{opacity:1;border-color:transparent;box-shadow:none}
#botOpts.off #segSide button.on[data-v="red"]{background:var(--red);color:#fff}
#botOpts.off #segSide button.on[data-v="black"]{background:#141414;color:#f4f1ea;border-color:#5a5a5a}
#segLevel button{min-width:0;padding:10px 2px;white-space:nowrap;letter-spacing:-1px}
#segLevel button[data-v="easy"]{border-color:#9fd83c;background:rgba(159,216,60,.2)}
#segLevel button[data-v="normal"]{border-color:#ffd24a;background:rgba(255,210,74,.2)}
#segLevel button[data-v="hard"]{border-color:#3d8bff;background:rgba(61,139,255,.22)}
#segLevel button[data-v="expert"]{border-color:#e5453b;background:rgba(229,69,59,.22)}
#segLevel button[data-v="master"]{border-color:#9b59e0;background:rgba(155,89,224,.24)}
#segLevel button:hover:not(.on):not(:disabled){filter:brightness(1.35)}
#botOpts.off #segLevel button{border-color:var(--line);background:var(--btn)}
#segLevel button.on[data-v="normal"]{background:#ffd24a;border-color:#ffd24a;color:#3a2a00}
#segLevel button.on[data-v="easy"]{background:#9fd83c;border-color:#9fd83c;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#segLevel button.on[data-v="hard"]{background:#3d8bff;border-color:#3d8bff;color:#fff}
#segLevel button.on[data-v="expert"]{background:#e5453b;border-color:#e5453b;color:#fff}
#segLevel button.on[data-v="master"]{background:#9b59e0;border-color:#9b59e0;color:#fff}
@media (max-width:600px){#segLevel{justify-content:center}#segLevel button{flex:0 0 calc((100% - 16px) / 3)}}
#netOpts.off,#levelOpts.off,#timeOpts.off{opacity:.28;filter:grayscale(1)}
#netOpts.off .seg button.on,#timeOpts.off .seg button.on{background:var(--btn);color:var(--text);border-color:var(--line)}
#levelOpts.off #segLevel button,#levelOpts.off #segLevel button.on{border-color:var(--line);background:var(--btn);color:var(--text);text-shadow:none}
#segTime button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;line-height:1.15}
#segTime small{font-size:12px;font-weight:700;opacity:.7}
@media (max-width:600px){#segTime{justify-content:center}#segTime button{flex:0 0 calc((100% - 16px) / 3)}}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 260px}
#joinCode{flex:1 1 140px;min-width:0;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;font-size:18px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
#joinCode:disabled{opacity:.35}
#joinCode:focus{outline:none;border-color:var(--gold)}
#mNet .card{max-width:460px;text-align:center}
#mNet .foot{justify-content:center}
.netcode{font-family:var(--tb-font-brand);font-size:46px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:4px 0 12px;font-variant-numeric:tabular-nums;user-select:all}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#netMsg{color:var(--muted);margin:14px 0 0}
#goNet{margin:-8px 0 14px}
#goNet:empty{display:none}

/* luật chơi */
#mRules .card{height:min(780px,calc(100vh - 28px));max-height:none}
#mRules .card > .foot{position:sticky;bottom:0;background:var(--panel);padding:10px 0 20px;margin-bottom:-20px}
.rpieces{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.rp{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rp .ic{display:flex;gap:4px}
.rp .ic .pc{--d:36px}
.rp p{margin:0;font-size:14px;line-height:1.45}
.rp b{white-space:nowrap}
@media (max-width:520px){.rp{gap:10px;padding:8px 10px}.rp .ic{flex-direction:column}.rp .ic .pc{--d:30px}}

/* portrait / mobile */
body.portrait .top{margin-bottom:8px}
body.portrait .brand{display:none}
body.portrait #status{font-size:13px;margin-bottom:8px;height:68px;min-height:68px;padding-top:6px;padding-bottom:6px}
body.portrait #statusText{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
body.portrait #stage{flex-direction:column;align-items:center;gap:10px}
body.portrait .side{display:contents}
body.portrait #panel-black{order:1} body.portrait #boardWrap{order:2} body.portrait #panel-red{order:3} body.portrait #mid{order:4}
body.portrait.flip #panel-red{order:1} body.portrait.flip #panel-black{order:3}
body.portrait .panel{width:100%;padding:8px 10px}
body.portrait #mid{width:calc(var(--cell)*9)}
body.portrait .actions{width:100%}
body.portrait #btnNew{margin-left:auto}
body.portrait #log{max-height:170px}
body.portrait .clock{font-size:20px;padding:6px 10px;min-width:84px}
@media (max-width:420px){.actions .btn{padding:8px 11px}}
</style>
</head>
<body>
<div id="tb-header"></div>
<script>TB.mountHeader({ page: "game", gameId: "chinese-chess" });</script>
<div id="app">
  <header class="top">
    <div class="brand"><h1 data-i18n="brand">Cờ Tướng</h1></div>
    <div class="actions">
      <button class="btn" id="btnRules" data-i18n="b_rules">Luật chơi</button>
      <button class="btn" id="btnUndo" data-i18n="b_undo" hidden>Đi lại</button>
      <button class="btn primary" id="btnNew" data-i18n="b_new">Ván mới</button>
    </div>
  </header>
  <div id="status"><span class="dot red"></span><span id="statusText"></span></div>
  <main id="stage">
    <div id="boardWrap">
      <div class="files" id="filesTop"></div>
      <div class="files" id="filesBot"></div>
      <div id="board">
        <svg id="grid" viewBox="0 0 9 10" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="lowLayer" class="layer"></div>
        <div id="pieceLayer" class="layer"></div>
        <div id="topLayer" class="layer"></div>
      </div>
      <div id="gameover" hidden>
        <div class="go-card">
          <h2 id="goTitle"></h2>
          <p id="goSub"></p>
          <p class="note" id="goNet"></p>
          <div class="row">
            <button class="btn" id="goUndo" data-i18n="b_undo" hidden>Đi lại</button>
            <button class="btn primary" id="goNew" data-i18n="b_new">Ván mới</button>
            <button class="btn" id="goView" data-i18n="b_view">Xem bàn cờ</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side">

  AC = new (window.AudioContext || window.webkitAudioContext)();

    const bin = atob(SFX_SRC[k].split(",")[1]), u8 = new Uint8Array(bin.length);

function playNow(name) {
  if (AC && BUF[name]) {
    const src = AC.createBufferSource(); src.buffer = BUF[name]; src.connect(AC.destination); src.start(0); return;

  const a = SFX[name] || (SFX[name] = new Audio(SFX_SRC[name]));   // dự phòng nếu Web Audio không dùng được

}

  try {
    if (delay) { setTimeout(() => sfx(name), delay); return; }
    if (AC && AC.state !== "running") { AC.resume().then(() => playNow(name)).catch(() => {}); return; }   // trình duyệt chỉ cho phát sau lần bấm đầu tiên

  } catch (e) {}
}

  "1": { name: "Theme 1", bd: "#E9C48C", line: "#6b4421" },
  "2": { name: "Theme 2", bd: "#F3E2BE", line: "#7a5a2e" },
  "3": { name: "Theme 3", bd: "#A8744A", line: "#2b170a" },
  "4": { name: "Theme 4", bd: "#A9C9A4", line: "#2c4a31" },
};
let MODE = { vs: "bot", human: "red", level: "normal", theme: "1", net: "create", code: "", tc: "rapid" };   // vs: "bot" | "pvp" | "online"

/* ---------- ĐỒNG HỒ THI ĐẤU (chỉ khi 2 người chơi, cùng máy hoặc online; đánh với AI không tính giờ) ----------
   Thời gian tính bằng ms, inc: cộng sau mỗi nước. Đồng hồ Đỏ chạy ngay khi ván bắt đầu. */
const TIME_CONTROLS = {
  classical: { base: 60 * 60e3, inc: 30e3, label: "60′ + 30″" },
  rapid:     { base: 15 * 60e3, inc: 10e3, label: "15′ + 10″" },
  blitz:     { base: 5 * 60e3,  inc: 3e3,  label: "5′ + 3″" },
  bullet:    { base: 60e3,      inc: 0,    label: "1′ + 0″" },
  none:      null,
};
const TC_KEYS = Object.keys(TIME_CONTROLS);
let TC = null, clock = null;                         // clock = { red, black, run: bên đang chạy giờ | null, since }
const clockLeft = color => clock[color] - (clock.run === color ? performance.now() - clock.since : 0);
function clockStart(color) { clock.run = color; clock.since = performance.now(); }
function clockStop() { if (clock && clock.run) { clock[clock.run] = clockLeft(clock.run); clock.run = null; } }
function fmtClock(ms) {
  ms = Math.max(0, ms);
  if (ms < 20e3) return "0:" + (Math.floor(ms / 100) / 10).toFixed(1).padStart(4, "0");
  const t = Math.ceil(ms / 1000), hh = Math.floor(t / 3600), mm = Math.floor(t % 3600 / 60), ss = t % 60;
  return (hh ? hh + ":" + String(mm).padStart(2, "0") : mm) + ":" + String(ss).padStart(2, "0");
}
const isBot = color => MODE.vs === "bot" && color !== MODE.human;
const isRemote = color => MODE.vs === "online" && color !== MODE.human;
const isLocal = color => !isBot(color) && !isRemote(color);

/* ---------- TRẠNG THÁI ----------
   Toạ độ logic (hàng 0-9, cột 0-8): hàng 0 là hàng cuối của Đỏ, cột 0 là cột bên trái nhìn từ phía Đỏ. B[r][c] = quân hoặc null. */
let B, pieces, nextId, KING, turn, over, sel, moves, last, move, logs, half, rep, hist, caps, overDismissed, undoStack;
let started = false, FLIP = false;
const vr = r => (FLIP ? r : 9 - r), vc = c => (FLIP ? 8 - c : c);
const pieceEls = new Map();

/* ---------- LUẬT ---------- */
const ORTH = [[-1,0],[1,0],[0,-1],[0,1]], DIAG = [[-1,-1],[-1,1],[1,-1],[1,1]];
const HORSE = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const inb = (r, c) => r >= 0 && r < 10 && c >= 0 && c < 9;
const inPalace = (color, r, c) => c >= 3 && c <= 5 && (color === "red" ? r >= 0 && r <= 2 : r >= 7 && r <= 9);
const ownSide = (color, r) => (color === "red" ? r <= 4 : r >= 5);   // chưa qua sông
const BACK = ["R", "H", "E", "A", "K", "A", "E", "H", "R"];
function addPiece(type, color, r, c) {
  const pc = { id: nextId++, type, color, r, c };
  pieces.set(pc.id, pc); B[r][c] = pc; if (type === "K") KING[color] = pc; return pc;
}
function setupStart() {
  B = Array.from({ length: 10 }, () => Array(9).fill(null));
  pieces = new Map(); nextId = 1; KING = {};
  for (let c = 0; c < 9; c++) { addPiece(BACK[c], "red", 0, c); addPiece(BACK[c], "black", 9, c); }
  for (const c of [1, 7]) { addPiece("C", "red", 2, c); addPiece("C", "black", 7, c); }
  for (const c of [0, 2, 4, 6, 8]) { addPiece("P", "red", 3, c); addPiece("P", "black", 6, c); }
}
/* Ô (r, c) có bị bên "by" tấn công không (chỉ dùng để xét Tướng bị chiếu; tính cả luật hai Tướng đối mặt) */
function attacked(r, c, by) {
  for (const [dr, dc] of ORTH) {                                // Xe, Tướng đối mặt (tia thẳng), Pháo (qua đúng 1 ngòi)
    let nr = r + dr, nc = c + dc, screen = false;
    while (inb(nr, nc)) {
      const p = B[nr][nc];
      if (p) {
        if (!screen) { if (p.color === by && (p.type === "R" || (p.type === "K" && dc === 0))) return true; screen = true; }
        else { if (p.color === by && p.type === "C") return true; break; }
      }
      nr += dr; nc += dc;
    }
  }
  for (const [dr, dc] of HORSE) {                               // Mã ở (r+dr, c+dc); chân Mã là ô kề con Mã về phía ô đích
    const hr = r + dr, hc = c + dc; if (!inb(hr, hc)) continue;
    const p = B[hr][hc];
    if (p && p.color === by && p.type === "H") {
      const lr = Math.abs(dr) === 2 ? hr - dr / 2 : hr, lc = Math.abs(dc) === 2 ? hc - dc / 2 : hc;
      if (!B[lr][lc]) return true;
    }
  }
  const f = by === "red" ? 1 : -1;                              // Tốt: từ phía sau đi tới, hoặc từ bên cạnh nếu đã qua sông
  const pb = inb(r - f, c) && B[r - f][c]; if (pb && pb.color === by && pb.type === "P") return true;
  if (!ownSide(by, r)) for (const dc of [-1, 1]) { const p = inb(r, c + dc) && B[r][c + dc]; if (p && p.color === by && p.type === "P") return true; }
  return false;
}
const inCheck = color => attacked(KING[color].r, KING[color].c, opp(color));

/* Nước đi giả hợp lệ (chưa xét Tướng mình có bị chiếu / đối mặt sau khi đi không) */
function pseudo(pc, out = []) {
  const { r, c, color, type } = pc, foe = opp(color);
  const add = (nr, nc) => {
    const t = B[nr][nc];
    if (!t) out.push({ r: nr, c: nc, kind: "move" });
    else if (t.color === foe) out.push({ r: nr, c: nc, kind: "capture" });
  };
  switch (type) {
    case "K": for (const [dr, dc] of ORTH) if (inPalace(color, r + dr, c + dc)) add(r + dr, c + dc); break;
    case "A": for (const [dr, dc] of DIAG) if (inPalace(color, r + dr, c + dc)) add(r + dr, c + dc); break;
    case "E":
      for (const [dr, dc] of DIAG) {
        const nr = r + 2 * dr, nc = c + 2 * dc;
        if (inb(nr, nc) && ownSide(color, nr) && !B[r + dr][c + dc]) add(nr, nc);
      }
      break;
    case "H":
      for (const [dr, dc] of ORTH) {
        if (!inb(r + dr, c + dc) || B[r + dr][c + dc]) continue;   // cản Mã
        for (const s of [-1, 1]) {
          const nr = dr ? r + 2 * dr : r + s, nc = dr ? c + s : c + 2 * dc;
          if (inb(nr, nc)) add(nr, nc);
        }
      }
      break;
    case "R":
      for (const [dr, dc] of ORTH) {
        let nr = r + dr, nc = c + dc;
        while (inb(nr, nc)) { const t = B[nr][nc]; add(nr, nc); if (t) break; nr += dr; nc += dc; }
      }
      break;
    case "C":
      for (const [dr, dc] of ORTH) {
        let nr = r + dr, nc = c + dc;
        while (inb(nr, nc) && !B[nr][nc]) { out.push({ r: nr, c: nc, kind: "move" }); nr += dr; nc += dc; }
        nr += dr; nc += dc;                                       // nhảy qua ngòi
        while (inb(nr, nc)) { const t = B[nr][nc]; if (t) { if (t.color === foe) out.push({ r: nr, c: nc, kind: "capture" }); break; } nr += dr; nc += dc; }
      }
      break;
    case "P": {
      const f = color === "red" ? 1 : -1;
      if (inb(r + f, c)) add(r + f, c);
      if (!ownSide(color, r)) for (const s of [-1, 1]) if (inb(r, c + s)) add(r, c + s);
      break;
    }
  }
  return out;
}
/* Đi / hoàn tác trực tiếp trên trạng thái (dùng cho nước thật, kiểm tra hợp lệ và AI). half = số nửa nước liền không ăn quân. */
function make(pc, m) {
  const rec = { pc, m, fr: pc.r, fc: pc.c, half, cap: null };
  const victim = B[m.r][m.c];
  if (victim) { rec.cap = victim; pieces.delete(victim.id); }
  B[pc.r][pc.c] = null; B[m.r][m.c] = pc; pc.r = m.r; pc.c = m.c;
  half = victim ? 0 : half + 1;
  return rec;
}
function unmake(rec) {
  const { pc, m } = rec;
  B[m.r][m.c] = rec.cap; if (rec.cap) pieces.set(rec.cap.id, rec.cap);
  B[rec.fr][rec.fc] = pc; pc.r = rec.fr; pc.c = rec.fc; half = rec.half;
}
function legalFor(pc) {
  return pseudo(pc).filter(m => { const rec = make(pc, m), ok = !inCheck(pc.color); unmake(rec); return ok; });
}
function hasLegal(color) {
  for (const pc of [...pieces.values()]) if (pc.color === color && legalFor(pc).length) return true;
  return false;
}
/* Khoá thế cờ (vị trí quân + bên tới lượt) để xét lặp lại */
function posKey(side) {
  let k = "";
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) { const p = B[r][c]; k += p ? (p.color === "red" ? p.type : p.type.toLowerCase()) : "."; }
  return k + side[0];
}
const hasAttackers = color => { for (const p of pieces.values()) if (p.color === color && "RHCP".includes(p.type)) return true; return false; };
/* Lặp 3 lần: xét vòng lặp gần nhất (từ lần xuất hiện trước của thế cờ tới giờ). Nếu chỉ một bên chiếu ở mọi nước của mình
   thì bên đó phạm luật chiếu dai, trả về màu bên đó; còn lại trả về null (hoà). entries = lịch sử đã gồm nước vừa đi. */
function repJudge(key, entries) {
  let i = entries.length - 2; while (i >= 0 && entries[i].key !== key) i--;
  const win = entries.slice(i + 1);
  const perp = col => { const ms = win.filter(h => h.side === col); return ms.length > 0 && ms.every(h => h.check); };
  const pr = perp("red"), pb = perp("black");
  return pr && !pb ? "red" : pb && !pr ? "black" : null;
}
/* Ký hiệu nước đi, tính TRƯỚC khi đi. Lưu dạng dữ liệu để đổi ngôn ngữ thì hiện lại được. */
function notation(pc, m) {
  const red = pc.color === "red", col = c => (red ? 9 - c : c + 1), fwd = red ? 1 : -1;
  const same = [...pieces.values()].filter(p => p.color === pc.color && p.type === pc.type && p.c === pc.c);
  let tand = 0;
  if (same.length > 1) { same.sort((a, b) => (b.r - a.r) * fwd); tand = same.indexOf(pc) + 1; }   // 1 = quân đứng trước
  const dr = (m.r - pc.r) * fwd;
  let op, arg;
  if ("AEH".includes(pc.type)) { op = dr > 0 ? "+" : "-"; arg = col(m.c); }
  else if (dr === 0) { op = "="; arg = col(m.c); }
  else { op = dr > 0 ? "+" : "-"; arg = Math.abs(dr); }
  return { t: pc.type, f: col(pc.c), tand, cnt: same.length, op, arg };
}
/* ---------- HÀNH ĐỘNG ---------- */
function fmtNote(nt) {
  const L = LETTER[LANG][nt.t], vi = LANG === "vi";
  const ops = vi ? { "+": ".", "-": "/", "=": "-" } : { "+": "+", "-": "-", "=": "=" };
  let head;
  if (!nt.tand) head = L + nt.f;
  else if (nt.cnt === 2) head = vi ? L + (nt.tand === 1 ? "t" : "s") : (nt.tand === 1 ? "+" : "-") + L;
  else head = nt.tand + L;                                      // 3+ Tốt cùng cột: đánh số từ trước ra sau
  return head + ops[nt.op] + nt.arg;
}
function logMsg(fn) { logs.push({ sys: true, fn }); }
function snapshot() {
  return { pcs: [...pieces.values()].map(p => ({ ...p })), nextId, turn, move, half, rep: [...rep], histLen: hist.length,

}
function doMove(pc, m) {
  if (MODE.vs === "bot") undoStack.push(snapshot());
  const color = pc.color, foe = opp(color), n = move, type0 = pc.type, nt = notation(pc, m);
  if (TC) { clock[color] = clockLeft(color) + TC.inc; clock.run = null; }
  const rec = make(pc, m);
  if (rec.cap) caps[color].push(rec.cap.type);
  sfx("move");
  last = { id: pc.id, from: { r: rec.fr, c: rec.fc }, to: { r: m.r, c: m.c } };
  sel = null; moves = [];
  turn = foe; if (color === "black") move++;
  const check = inCheck(foe), any = hasLegal(foe);
  logs.push({ side: color, n, nt, type: type0, check });
  const key = posKey(foe); rep.set(key, (rep.get(key) || 0) + 1); hist.push({ key, side: color, check });
  if (!any) {
    over = { winner: color, loser: foe, move: n, how: check ? "mate" : "stale" };
    logMsg(() => check ? tr("l_mate", CNAME[color]) : tr("l_stale", CNAME[foe], CNAME[color]));
  } else if (rep.get(key) >= 3) {
    const bad = repJudge(key, hist);
    if (bad) { over = { winner: opp(bad), loser: bad, move: n, how: "perp" }; logMsg(() => tr("l_perp", CNAME[bad], CNAME[opp(bad)])); }
    else { over = { winner: null, move: n, why: "repeat" }; logMsg(() => tr("l_draw", drawText(over))); }
  } else {
    const why = half >= 120 ? "sixty" : !hasAttackers("red") && !hasAttackers("black") ? "material" : null;
    if (why) { over = { winner: null, move: n, why }; logMsg(() => tr("l_draw", drawText(over))); }
  }
  if (TC && !over) clockStart(foe);
  render();

}
/* Đi lại (chỉ khi đánh với AI): quay về lượt gần nhất của người chơi, tức rút cả nước của người lẫn nước AI vừa đáp. */
function canUndo() { return started && MODE.vs === "bot" && undoStack.length > 0 && undoStack.some(s => s.turn === MODE.human); }
function undo() {
  if (!canUndo()) return;
  let s; do { s = undoStack.pop(); } while (s.turn !== MODE.human);
  gameId++; clearTimeout(botTimer);
  B = Array.from({ length: 10 }, () => Array(9).fill(null)); pieces = new Map(); KING = {};
  for (const p of s.pcs) { const pc = { ...p }; pieces.set(pc.id, pc); B[pc.r][pc.c] = pc; if (pc.type === "K") KING[pc.color] = pc; }
  nextId = s.nextId; turn = s.turn; move = s.move; half = s.half; rep = new Map(s.rep); hist.length = s.histLen;
  caps = s.caps; last = s.last; logs.length = s.logsLen;
  over = null; overDismissed = false; sel = null; moves = [];
  logMsg(() => tr("l_undo"));
  $("#log")._n = -1;
  render();
}
/* Hết giờ: bên hết giờ thua, trừ khi đối thủ không còn quân tấn công (Xe, Mã, Pháo, Tốt) thì hoà. */
function flagFall(color, fromNet) {
  if (!started || over || !TC) return;
  clockStop(); clock[color] = 0;
  const foe = opp(color);
  if (!hasAttackers(foe)) { over = { winner: null, move, why: "flag", side: color }; logMsg(() => tr("l_draw", drawText(over))); }
  else { over = { winner: foe, move, how: "flag", loser: color }; logMsg(() => tr("l_flag", CNAME[color], CNAME[foe])); }
  render();
  if (MODE.vs === "online" && !fromNet) netSend({ t: "flag", color });
}
function renderClocks() {
  if (over && clock && clock.run) clockStop();
  for (const color of ["red", "black"]) {
    const e = $("#panel-" + color + " .clock"); if (!e) continue;
    e.hidden = !TC; if (!TC) continue;
    const left = clockLeft(color);
    e.textContent = fmtClock(left);
    e.classList.toggle("run", clock.run === color);
    e.classList.toggle("low", left < Math.min(TC.base * 0.1, 30e3));

}
setInterval(() => {
  if (!TC || !started) return;
  renderClocks();
  if (over || !clock.run) return;
  const left = clockLeft(clock.run);
  if (left <= 0 && (!isRemote(clock.run) || left <= -3000)) flagFall(clock.run);   // bên máy kia: chờ thêm 3 giây phòng nước đi đang tới
}, 100);
const drawText = o => tr("dr_" + o.why, CNAME[o.side]);

/* ============================================================
   BOT: negamax + alpha-beta + tìm tiếp các nước ăn quân (quiescence), tăng dần độ sâu tới khi hết giờ.
   Đánh giá: giá trị quân + điểm vị trí (Tốt qua sông, Mã/Xe linh hoạt, Pháo giữa...). Hết nước = thua (luật Cờ Tướng).
   ============================================================ */
const BOT_LEVELS = {
  easy:   { depth: 1, time: 0,    quiesce: false, noise: 120, blunder: 0.3 },
  normal: { depth: 2, time: 600,  quiesce: true,  noise: 25,  blunder: 0 },
  hard:   { depth: 3, time: 1000, quiesce: true,  noise: 0,   blunder: 0 },
  expert: { depth: 5, time: 1600, quiesce: true,  noise: 0,   blunder: 0 },
  master: { depth: 9, time: 3800, quiesce: true,  noise: 0,   blunder: 0 },
};
const PV = { P: 100, A: 200, E: 200, H: 400, C: 450, R: 900, K: 0 };
const WIN = 1000000, MATE_ZONE = WIN - 1000;
const PAWN_ADV = [0, 0, 0, 0, 8, 60, 80, 95, 90, 30];        // theo số hàng đã tiến (0 = hàng cuối của mình); qua sông từ hàng 5
const isAttacker = p => p.type === "R" || p.type === "H" || p.type === "C" || (p.type === "P" && !ownSide(p.color, p.r));
function posVal(p, nPieces) {
  const adv = p.color === "red" ? p.r : 9 - p.r, cen = 4 - Math.abs(p.c - 4);
  switch (p.type) {
    case "P": return PAWN_ADV[adv] + (adv >= 5 && adv <= 8 ? cen * 8 : 0);
    case "H": {
      let mob = 0;
      for (const [dr, dc] of ORTH) {
        const lr = p.r + dr, lc = p.c + dc; if (!inb(lr, lc) || B[lr][lc]) continue;
        for (const s of [-1, 1]) { const nr = dr ? p.r + 2 * dr : p.r + s, nc = dr ? p.c + s : p.c + 2 * dc; if (inb(nr, nc)) mob++; }
      }
      return mob * 7 + cen * 4 + (adv >= 3 && adv <= 7 ? 12 : 0) - (cen === 0 ? 12 : 0);
    }
    case "R": {
      let mob = 0;
      for (const [dr, dc] of ORTH) { let nr = p.r + dr, nc = p.c + dc; while (inb(nr, nc)) { mob++; if (B[nr][nc]) break; nr += dr; nc += dc; } }
      return mob * 4 + (adv >= 5 ? 10 : 0);
    }
    case "C": return (p.c === 4 && nPieces > 20 ? 18 : 0) + cen * 2 + (adv === 2 || adv === 3 ? 4 : 0) + (adv >= 7 ? -6 : 0);
    case "A": return p.c === 4 ? 6 : 0;
    case "E": return p.c === 4 ? 6 : 0;
    case "K": return p.c === 4 ? 4 : (adv > 0 ? -6 * adv : 0);
  }
  return 0;
}
/* Tàn cuộc: điểm thưởng cho bên "side" khi dồn Tướng địch: bớt ô chạy của Tướng địch, kéo quân tấn công lại gần Tướng địch,
   lôi Tướng địch ra khỏi vị trí an toàn. Chỉ tính khi side còn quân tấn công. */
const CLOSE_W = { R: 2, H: 4, C: 1, P: 5 };
function huntBonus(side) {
  const foe = opp(side), k = KING[foe];
  let b = 0, a = 0;
  for (const p of pieces.values()) {
    if (p.color !== side || !isAttacker(p)) continue;
    a++; b += CLOSE_W[p.type] * (12 - Math.abs(p.r - k.r) - Math.abs(p.c - k.c));
  }
  if (!a) return 0;
  let free = 0;                                                 // số ô Tướng địch còn đi được mà không bị kiểm soát
  for (const [dr, dc] of ORTH) {
    const nr = k.r + dr, nc = k.c + dc;
    if (!inPalace(foe, nr, nc)) continue;
    const t = B[nr][nc]; if (t && t.color === foe) continue;
    if (!attacked(nr, nc, side)) free++;
  }
  const kAdv = foe === "red" ? k.r : 9 - k.r;
  return b + (4 - free) * 18 + (k.c !== 4 ? 10 : 0) + kAdv * 8 + (free === 0 ? 25 : 0);

/* Điểm thế cờ nhìn từ phía "color" */
function evaluate(color) {
  const n = pieces.size, late = Math.max(0, 32 - n);                             // càng ít quân càng gần tàn cuộc
  let s = 0;
  for (const p of pieces.values()) {
    let v = PV[p.type];
    if (p.type === "C") v -= late * 2.5;                        // tàn cuộc ít ngòi: Pháo yếu đi, Mã mạnh lên
    else if (p.type === "H") v += late * 1.5;
    v += posVal(p, n);
    s += p.color === color ? v : -v;
  }
  if (n <= 18) s += huntBonus(color) - huntBonus(opp(color));

function clickable(r, c) {
  if (!started || over || !isLocal(turn)) return false;
  const p = B[r][c];
  if (sel) return moves.some(m => m.r === r && m.c === c) || !!(p && p.color === turn);
  return !!(p && p.color === turn);
}

/* ---------- RENDER ---------- */
const boardEl = $("#board"), lowL = $("#lowLayer"), pieceL = $("#pieceLayer"), topL = $("#topLayer");
function mk(cls, r, c) { const d = el("div", "mk " + cls); d.style.setProperty("--r", vr(r)); d.style.setProperty("--c", vc(c)); return d; }
/* Vẽ lưới bàn cờ (đối xứng nên không phụ thuộc bên nào ở dưới): đường kẻ, sông, Cung, dấu vị trí Pháo/Tốt */
function buildGrid() {
  const L = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  let s = `<rect class="frame" x=".5" y=".5" width="8" height="9"/>`;
  for (let y = 1; y <= 8; y++) s += L(.5, y + .5, 8.5, y + .5);
  for (let x = 1; x <= 7; x++) s += L(x + .5, .5, x + .5, 4.5) + L(x + .5, 5.5, x + .5, 9.5);
  s += L(3.5, .5, 5.5, 2.5) + L(5.5, .5, 3.5, 2.5) + L(3.5, 7.5, 5.5, 9.5) + L(5.5, 7.5, 3.5, 9.5);
  const g = .08, l = .2, marks = [[2, 1], [2, 7], [7, 1], [7, 7]];
  for (const r of [3, 6]) for (const c of [0, 2, 4, 6, 8]) marks.push([r, c]);
  for (const [r, c] of marks) {
    const x = c + .5, y = r + .5;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      if ((c === 0 && sx < 0) || (c === 8 && sx > 0)) continue;
      s += `<path d="M${x + sx * g} ${y + sy * (g + l)}L${x + sx * g} ${y + sy * g}L${x + sx * (g + l)} ${y + sy * g}"/>`;
    }
  }
  s += `<text x="2.5" y="5.19" font-size=".52" text-anchor="middle" letter-spacing=".5">楚 河</text><text x="6.5" y="5.19" font-size=".52" text-anchor="middle" letter-spacing=".5">漢 界</text>`;
  $("#grid").innerHTML = s;
}
function buildBoardView() {
  const bottom = FLIP ? "black" : "red", top = opp(bottom);
  const num = (color, c) => (color === "red" ? 9 - c : c + 1);    // số cột tính từ bên phải người cầm quân
  $("#filesBot").innerHTML = Array.from({ length: 9 }, (_, dc) => `<span>${num(bottom, vc(dc))}</span>`).join("");
  $("#filesTop").innerHTML = Array.from({ length: 9 }, (_, dc) => `<span>${num(top, vc(dc))}</span>`).join("");
}
function renderBoard() {
  const seen = new Set();
  for (const pc of pieces.values()) {
    seen.add(pc.id);
    let e = pieceEls.get(pc.id);
    if (!e) { e = el("div", "piece"); e.appendChild(discEl(pc.type, pc.color)); pieceEls.set(pc.id, e); pieceL.appendChild(e); }
    e.style.setProperty("--r", vr(pc.r)); e.style.setProperty("--c", vc(pc.c));
    e.classList.toggle("top", !!(last && last.id === pc.id));
  }
  for (const [id, e] of [...pieceEls]) if (!seen.has(id)) { pieceEls.delete(id); e.classList.add("dying"); setTimeout(() => e.remove(), 320); }
  lowL.innerHTML = ""; topL.innerHTML = "";
  if (last) { lowL.appendChild(mk("last from", last.from.r, last.from.c)); lowL.appendChild(mk("last", last.to.r, last.to.c)); }
  const checked = started && !over && inCheck(turn) ? KING[turn] : null;
  if (checked) lowL.appendChild(mk("danger", checked.r, checked.c));
  if (sel && pieces.get(sel)) {
    const pc = pieces.get(sel); lowL.appendChild(mk("sel", pc.r, pc.c));
    for (const m of moves) topL.appendChild(mk(m.kind === "capture" ? "cap" : "mv", m.r, m.c));
  }
  if (hoverCell && clickable(hoverCell.r, hoverCell.c)) topL.appendChild(mk("hover", hoverCell.r, hoverCell.c));
  if (checked) { const f = mk("kflag" + (vr(checked.r) === 0 ? " in" : ""), checked.r, checked.c); f.innerHTML = `<span>${tr("flag_check")}</span>`; topL.appendChild(f); }
}
function buildPanel(color) {
  const p = $("#panel-" + color);
  p.innerHTML = `<div class="p-head"><span class="who">${tr("p_title", CNAME[color].toLowerCase()).toUpperCase()}<em class="role"></em></span><span class="badge"></span></div>
    <div class="capsrow"><div class="caps"></div><b class="adv"></b><div class="clock" hidden></div></div>`;
}
const MAT = { R: 9, C: 4.5, H: 4, A: 2, E: 2, P: 1, K: 0 };   // giá trị quen dùng để hiện bên nào hơn quân
const CAP_ORDER = "RCHAEP";
function renderPanels() {
  const mat = { red: 0, black: 0 };
  for (const p of pieces.values()) mat[p.color] += MAT[p.type];
  for (const color of ["red", "black"]) {
    const p = $("#panel-" + color), active = started && !over && turn === color;
    p.classList.toggle("active", active);
    $(".role", p).textContent = MODE.vs === "bot" ? (isBot(color) ? tr("role_bot", tr("lvl_" + MODE.level)) : tr("role_you"))
      : MODE.vs === "online" && started ? (isRemote(color) ? tr("role_opp") : tr("role_you")) : "";
    $(".badge", p).textContent = !started ? "" : over ? (over.winner === color ? tr("bd_win") : "") : (active ? (isBot(color) ? tr("bd_think") : tr("bd_turn")) : tr("bd_wait"));
    const list = caps[color].slice().sort((a, b) => CAP_ORDER.indexOf(a) - CAP_ORDER.indexOf(b));
    $(".caps", p).innerHTML = list.map((t, i) => (i && t !== list[i - 1] ? `<span class="gap"></span>` : "") + discHTML(t, opp(color))).join("");
    const diff = mat[color] - mat[opp(color)];
    $(".adv", p).textContent = diff > 0 ? "+" + diff : "";
  }
}
function overText() {
  if (over.aborted) return tr("st_aborted");
  const w = CNAME[over.winner], l = CNAME[over.loser];
  switch (over.how) {
    case "left": return tr("st_left", w);
    case "flag": return tr("st_flag", w, l);
    case "mate": return tr("st_mate", w);
    case "stale": return tr("st_stale", w, l);
    case "perp": return tr("st_perp", w, l);
  }
  return tr("st_draw", drawText(over));
}
function renderStatus() {
  $("#status .dot").className = "dot " + (over ? (over.winner || "draw") : turn) + (started && !over && !isLocal(turn) ? " think" : "");
  let t;
  if (!started) t = tr("st_notstarted");
  else if (over) t = overText();
  else {
    const who = CNAME[turn].toUpperCase();
    if (isBot(turn)) t = tr("st_bot", who);
    else if (isRemote(turn)) t = tr("st_remote", who);
    else if (sel) t = moves.length ? tr("st_sel", who, PNAME[pieces.get(sel).type]) : tr("st_nomove", who, PNAME[pieces.get(sel).type]);
    else t = tr("st_idle", who);
    if (isLocal(turn) && inCheck(turn)) t += ` <span class="warn">${tr("w_check")}</span>`;
  }
  $("#statusText").innerHTML = t;
}
function renderMid() {
  $("#tally").innerHTML = (half >= 40 ? `<span title="${tr("tl_half", half)}">½ ${half}/120</span>` : "") + `<span style="margin-left:auto">${tr("tl_move", move)}</span>`;
  const lg = $("#log");
  if (lg._logs === logs && lg._n === logs.length && lg._lang === LANG) return;   // chỉ dựng lại khi có dòng mới
  const stick = lg._logs !== logs || lg._n > logs.length || lg.scrollHeight - lg.scrollTop - lg.clientHeight < 40, keep = lg.scrollTop;
  const rows = []; let row = null;
  const cellHTML = l => `<span class="sm">${l ? discHTML(l.type, l.side) + fmtNote(l.nt) + (l.check ? `<span class="ck">!</span>` : "") : ""}</span>`;
  for (const l of logs) {
    if (l.sys) { rows.push(`<li class="sys">${l.fn()}</li>`); row = null; continue; }
    if (l.side === "red") { row = { n: l.n, w: l, b: null }; rows.push(row); }
    else if (row && row.n === l.n && !row.b) row.b = l;
    else { row = { n: l.n, w: null, b: l, dots: true }; rows.push(row); }
  }
  lg.innerHTML = rows.map(x => typeof x === "string" ? x : `<li class="mvrow"><b class="mn">${x.n}.${x.dots ? ".." : ""}</b>${cellHTML(x.w)}${cellHTML(x.b)}</li>`).join("");
  lg._logs = logs; lg._n = logs.length; lg._lang = LANG;
  lg.scrollTop = stick ? lg.scrollHeight : keep;
}
function renderOver() {
  const go = $("#gameover");
  if (!over || overDismissed) { go.hidden = true; return; }
  if (go.hidden) sfx(!over.winner ? "draw" : MODE.vs !== "pvp" && over.winner !== MODE.human ? "lose" : "win", 250);
  go.hidden = false;
  $("#goTitle").textContent = over.aborted ? tr("go_aborted") : over.winner ? (MODE.vs === "bot" ? (over.winner === MODE.human ? tr("go_you") : tr("go_bot"))
    : MODE.vs === "online" ? (over.winner === MODE.human ? tr("go_you") : tr("go_opp")) : tr("go_side", CNAME[over.winner].toUpperCase())) : tr("go_draw");
  const l = CNAME[over.loser];
  $("#goSub").textContent = over.aborted ? tr("gs_aborted") : over.how === "left" ? tr("gs_left", over.move) : over.how === "flag" ? tr("gs_flag", l, over.move)
    : over.how === "mate" ? tr("gs_mate", over.move) : over.how === "stale" ? tr("gs_stale", l, over.move) : over.how === "perp" ? tr("gs_perp", l, over.move) : drawText(over);
  const rematch = MODE.vs === "online" && netOpen();
  $("#goNew").textContent = tr(rematch ? "go_rematch" : "b_new");
  $("#goNew").disabled = rematch && NET.rm.me;
  $("#goNet").textContent = !rematch ? "" : NET.rm.me ? tr("go_rm_wait") : NET.rm.them ? tr("go_rm_them") : "";
  $("#goUndo").hidden = !canUndo();
}
function renderUndo() {
  const b = $("#btnUndo");
  b.hidden = !(started && MODE.vs === "bot");
  b.disabled = !canUndo();
}
function render() { renderBoard(); renderPanels(); renderClocks(); renderStatus(); renderMid(); renderUndo(); renderOver(); }

/* ---------- KÍCH THƯỚC RESPONSIVE ---------- */
function fit() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight - ((document.getElementById("tb-header") || {}).offsetHeight || 0);
  const portrait = vw < 900;
  document.body.classList.toggle("portrait", portrait);
  let cell;
  if (portrait) cell = Math.floor((vw - 16 - 18) / 9);
  else cell = Math.min(Math.floor((vw - 24 - 312 - 20 - 18) / 9), Math.floor((vh - 150 - 44) / 10));
  cell = Math.max(portrait ? 30 : 46, Math.min(cell, 84));
  document.documentElement.style.setProperty("--cell", cell + "px");
}

/* ---------- MODAL: CHẾ ĐỘ ---------- */
let modeDraft = null;
const MODE_SEGS = [["#segVs", "vs"], ["#segNet", "net"], ["#segSide", "human"], ["#segLevel", "level"], ["#segTime", "tc"], ["#segTheme", "theme"]];
function buildTimeSeg() {
  $("#segTime").innerHTML = TC_KEYS.map(k => `<button data-v="${k}"><b>${tr("tc_" + k)}</b>${TIME_CONTROLS[k] ? `<small>${TIME_CONTROLS[k].label}</small>` : ""}</button>`).join("");
}
function syncMode() {
  for (const [id, key] of MODE_SEGS) document.querySelectorAll(id + " button").forEach(b => b.classList.toggle("on", b.dataset.v === modeDraft[key]));
  const vs = modeDraft.vs, online = vs === "online", join = online && modeDraft.net === "join";
  const sideOff = vs === "pvp" || join, levelOff = vs !== "bot";
  $("#netOpts").classList.toggle("off", !online);
  $("#segNet").querySelectorAll("button").forEach(b => { b.disabled = !online; });
  $("#joinCode").disabled = !join; $("#joinCode").placeholder = tr("m_code_ph");
  if (!$("#joinCode").value && modeDraft.code) $("#joinCode").value = modeDraft.code;
  $("#netNote").textContent = tr(join ? "m_net_join" : "m_net_create");
  $("#botOpts").classList.toggle("off", sideOff);
  $("#segSide").querySelectorAll("button").forEach(b => { b.disabled = sideOff; });
  $("#levelOpts").classList.toggle("off", levelOff && !sideOff);
  $("#segLevel").querySelectorAll("button").forEach(b => { b.disabled = levelOff; });
  $("#levelNote").textContent = tr("lvln_" + modeDraft.level);
  const timeOff = vs === "bot" || join;
  $("#timeOpts").classList.toggle("off", timeOff);
  $("#segTime").querySelectorAll("button").forEach(b => { b.disabled = timeOff; });
  $("#timeNote").textContent = vs === "bot" ? tr("tcn_bot") : join ? tr("tcn_join") : tr("tcn_" + modeDraft.tc);
  $("#modeStart").textContent = online ? tr(join ? "m_join" : "m_create") : started && !over ? tr("m_forfeit") : tr("m_start");
  $("#modeCancel").hidden = !started;
  if (!started) {                                     // bàn phía sau popup đổi theo theme và bên cầm quân
    MODE = clone(modeDraft); applyTheme();
    FLIP = (vs === "bot" || (online && !join)) && modeDraft.human === "black";
    document.body.classList.toggle("flip", FLIP); buildBoardView(); render();
  }
}
function openMode() { modeDraft = clone(MODE); syncMode(); $("#mMode").hidden = false; }

/* ---------- MODAL: LUẬT CHƠI ---------- */
function fillRules() {
  $("#rulesPieces").innerHTML = TYPES.map(t => `<div class="rp"><div class="ic">${discHTML(t, "red")}${discHTML(t, "black")}</div><p>${tr("r_" + t)}</p></div>`).join("");
  $("#rulesEnd").innerHTML = (I18N[LANG].r_end || I18N.vi.r_end).map(s => `<li>${s}</li>`).join("");
}
function openRules() { fillRules(); $("#mRules").hidden = false; }

/* ---------- NGÔN NGỮ (theo cờ trên header chung của Twistboard) ---------- */
function setLang(l) {
  LANG = l; applyNames(); applyI18n(); buildTimeSeg(); if (modeDraft) syncMode();
  buildPanel("red"); buildPanel("black");
  if (!$("#mRules").hidden) fillRules();
  render();
}
if (window.TB) TB.onLang(l => { if (l !== LANG) setLang(l); });

/* ---------- SỰ KIỆN ---------- */
buildTimeSeg();
$("#segTime").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled || !modeDraft) return; modeDraft.tc = b.dataset.v; syncMode(); });
$("#segTheme").innerHTML = Object.entries(THEMES).map(([k, t]) => `<button data-v="${k}"><span class="sw"><i style="background:${t.bd}"></i><i style="background:${t.line}"></i></span>${t.name}</button>`).join("");
for (const [id, key] of MODE_SEGS) {
  if (key === "tc") continue;
  document.querySelectorAll(id + " button").forEach(b => b.addEventListener("click", () => {
    modeDraft[key] = b.dataset.v; syncMode();
    if (modeDraft.vs === "online" && modeDraft.net === "join" && (key === "net" || key === "vs")) $("#joinCode").focus();
  }));
}
$("#joinCode").addEventListener("input", e => { const v = normCode(e.target.value); if (e.target.value !== v) e.target.value = v; });
$("#joinCode").addEventListener("keydown", e => { if (e.key === "Enter") $("#modeStart").click(); });
$("#netCancel").addEventListener("click", () => { netClose(true); $("#mNet").hidden = true; if (!started) openMode(); });
$("#netCopy").addEventListener("click", () => {
  const inp = $("#netLink"), btn = $("#netCopy");
  const done = () => { btn.textContent = tr("n_copied"); setTimeout(() => { btn.textContent = tr("n_copy"); }, 1500); };
  const legacy = () => { inp.select(); try { document.execCommand("copy"); done(); } catch (e) {} };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, legacy); else legacy();
});
window.addEventListener("pagehide", () => { if (netOpen()) try { NET.conn.send({ t: "bye" }); } catch (e) {} });
$("#modeCancel").addEventListener("click", () => { $("#mMode").hidden = true; });
$("#modeStart").addEventListener("click", () => {
  if (modeDraft.vs === "online") {
    if (modeDraft.net === "join") {
      modeDraft.code = normCode($("#joinCode").value);
      if (modeDraft.code.length !== CODE_LEN) { $("#netNote").textContent = tr("n_err_code"); $("#joinCode").focus(); return; }
    }
    return startOnline();
  }
  netClose(true);
  MODE = clone(modeDraft); $("#mMode").hidden = true; newGame();
});
let rulesFromMode = false;
$("#btnRules").addEventListener("click", () => { rulesFromMode = false; openRules(); });
$("#rulesOk").addEventListener("click", () => { $("#mRules").hidden = true; if (rulesFromMode) { rulesFromMode = false; openMode(); } });
$("#btnUndo").addEventListener("click", undo);
$("#goUndo").addEventListener("click", undo);
boardEl.addEventListener("click", e => { const p = cellFromEvent(e); if (p) clickCell(p.r, p.c); });
boardEl.addEventListener("mousemove", e => {
  const p = cellFromEvent(e);
  if (!p || over) { if (hoverCell) { hoverCell = null; boardEl.style.cursor = ""; renderBoard(); } return; }
  if (!hoverCell || hoverCell.r !== p.r || hoverCell.c !== p.c) { hoverCell = p; boardEl.style.cursor = clickable(p.r, p.c) ? "pointer" : "default"; renderBoard(); }
});
boardEl.addEventListener("mouseleave", () => { hoverCell = null; renderBoard(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#mNet").hidden) $("#netCancel").click();
  else if (!$("#mRules").hidden) $("#rulesOk").click();
  else if (!$("#mMode").hidden) { if (started) $("#mMode").hidden = true; }
  else if (sel) cancelAll();
});
$("#btnNew").addEventListener("click", () => {
  if (MODE.vs === "online" && netOpen() && over) { overDismissed = false; return renderOver(); }
  openMode();
});
$("#goNew").addEventListener("click", () => { if (MODE.vs === "online" && netOpen()) return requestRematch(); openMode(); });
$("#goView").addEventListener("click", () => { overDismissed = true; renderOver(); });
document.querySelectorAll(".modal").forEach(m => m.addEventListener("mousedown", e => {
  if (e.target !== m || m.id === "mNet") return;
  if (m.id === "mRules") return $("#rulesOk").click();
  if (started) m.hidden = true;
}));
window.addEventListener("resize", fit);

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  buildGrid(); buildPanel("red"); buildPanel("black");
  applyI18n(); fit(); newGame(true);
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {                  // mở từ link mời: vào phòng luôn
    try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
    modeDraft = { ...clone(MODE), vs: "online", net: "join", code: room };
    startOnline();
  } else openMode();
  window.game = { get mode() { return MODE; }, get state() { return { B, pieces, turn, over, move, half, FLIP }; } };   // tiện debug ở console
})();
</script>
</body>
