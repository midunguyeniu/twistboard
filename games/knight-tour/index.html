<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knight's Tour · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<link rel="stylesheet" href="../../assets/puzzle-kit.css">
<script src="../../assets/platform.js"></script>
<script src="../../assets/puzzle-kit.js"></script>
<style>
.kt{width:100%;display:grid;place-items:center}
.kt-board{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));width:min(100%,560px,calc(100vh - 230px));min-width:250px;aspect-ratio:1;
  border-radius:6px;box-shadow:0 0 0 5px #fff,0 0 0 6px var(--tb-border),0 12px 28px rgba(20,30,60,.2);user-select:none;-webkit-user-select:none;container-type:inline-size;touch-action:manipulation}
.kt-cell{position:relative;border:0;padding:0;margin:0;min-width:0;min-height:0;line-height:1;font:inherit;font-weight:800;color:#6b5636;display:grid;place-items:center;cursor:default;
  font-size:calc(100cqw / var(--n) * .32);font-variant-numeric:tabular-nums;transition:background-color .15s}
.kt-cell.lt{background:#f3e7cf} .kt-cell.dk{background:#d9c19a}
.kt-cell.v.lt{background:#dde6f8} .kt-cell.v.dk{background:#c2d0ee}
.kt-cell.v{color:#2c3e6e}
.kt-cell.can{cursor:pointer}
.kt-cell.can::after{content:"";width:28%;height:28%;border-radius:50%;background:#2ea65a;box-shadow:0 0 0 4px rgba(46,166,90,.25);transition:transform .12s}
.kt-cell.can:hover::after{transform:scale(1.3)}
.kt-cell.prev{cursor:pointer}
.kt-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kt-path polyline{fill:none;stroke:#4a6fd8;stroke-opacity:.24;stroke-width:.05;stroke-linecap:round;stroke-linejoin:round}
.kt-path circle{fill:#4a6fd8;fill-opacity:.55}
.kt-knight{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));pointer-events:none;object-fit:contain;padding:0;transform:scale(1.18) translateY(-5%);z-index:2;
  transition:left .16s ease-out,top .16s ease-out;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.kt-board.stuck .kt-cell.cur{background:#f5c4bf}
.kt-board.won{box-shadow:0 0 0 5px #fff,0 0 0 8px var(--tb-green),0 12px 28px rgba(20,30,60,.2)}
.kt-board.won .kt-path polyline{stroke:var(--tb-green);stroke-opacity:.6}
.kt-board.off .kt-cell.can::after{display:none}
/* bàn nhỏ trong thẻ Luật chơi */
.ktr-b{position:relative;display:grid;grid-template-columns:repeat(5,22px);grid-template-rows:repeat(5,22px);box-shadow:0 0 0 2px #fff,0 0 0 3px #b9a684}
.ktr-b span{display:grid;place-items:center;font-weight:900;font-size:10.5px;color:#6b5636;font-variant-numeric:tabular-nums}
.ktr-b .lt{background:#f3e7cf}.ktr-b .dk{background:#d9c19a}
.ktr-b .v.lt{background:#dde6f8}.ktr-b .v.dk{background:#c2d0ee}.ktr-b .v{color:#2c3e6e}
.ktr-b .cur{background:#fff6d8}.ktr-b .cur.stuck{background:#f5c4bf}
.ktr-b .can::after{content:"";width:30%;height:30%;border-radius:50%;background:#2ea65a;box-shadow:0 0 0 2px rgba(46,166,90,.25)}
.ktr-b img{width:110%;height:110%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.ktr-undo{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #2b2f3a;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;color:#1d2330}
@media (max-width:780px){.kt-board{width:min(100%,calc(100vh - 250px));box-shadow:0 0 0 3px #fff,0 0 0 4px var(--tb-border),0 8px 18px rgba(20,30,60,.18)}}
</style>
</head>

<script>
"use strict";
/* RULES-START: luật + sinh đề, không đụng DOM (cắt ra chạy bằng Node được) */
const KN_D = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
function knNext(n, i) {   // các ô Mã nhảy tới được từ ô i trên bàn n×n
  const r = Math.floor(i / n), c = i % n, out = [];
  for (const [dr, dc] of KN_D) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < n && cc >= 0 && cc < n) out.push(rr * n + cc); }
  return out;
}
/* Tìm một hành trình bằng luật Warnsdorff (ưu tiên ô ít đường đi tiếp nhất, bằng nhau thì chọn ngẫu nhiên theo rng). Trả về đường đi hoặc null. */
function knTour(n, start, rng, tries = 40) {
  const N = n * n, nb = []; for (let i = 0; i < N; i++) nb.push(knNext(n, i));
  for (let t = 0; t < tries; t++) {
    const seen = new Uint8Array(N), path = [start]; seen[start] = 1; let cur = start;
    while (path.length < N) {
      let best = [], bd = 9;
      for (const j of nb[cur]) if (!seen[j]) {
        let d = 0; for (const k of nb[j]) if (!seen[k]) d++;
        if (d < bd) { bd = d; best = [j]; } else if (d === bd) best.push(j);
      }
      if (!best.length) break;
      cur = best[Math.floor(rng() * best.length)]; seen[cur] = 1; path.push(cur);
    }
    if (path.length === N) return path;
  }
  return null;
}
/* Người chơi chọn kích thước bàn (level = "5" | "6" | "7" | "8") cho cả chơi một mình lẫn online. */
const KT_SIZES = ["5", "6", "7", "8"];
const KT_SOLO_AT = { 5: "corner", 6: "corner", 7: "center", 8: "corner" };   // chơi một mình: ô xuất phát cố định kiểu (7×7 xuất phát giữa bàn)
function ktSolo(stage, rng, level) {
  const n = KT_SIZES.includes(level) ? +level : 5, at = KT_SOLO_AT[n];
  const start = at === "center" ? ((n - 1) / 2) * n + (n - 1) / 2 : [0, n - 1, n * (n - 1), n * n - 1][Math.floor(rng() * 4)];
  return { n, start, at };
}
/* Online: mọi đề cùng kích thước chủ phòng chọn, ô xuất phát ngẫu nhiên theo seed (bàn lẻ chỉ xuất phát ở ô cùng màu với góc), đã kiểm có lời giải. */
function ktOnline(k, level, rng) {
  const n = KT_SIZES.includes(level) ? +level : 6;
  for (let t = 0; t < 60; t++) {
    const r = Math.floor(rng() * n), c = Math.floor(rng() * n);
    if (n % 2 && (r + c) % 2) continue;
    if (knTour(n, r * n + c, rng, 30)) return { n, start: r * n + c, at: "random" };
  }
  return { n, start: 0, at: "corner" };
}
/* RULES-END */

/* ---------- VẼ + ĐIỀU KHIỂN ---------- */
let KV = null;   // trạng thái bàn đang hiện (để khung nhắc đọc số ô đã đi)
function mountKT(el, pz, ctx) {
  const n = pz.n, N = n * n, nb = [];
  for (let i = 0; i < N; i++) nb.push(knNext(n, i));
  const path = [pz.start], seen = new Int16Array(N); seen[pz.start] = 1;
  let cells = "";
  for (let i = 0; i < N; i++) { const r = Math.floor(i / n), c = i % n; cells += `<button type="button" class="kt-cell" data-i="${i}" data-sh="${(r + c) % 2 ? "dk" : "lt"}"></button>`; }
  el.innerHTML = `<div class="kt" style="--n:${n}"><div class="kt-board off">${cells}
    <svg class="kt-path" viewBox="0 0 ${n} ${n}" aria-hidden="true"><polyline/><circle r=".12"/></svg>
    <img class="kt-knight" src="${KNIGHT_IMG}" alt="" draggable="false"></div></div>`;
  const board = el.querySelector(".kt-board"), btns = [...board.querySelectorAll(".kt-cell")];
  const line = board.querySelector("polyline"), dot = board.querySelector("circle"), knight = board.querySelector(".kt-knight");
  const xy = i => [i % n + .5, Math.floor(i / n) + .5];
  KV = { pz, path, N, won: false };

  function tap(i) {
    if (!ctx.canPlay()) return;
    const cur = path[path.length - 1];
    if (path.length > 1 && i === path[path.length - 2]) return undo();   // bấm lại ô vừa đi = lùi 1 bước
    if (seen[i] || !nb[cur].includes(i)) return;
    path.push(i); seen[i] = path.length;
    ctx.sfx("step"); draw(); ctx.progress(path.length);
    if (path.length === N) { KV.won = true; draw(); ctx.solved(); }
  }
  function undo() {
    if (!ctx.canPlay() || path.length <= 1) return;
    seen[path.pop()] = 0; draw(); ctx.progress(path.length);
  }
  function reset() {
    if (!ctx.canPlay() || path.length <= 1) return;
    while (path.length > 1) seen[path.pop()] = 0;
    draw(); ctx.progress(1);
  }
  board.addEventListener("click", e => { const b = e.target.closest(".kt-cell"); if (b) tap(+b.dataset.i); });
  ctx.tools([{ id: "undo", label: "t_undo", on: undo }, { id: "reset", label: "t_reset", on: reset }]);

  function draw() {
    const cur = path[path.length - 1], live = ctx.canPlay();
    const cand = new Set(live ? nb[cur].filter(j => !seen[j]) : []);
    const prev = live && path.length > 1 ? path[path.length - 2] : -1;
    btns.forEach((b, i) => {
      b.className = "kt-cell " + b.dataset.sh + (seen[i] ? " v" : "") + (i === cur ? " cur" : "") + (cand.has(i) ? " can" : "") + (i === prev ? " prev" : "");
      b.textContent = seen[i] && i !== cur ? seen[i] : "";
    });
    line.setAttribute("points", path.map(i => xy(i).join(",")).join(" "));
    const [sx, sy] = xy(path[0]); dot.setAttribute("cx", sx); dot.setAttribute("cy", sy);
    knight.style.left = (cur % n) / n * 100 + "%"; knight.style.top = Math.floor(cur / n) / n * 100 + "%";
    const stuck = live && !cand.size && path.length < N;
    board.classList.toggle("stuck", stuck); board.classList.toggle("won", KV.won); board.classList.toggle("off", !live);
    ctx.note(stuck ? ctx.tr("stuck") : "", "bad");

    start() { draw(); },
    reveal() { draw(); },
    destroy() { KV = null; },
    key(e) {
      if (!ctx.canPlay()) return;
      if (e.key === "Backspace" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z")) { e.preventDefault(); undo(); }
    },
  };
}

/* path: các ô đã đi [hàng, cột], ô cuối là chỗ Mã đang đứng; dots: ô có chấm xanh */
function ktrBoard(path, dots, stuck) {

    else if (k !== undefined) cls.push("v");
    if (dot.has(i)) cls.push("can");
    h += `<span class="${cls.join(" ").trim()}">${k === path.length - 1 ? `<img src="${KNIGHT_IMG}" alt="">` : k !== undefined ? k + 1 : ""}</span>`;
  }
  return `<div class="ktr-b">${h}</div>`;
}
const KT_CARDS = [
  { h: "c1_h", p: "c1_p", fig: () => ktrBoard([[2, 2]], [[0, 1], [0, 3], [1, 0], [1, 4], [3, 0], [3, 4], [4, 1], [4, 3]]) },
  { h: "c2_h", p: "c2_p", fig: () => ktrBoard([[0, 0], [1, 2], [0, 4], [2, 3], [4, 4], [3, 2], [4, 0], [2, 1], [0, 2]], [[1, 0], [1, 4]]) },
  { h: "c3_h", p: "c3_p", fig: ({ tr }) => ktrBoard([[0, 1], [1, 3], [3, 4], [4, 2], [2, 3], [4, 4], [3, 2], [2, 4], [4, 3], [3, 1], [1, 2], [0, 4]], [], true) +

PK.start({
