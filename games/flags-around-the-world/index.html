<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhớ cờ thế giới · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<script src="data.js"></script>
<style>
:root{
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold:#ffc928; --gold-ink:var(--tb-gold-ink);
  /* khung chơi: giấy kem, mực xanh đen, điểm vàng (bám bố cục bản gốc) */
  --paper:#f5f1e7; --paper-2:#ebe5d6; --ink:#15284a; --ink-2:#56627c; --blue:#2f5fa8; --yel:#f2bd2c; --red:#c8312b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.96)}
#app{max-width:1200px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.brand span{color:var(--muted);font-size:13.5px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}
.note{color:var(--muted);font-size:12.5px}

#stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
#stage.online{grid-template-columns:minmax(0,1fr) 270px}
.card2{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow)}
.h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.h3 span{color:var(--muted);letter-spacing:0;text-transform:none}

/* ---------- KHUNG CHƠI ---------- */
#board{background:var(--paper);color:var(--ink);border:1px solid #d9d1bf;border-radius:16px;box-shadow:var(--tb-shadow);display:flex;flex-direction:column;min-height:calc(100vh - 156px);overflow:hidden}
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 18px;border-bottom:2px solid var(--ink);min-height:58px}
#bar .bc{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
#barMode{font-weight:900;font-size:14px;white-space:nowrap}
#barRound{color:var(--blue);font-family:var(--tb-font-brand);font-weight:700;font-size:17px;line-height:1.15;white-space:nowrap}
#barL{font-weight:800;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{justify-self:end;font-family:var(--tb-font-brand);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
#timer.low{color:var(--red)}
#screen{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 20px 26px}
.go{display:block;width:100%;background:var(--ink);color:var(--yel);border:2px solid var(--ink);border-radius:4px;padding:13px 16px;font-size:18px;font-weight:900;cursor:pointer;font-family:var(--tb-font-brand);letter-spacing:.01em}
.go:hover{filter:brightness(1.15)}
.go:disabled{background:transparent;color:var(--ink-2);border-color:var(--ink-2);cursor:default;filter:none;opacity:.85}
.go.ghost{background:transparent;color:var(--ink)}
.go.ghost:hover{background:rgba(21,40,74,.06)}

/* lá cờ: viền mảnh + lớp bóng như vải (tự làm) */
.fl{position:relative;display:block;aspect-ratio:4/3;background:#ddd;box-shadow:0 0 0 1px rgba(21,40,74,.55);overflow:hidden}
.fl img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
.fl::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,.12) 0,rgba(255,255,255,0) 45%,rgba(0,0,0,.16) 100%)}

/* màn giới thiệu vòng */
.intro{width:min(580px,100%)}
.ihead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.big{font-family:var(--tb-font-brand);font-weight:800;font-size:76px;line-height:.82}
.big small{font-size:24px;color:var(--ink-2);margin-left:4px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tags span{border:1.5px solid var(--ink);padding:1px 6px;font-weight:800;font-size:12.5px;white-space:nowrap}
.rboxes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0 16px}
.rboxes div{border:2px solid var(--ink);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-family:var(--tb-font-brand);font-size:18px;min-height:46px}
.rboxes div span{font-size:16px}
.rboxes div.cur{background:rgba(242,189,44,.22)}
.rboxes div.x{border-style:dashed}
.idesc{font-weight:700;font-size:15px;line-height:1.55;margin:0 0 20px}
.rec{margin:12px 0 0;font-weight:800;font-size:13.5px;color:var(--ink-2);text-align:center}
.rec b{color:var(--ink)}

/* màn chiếu cờ */
.flash{display:flex;flex-direction:column;align-items:center;width:100%}
.flash .pass{color:var(--blue);font-weight:800;font-size:14px;height:20px}
.flash .fno{font-weight:900;font-size:16px;margin:4px 0 22px;height:22px}
.fbig{width:var(--fw,480px)}
.fbig .fl{box-shadow:0 0 0 1.5px var(--ink),0 10px 24px rgba(21,40,74,.18)}
.fbig.blank .fl{visibility:hidden}
.fbig.pop .fl{animation:fpop .16s ease-out}
@keyframes fpop{from{opacity:.25;transform:scale(.985)}to{opacity:1;transform:none}}
.prog{width:min(1000px,100%);margin-top:40px;position:relative;height:12px}
.prog::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ink)}
.prog i{position:absolute;left:0;top:0;height:5px;background:var(--ink);width:0}
.prog b{position:absolute;top:0;height:5px;width:3px;background:var(--paper)}
.prog .rail{position:absolute;left:0;right:0;top:0;height:5px;background:var(--paper-2)}
.ready{font-family:var(--tb-font-brand);font-weight:800;font-size:22px;text-align:center}
.ready big{display:block;font-size:84px;line-height:1;margin-top:8px}

/* màn chọn */
.pick{display:flex;gap:30px;align-items:flex-start;justify-content:center;width:100%}
.pick h2{margin:0 0 10px;font-size:20px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gg,10px);width:var(--gw,600px)}
.ft{position:relative;border:0;background:none;padding:4px;cursor:pointer;border-radius:4px}
.ft:hover{background:rgba(21,40,74,.07)}
.ft:disabled{cursor:default}
.ft .ring{position:absolute;left:-9%;top:-14%;width:118%;height:128%;pointer-events:none;opacity:0;transform:scale(.8) rotate(-4deg);transition:opacity .12s,transform .16s}
.ft.on .ring{opacity:1;transform:rotate(-4deg)}
.ft.full:not(.on) .fl{opacity:.74}
.pr{width:280px;flex:none;padding-top:30px}
.pcount{font-weight:900;font-size:13px;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px;margin-bottom:12px}
.slot{border:2px solid var(--ink);background:rgba(255,255,255,.4);height:44px;display:grid;place-items:center;padding:4px;cursor:pointer}
.slot.empty{border-style:dashed;border-color:rgba(21,40,74,.35);cursor:default;background:none}
.slot .fl{height:100%;aspect-ratio:4/3}
.phint{margin:12px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.5}

/* màn kết quả */
.res{display:flex;gap:30px;align-items:flex-start;justify-content:center;width:100%}
.rl{flex:1 1 0;max-width:640px;min-width:0}
.scorebox{background:var(--yel);text-align:center;font-family:var(--tb-font-brand);font-weight:800;font-size:72px;line-height:1;padding:16px 10px 10px;color:var(--ink)}
.scorebox small{font-size:30px;margin-left:8px}
.scorebox.low{background:#e7dfcb}
.mypk{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.mypk .pk{width:118px;text-align:center}
.mypk .pk.bad .fl{opacity:.45}
.mypk .pk i{display:block;font-style:normal;font-weight:900;font-size:17px;line-height:1.5;margin-top:4px}
.mypk .pk.ok i{color:var(--blue)} .mypk .pk.bad i{color:var(--red)}
.mypk .pk small{display:block;font-size:11.5px;font-weight:800;color:var(--ink-2);line-height:1.25;min-height:15px}
.miss{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 18px;font-weight:900;font-size:15px}
.miss .fl{width:46px}
.miss.none{color:var(--ink-2);font-size:13.5px}
.allh{font-weight:900;font-size:13px;margin:0 0 6px}
.allg{display:grid;grid-template-columns:repeat(var(--ac,5),1fr);gap:8px}
.allg .it small{display:block;font-size:11.5px;font-weight:800;line-height:1.25;margin-top:4px;color:var(--ink)}
.allg .it.ask small::before{content:"● ";color:var(--blue)}
.legend{font-size:11.5px;font-weight:700;color:var(--ink-2);margin:6px 0 0}
.legend b{color:var(--blue)}
.rr{width:280px;flex:none}
.rr p{margin:0 0 10px;font-weight:900;font-size:14px}
.rr .sub{font-weight:700;color:var(--ink-2);font-size:13px;margin-top:10px}
.rtab{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.rtab td{padding:6px 6px;border-bottom:1px solid rgba(21,40,74,.18);font-weight:800}
.rtab td.n{text-align:right;font-family:var(--tb-font-brand);font-size:16px;white-space:nowrap}
.rtab td.t{text-align:right;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.rtab tr.me td{background:rgba(242,189,44,.2)}
.rtab td.nm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtab th{text-align:left;font-size:11.5px;color:var(--ink-2);font-weight:800;padding:0 6px 4px;border-bottom:2px solid var(--ink)}
.rtab th.r{text-align:right}

/* màn tổng kết */
.fin{width:min(600px,100%)}
.fin h2{margin:0 0 12px;font-size:20px;font-weight:900;text-align:center}
.fin .btns{display:grid;gap:9px;margin-top:18px}
.fin .btns.two{grid-template-columns:1fr 1fr}
.newrec{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:900;padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:2px}
.place{font-family:var(--tb-font-brand);font-size:18px;width:28px;color:var(--gold-ink)}

/* chờ */
.waitbox{text-align:center;max-width:460px}
.waitbox h2{margin:0 0 8px;font-size:22px;font-weight:900}
.waitbox p{margin:0 0 12px;font-weight:700;color:var(--ink-2);line-height:1.5}
.waitbox .mypk{justify-content:center}
.spin{width:34px;height:34px;border:4px solid rgba(21,40,74,.18);border-top-color:var(--ink);border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* bảng điểm online */
#side{display:flex;flex-direction:column;gap:12px;min-width:0}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:11px;background:var(--field);border:1px solid var(--line);font-weight:800;font-size:14px}
.plist li.me{background:#fffbea;border-color:var(--gold)}
.plist li.left{opacity:.5}
.plist li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li .st{font-size:12px;color:var(--muted);white-space:nowrap}
.plist li .st.ok{color:var(--tb-green)}
.plist li b{font-family:var(--tb-font-brand);font-size:19px;min-width:22px;text-align:right}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none}
.youtag{font-weight:700;opacity:.6;white-space:nowrap}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg);position:relative}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.credit{margin-right:auto}
.seg{display:flex;gap:8px;flex-wrap:nowrap}
.seg button{flex:1;min-width:0;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 8px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg.small button{padding:7px 8px}
.field{width:100%;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:800;font-size:15px}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 240px}
#joinCode{flex:1 1 140px;min-width:0;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-size:18px}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
.netcode{font-family:var(--tb-font-brand);font-size:42px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:2px 0 8px;user-select:all;text-align:center}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#mLobby .card{max-width:520px}
.card .lseats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lseats li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--field);border:1px solid var(--line);min-height:44px}
.lseats li b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lseats li small{color:var(--muted);font-weight:800;font-size:12px}
.lseats li button{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.lseats li.empty{justify-content:center;color:var(--muted);font-size:13px;border-style:dashed;background:none}
#netMsg,#lobbyMsg{color:var(--muted);margin:12px 0 0;text-align:center}
/* chọn mức: thẻ ★/★★/★★★ tô màu vàng / xanh dương / đỏ như các game đố khác */
.lvcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;font:inherit;color:var(--text);min-width:0}
.lvc .stars{font-size:17px;letter-spacing:-1px;font-weight:900;line-height:1.1}
.lvc span{font-size:12.5px;font-weight:800;line-height:1.35}
.lvc small{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.35}
.lvc em{font-style:normal;font-size:11.5px;font-weight:900;margin-top:2px;color:var(--tb-green)}
.lvc[data-v="easy"]{border-color:#ffd24a;background:rgba(255,210,74,.12)}
.lvc[data-v="normal"]{border-color:#3d8bff;background:rgba(61,139,255,.08)}
.lvc[data-v="hard"]{border-color:#e5453b;background:rgba(229,69,59,.08)}
.lvc.on[data-v="easy"]{background:#ffd24a;color:#3a2a00}
.lvc.on[data-v="normal"]{background:#3d8bff;color:#fff}
.lvc.on[data-v="hard"]{background:#e5453b;color:#fff}
.lvc.on small,.lvc.on em{color:inherit;opacity:.9}
#segLvL button[data-v="easy"].on{background:#ffd24a;border-color:#ffd24a;color:#3a2a00}
#segLvL button[data-v="normal"].on{background:#3d8bff;border-color:#3d8bff;color:#fff}
#segLvL button[data-v="hard"].on{background:#e5453b;border-color:#e5453b;color:#fff}
#segLvL button{letter-spacing:-1px}
#segLvL button:disabled{cursor:default}
/* Luật chơi: 4 bước có hình nhỏ */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.step{background:var(--paper);color:var(--ink);border:1px solid #ddd4c0;border-radius:12px;padding:10px 12px}
.step h4{margin:0 0 6px;font-size:14.5px;font-weight:900;display:flex;gap:8px;align-items:center}
.step h4 b{font-family:var(--tb-font-brand);font-size:22px;line-height:1;color:var(--blue)}
.step p{margin:6px 0 0;font-size:13px;line-height:1.5}
.step .fig{display:flex;gap:6px;align-items:center;justify-content:center;min-height:52px}
.step .fig .fl{width:52px}
.step .fig .ar{font-weight:900;color:var(--ink-2)}
.step .fig .mk{font-weight:900;font-size:15px}
.step .fig .mk.o{color:var(--blue)} .step .fig .mk.x{color:var(--red)}
.step .fig .sc{border:1.5px solid var(--ink);padding:2px 7px;font-weight:900;font-family:var(--tb-font-brand);font-size:15px}
.lvtab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.lvtab td,.lvtab th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.lvtab th{font-size:12px;color:var(--muted)}
.lvtab td:first-child{white-space:nowrap;font-weight:900;letter-spacing:-1px}
.lvtab td:nth-child(3){white-space:nowrap}

@media (max-width:1000px){#stage.online{grid-template-columns:1fr}}
/* màn hẹp: cột phải xuống dưới lưới */
body.narrow .pick,body.narrow .res{flex-direction:column;align-items:center;gap:16px}
body.narrow .rl{flex:none;width:100%}
body.narrow .pr,body.narrow .rr{width:var(--gw,100%);max-width:100%;padding-top:0}
body.portrait #app{padding:8px 8px 24px}
body.portrait .brand{display:none}   /* điện thoại: ẩn logo + tên game cho đỡ tốn chỗ */
body.portrait .actions .btn{padding:7px 11px;font-size:13px}
body.portrait #board{border-radius:12px;min-height:calc(100vh - 134px)}
body.portrait #bar{padding:6px 10px;min-height:52px}
body.portrait #barL{font-size:12px}
body.portrait #screen{padding:14px 10px 18px}
body.portrait .pick h2{font-size:16px}
body.portrait .grid{--gg:4px}
body.portrait .ft{padding:3px}
body.portrait .slot{height:36px}
body.portrait .big{font-size:60px}
body.portrait .rboxes{gap:6px}
body.portrait .rboxes div{padding:7px 8px;font-size:16px}
body.portrait .scorebox{font-size:56px;padding:12px 8px 8px}
body.portrait .mypk .pk{width:calc((100% - 24px) / 5)}
body.portrait .allg{gap:5px}
body.portrait .allg .it small{font-size:10.5px}
body.portrait .lvcards{grid-template-columns:1fr}
body.portrait .steps{grid-template-columns:1fr}
body.portrait .flash .fno{margin-bottom:14px}
body.portrait .prog{margin-top:26px}
</style>
</head>
<body>
<div id="tb-header"></div>
<script>TB.mountHeader({ page: "game", gameId: "flags-around-the-world" });</script>
<div id="app">
  <header class="top">
    <div class="brand"><h1 data-i18n="brand"></h1><span data-i18n="tagline"></span></div>
    <div class="actions">
      <button class="btn" id="btnRules" data-i18n="b_rules"></button>
      <button class="btn primary" id="btnNew" data-i18n="b_new"></button>
    </div>
  </header>
  <main id="stage">
    <section id="board">
      <div id="bar"><div id="barL"></div><div class="bc"><span id="barMode"></span><span id="barRound"></span></div><span id="timer"></span></div>
      <div id="screen"></div>
    </section>
    <aside id="side" hidden>
      <section class="card2"><h3 class="h3"><span data-i18n="h_score" style="color:inherit;text-transform:uppercase;letter-spacing:.1em"></span><span id="sideInfo"></span></h3><ul class="plist" id="plist"></ul></section>
    </aside>
  </main>
</div>

<div class="modal" id="mRules" hidden>
  <div class="card">
    <h2 data-i18n="brand"></h2>
    <p data-i18n="r_intro"></p>
    <div class="steps" id="steps"></div>
    <h3 data-i18n="r_h_lv"></h3>
    <table class="lvtab" id="lvtab"></table>
    <h3 data-i18n="r_h_modes"></h3>
    <ul><li data-i18n="r_solo"></li><li data-i18n="r_daily"></li><li data-i18n="r_online"></li><li data-i18n="r_tie"></li></ul>
    <p class="note" data-i18n="r_inspired"></p>
    <p class="note" data-i18n="r_flags"></p>
    <div class="foot"><span class="note credit tb-credit"></span><button class="btn primary" id="rulesOk" data-i18n="ok"></button></div>
  </div>
</div>

<div class="modal" id="mMode" hidden>
  <div class="card">
    <h2 data-i18n="m_title"></h2>
    <h3 data-i18n="m_mode"></h3>
    <div class="seg" id="segMode"><button data-v="daily" data-i18n="m_daily"></button><button data-v="solo" data-i18n="m_solo"></button><button data-v="online" data-i18n="m_online"></button></div>
    <div id="lvBox">
      <h3 id="lvTitle" data-i18n="m_level"></h3>
      <div class="lvcards" id="lvCards"></div>
      <p class="note" id="lvNote"></p>
    </div>
    <div id="netBox">
      <h3 data-i18n="m_name"></h3>
      <input class="field" id="myName" maxlength="12" autocomplete="off" spellcheck="false">
      <h3 data-i18n="m_net"></h3>
      <div class="netrow">
        <div class="seg" id="segNet"><button data-v="create" data-i18n="m_create"></button><button data-v="join" data-i18n="m_join"></button></div>
        <input class="field" id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <p class="note" data-i18n="m_net_note"></p>
    </div>
    <div class="foot">
      <button class="btn" id="modeCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="modeStart" data-i18n="m_start"></button>
    </div>
  </div>
</div>

<div class="modal" id="mLobby" hidden>
  <div class="card">
    <h2 id="lobbyTitle"></h2>
    <div id="lobbyCode" hidden>
      <div class="netcode" id="netCode"></div>
      <div class="netlink"><input id="netLink" readonly><button class="btn" id="netCopy" data-i18n="n_copy"></button></div>
    </div>
    <h3 data-i18n="n_seats"></h3>
    <ul class="lseats" id="lobbySeats"></ul>
    <h3 data-i18n="m_level"></h3>
    <div class="seg small" id="segLvL"><button data-v="easy">★</button><button data-v="normal">★★</button><button data-v="hard">★★★</button></div>
    <p class="note" id="lobbyLvNote" style="margin:6px 0 0"></p>
    <p id="lobbyMsg"></p>
    <div class="foot">
      <button class="btn" id="lobbyLeave" data-i18n="n_leave"></button>
      <button class="btn primary" id="lobbyStart" hidden></button>
    </div>
  </div>
</div>

<div class="modal" id="mNet" hidden>
  <div class="card" style="max-width:440px;text-align:center">
    <h2 id="netTitle"></h2>
    <p id="netMsg"></p>
    <div class="foot" style="justify-content:center">
      <button class="btn" id="netRetry" data-i18n="n_retry" hidden></button>
      <button class="btn primary" id="netClose" data-i18n="ok"></button>
    </div>
  </div>
</div>

/* ---------- LUẬT ----------
   Một vòng: chiếu n lá cờ (shown, theo thứ tự), mỗi lá ms mili giây, cả bộ chiếu passes lần.
   Trang chọn (grid) có `pick` lá đã chiếu (ask) trộn với lá chưa chiếu; lá đã chiếu mà không vào trang chọn thì không xuất hiện.
   Mỗi lá chọn đúng 1 điểm, chọn sai không trừ; chọn tối đa `pick` lá trong 60 giây.
   Mức Khó: lấy vài nhóm cờ na ná (FLAG_LOOK), chiếu 2 lá cùng nhóm liền nhau; trang chọn trộn thêm các lá na ná chưa chiếu.
   Một ván 3 vòng. Online: người dẫn đầu bằng điểm thì đấu vòng phụ (nhiều lá đúng hơn, rồi nhanh hơn), tối đa 3 vòng phụ. */
const LEVELS = {
  easy: { n: 6, pick: 3, grid: 15, ms: 2000, passes: 2 },
  normal: { n: 10, pick: 5, grid: 25, ms: 1000, passes: 3 },
  hard: { n: 10, pick: 5, grid: 25, ms: 1000, passes: 3, look: true, runs: 3, traps: 12 },

const LEVEL_IDS = ["easy", "normal", "hard"];
const ROUNDS = 3, MAX_EXTRA = 3, PICK_MS = 60000, PASS_GAP = 700;
const CODES = FLAG_DATA.map(s => s.split("|")[0]);
const NAMES = {};
FLAG_DATA.forEach(s => { const [c, vi, en] = s.split("|"); NAMES[c] = { vi, en }; });
const LOOK_GROUPS = FLAG_LOOK.map(g => g.trim().split(/\s+/));
const LOOK = {};   // mã → các mã na ná (một lá có thể nằm trong vài nhóm)
for (const g of LOOK_GROUPS) for (const c of g) { LOOK[c] = LOOK[c] || []; for (const d of g) if (d !== c && !LOOK[c].includes(d)) LOOK[c].push(d); }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function genRound(level, seed) {
  const L = LEVELS[level], rng = mulberry32(seed);
  let shown, ask, distract;
  if (!L.look) {
    const pool = shuffle(CODES.slice(), rng);
    shown = pool.slice(0, L.n);
    ask = shuffle(shown.slice(), rng).slice(0, L.pick);
    distract = pool.slice(L.n, L.n + L.grid - L.pick);
  } else {
    const used = new Set(), near = c => (LOOK[c] || []).some(d => used.has(d));
    const runs = [];
    for (const g of shuffle(LOOK_GROUPS.filter(g => g.length >= 3), rng)) {   // nhóm từ 3 lá: chiếu 2, còn ít nhất 1 lá làm bẫy
      if (runs.length >= L.runs) break;
      if (g.some(c => used.has(c) || near(c))) continue;   // không lấy 2 nhóm chồng nhau
      const run = shuffle(g.slice(), rng).slice(0, 2);
      run.forEach(c => used.add(c)); runs.push(run);
    }
    const singles = [];
    for (const c of shuffle(CODES.slice(), rng)) {
      if (singles.length >= L.n - runs.length * 2) break;
      if (used.has(c) || near(c)) continue;   // lá lẻ không na ná lá nào đã chiếu
      singles.push(c); used.add(c);
    }
    shown = shuffle(runs.concat(singles.map(c => [c])), rng).flat();   // mỗi cặp na ná đứng liền nhau
    ask = runs.map(r => r[rng() < .5 ? 0 : 1]);

/* Xếp hạng online. hist[i] = {k, who: [ghế], ans: {ghế: {p: [mã], ms}}}; vòng k < 3 là vòng chính, k >= 3 là vòng phụ.

  for (const h of hist) if (h.k < ROUNDS) for (const s of seats) { const a = h.ans[s]; tot[s] += a ? scoreOf(rdOf(h.k), a.p) : 0; tm[s] += a ? a.ms : PICK_MS; }

  const cmpX = (x, y) => y[0] - x[0] || x[1] - y[1];
  for (const h of hist) {
    if (h.k < ROUNDS || alive.length < 2) continue;
    const sc = s => { const a = h.ans[s]; return a ? [scoreOf(rdOf(h.k), a.p), a.ms] : [0, PICK_MS + 1]; };
    const ord = alive.slice().sort((a, b) => cmpX(sc(a), sc(b)));

}

/* ---------- tải trước ảnh cờ của vòng (để mỗi lá không bị trống trong 1 giây được chiếu) ---------- */

/* ---------- cỡ lá cờ theo màn hình (không phải cuộn ở màn chiếu và màn chọn) ---------- */
let PORTRAIT = false;
function fit() {
  PORTRAIT = innerWidth < 700;
  document.body.classList.toggle("portrait", PORTRAIT);
  const sw = $("#screen").clientWidth;
  document.body.classList.toggle("narrow", sw < 800);
  const fb = $("#fbig");
  if (fb) { const w = Math.max(200, Math.min(520, sw - 30, (innerHeight - (PORTRAIT ? 300 : 340)) / .75)); fb.style.setProperty("--fw", w + "px"); }
  fitGrid();
}
function fitGrid() {
  const g = $("#grid");
  if (!g || !G) return;
  const sw = $("#screen").clientWidth - (PORTRAIT ? 20 : 40), rows = LEVELS[G.level].grid / 5, narrow = sw < 760;
  const gap = PORTRAIT ? 4 : 10, pad = PORTRAIT ? 6 : 8;
  const top = $("#screen").getBoundingClientRect().top;
  // chiều cao cho lưới: màn hình trừ thanh trên, tiêu đề, (màn hẹp: thêm khung đã chọn + nút ở dưới)
  const availH = innerHeight - Math.max(0, top) - (narrow ? 230 : 110);
  const byH = (availH - (rows - 1) * gap) / rows / .75 + pad;   // bề ngang mỗi ô theo chiều cao
  const byW = ((narrow ? sw : sw - 310) - 4 * gap) / 5;
  const cw = Math.max(narrow ? 56 : 80, Math.min(140, byW, byH));
  const gw = Math.min(sw, cw * 5 + gap * 4);
  g.style.setProperty("--gw", gw + "px"); g.style.setProperty("--gg", gap + "px");
  $("#screen").style.setProperty("--gw", gw + "px");
}

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  if (window.TB && TB.closeX) TB.closeX({ "#mRules": "#rulesOk", "#mMode": "#modeCancel", "#mLobby": "#lobbyLeave", "#mNet": "#netClose" });   // nút × góc trên phải mỗi popup
  fit();
  applyLang();
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {
    PLAYED = true;
    if (PREFS.name) startGuest(room);
    else { PREFS.mode = "online"; PREFS.net = "join"; openMode(); $("#joinCode").value = room; $("#myName").focus(); }
  } else $("#mRules").hidden = false;   // mở trang: Luật chơi trước, "Đã hiểu" → bảng chọn cách chơi
  render();
})();
</script>
</body>
</html>
