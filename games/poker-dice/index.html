<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Xúc Xắc · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<style>
:root{
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold:#ffc928; --gold-ink:var(--tb-gold-ink);
  --felt-1:#2fa56a; --felt-2:#17794a; --felt-3:#0e5a36; --rim:#7a5230; --rim-2:#55361c;
  --win:#1fae4b; --lose:#e5322b; --hit:#e0682b; --stay:#2f6fd6;
  --tw:820px; --th:430px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.94)}
#app{max-width:1200px;margin:0 auto;padding:14px 14px 12px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.brand span{color:var(--muted);font-size:13.5px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}
.btn.big{padding:11px 20px;font-size:15.5px;border-radius:12px}

#status{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);margin-bottom:12px;font-size:14px;min-height:46px}
#statusText{flex:1;line-height:1.35}
#statusText b{font-weight:900}
#timer{flex:none;font-family:var(--tb-font-brand);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:9px;background:var(--field);border:1px solid var(--line)}
#timer.low{color:#d9362b;animation:blink .5s infinite}
#timer:empty{display:none}
@keyframes blink{50%{opacity:.3}}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
#play{min-width:0;display:flex;flex-direction:column;gap:12px}
#side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card2{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow)}
.h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.h3 span{color:var(--muted);letter-spacing:0;text-transform:none}
.note{color:var(--muted);font-size:12.5px}

/* ---------- BÀN ---------- */
#table{position:relative;width:var(--tw);height:var(--th);margin:0 auto;user-select:none;-webkit-user-select:none}
#felt{position:absolute;left:5%;right:5%;top:11%;bottom:11%;border-radius:999px;
  background:radial-gradient(ellipse at 50% 38%,var(--felt-1),var(--felt-2) 58%,var(--felt-3));
  box-shadow:0 0 0 9px var(--rim),0 0 0 12px var(--rim-2),inset 0 0 0 2px rgba(255,255,255,.08),inset 0 0 50px rgba(0,0,0,.35),0 20px 40px rgba(20,30,60,.25)}
#felt::after{content:"";position:absolute;inset:16px;border-radius:inherit;border:1.5px dashed rgba(255,255,255,.14)}
body.portrait #felt{left:7%;right:7%;top:8%;bottom:8%;border-radius:150px}
/* giữa bàn: tên vòng | pot (luôn đúng tâm) | xúc xắc giới hạn */
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;color:#eafff2;pointer-events:none;width:70%}
#center .pot{grid-column:2;grid-row:1}
#center .phase{grid-column:1;grid-row:1;justify-self:end;text-align:right}
.pot{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.28);padding:4px 13px 4px 6px;border-radius:999px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.pot{min-width:88px;justify-content:center;box-sizing:border-box}
.pot:empty{visibility:hidden;height:30px}
.phase{font-size:12px;font-weight:800;opacity:.85;letter-spacing:.02em}
.chip{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--cc,#ef3f5a);box-shadow:inset 0 0 0 3px var(--cc,#ef3f5a),inset 0 0 0 5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4);flex:none}

#seats,#bets,#fx{position:absolute;inset:0;pointer-events:none}
/* chip người đi đầu: tím, số 1 trắng, nằm cạnh ô tên, chuyển sang người kế tiếp mỗi ván */
.fchip{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#7c4ddb;border:2px dashed rgba(255,255,255,.55);box-shadow:0 0 0 1.5px #4b2a9c,0 2px 5px rgba(0,0,0,.45);display:grid;place-items:center;pointer-events:auto;z-index:3}
.fchip[hidden]{display:none}
.fchip b{color:#fff;font-size:14px;font-weight:900;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.35)}
body.portrait .fchip{width:22px;height:22px;margin:-11px 0 0 -11px}
body.portrait .fchip b{font-size:12px}
.chip.fly{position:absolute;left:0;top:0;width:20px;height:20px;will-change:transform;box-shadow:inset 0 0 0 3.5px var(--cc),inset 0 0 0 6px rgba(255,255,255,.95),0 3px 6px rgba(0,0,0,.45);z-index:5}
.bet.bhide{visibility:hidden}
.bet.bland{animation:betland .28s ease-out}
@keyframes betland{from{transform:translate(-50%,-50%) scale(1.3)}to{transform:translate(-50%,-50%) scale(1)}}
/* Ghế neo theo tâm ô tên, ô tên nằm đúng trên viền bàn. Bài (.cards) luôn quay vào giữa bàn:
   d = dưới ô tên (ghế phía trên), u = trên ô tên (ghế của mình ở dưới), r/l = sang phải/trái (ghế hai bên). */
.seat{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;width:max-content}
.seat .cards{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:max-content}
.seat.d .cards{left:50%;top:calc(100% + 17px);transform:translateX(-50%)}
.seat.u .cards{left:50%;bottom:calc(100% + 17px);transform:translateX(-50%);flex-direction:column-reverse}
/* ghế hai bên: hàng 3 lá đầu ngang tầm ô tên, bài rút thêm mọc xuống dưới (không lấn lên ghế phía trên) */
.seat.r .cards{left:calc(100% + 12px);top:50%;transform:translateY(-19px)}
.seat.l .cards{right:calc(100% + 12px);top:50%;transform:translateY(-19px)}
.seat.u .stag{bottom:auto;top:-13px}
.seat.u .mk{top:auto;bottom:-7px}
.sbox{position:relative;display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;box-shadow:0 3px 10px rgba(20,30,60,.22);border:2.5px solid #fff;max-width:150px;transition:border-color .2s,box-shadow .2s}
.seat.turn .sbox{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,201,40,.45),0 3px 10px rgba(20,30,60,.22);animation:turnpulse 1.2s ease-in-out var(--tp,0s) infinite}
@keyframes turnpulse{50%{border-color:rgba(255,201,40,.3);box-shadow:0 0 0 4px rgba(255,201,40,.06),0 3px 10px rgba(20,30,60,.22)}}
.seat.me .sbox{background:#fffbea}
.seat.fold .sbox,.seat.fold .cards{opacity:.5}
.seat.out{opacity:.4;filter:grayscale(1)}
.seat.win .sbox{border-color:var(--win);box-shadow:0 0 0 4px rgba(31,174,75,.4),0 0 18px 4px rgba(31,174,75,.5)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;font-family:var(--tb-font-brand);position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.av .bot{position:absolute;right:-4px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:#1d2330;display:grid;place-items:center}
.av .bot svg{width:12px;height:12px;color:#fff}
.sinfo{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.sinfo b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
.sinfo span{font-size:12px;font-weight:800;color:#13824a;font-variant-numeric:tabular-nums}
.mk{position:absolute;top:-7px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mk.first{left:-5px;background:var(--gold);color:#1d2330;border:1.5px solid #1d2330}
.mk.first svg{width:9px;height:9px;margin-left:1px}
.stag{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:900;padding:1px 8px;border-radius:999px;background:#1d2330;color:#fff;letter-spacing:.02em}
.stag.fold{background:#8a8f9c} .stag.ok{background:var(--win)} .stag.think{background:#4a6fd8;animation:blink 1.2s infinite}
.stag.hit{background:var(--hit)} .stag.stay{background:var(--stay)}
/* bài trên ghế: 3 lá đầu một nhóm, lá HIT một nhóm; ghế hai bên và màn điện thoại thì lá HIT xuống hàng dưới */
.minis{display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center}
.minis .base,.minis .hits{display:flex;gap:3px;flex-wrap:nowrap}
.minis .hits{justify-content:center}
.minis .hits.w5,.minis .hits.w6{flex-wrap:wrap;row-gap:4px}
.minis .hits.w5{max-width:calc(var(--mw) * 5 + 12px)}
.minis .hits.w6{max-width:calc(var(--mw) * 6 + 15px)}
.minis{--mw:25px}
body:not(.portrait) .seat.r .minis .hits{justify-content:flex-start}
body:not(.portrait) .seat.l .minis .hits{justify-content:flex-end}
body.portrait .minis .hits.many{gap:2px}
body.portrait .minis .hits.many .cd.mini{--w:16px}   /* điện thoại, nhiều lá HIT: thu nhỏ để vẫn 1 hàng */
body:not(.portrait) .seat.me .minis{flex-direction:row;gap:6px}
/* ghế hai bên: các hàng bài canh sát phía ô tên, hàng HIT dài thì mọc về phía giữa bàn, không lấn ô tên */
body:not(.portrait) .seat.r .cards,body:not(.portrait) .seat.r .minis{align-items:flex-start}
body:not(.portrait) .seat.l .cards,body:not(.portrait) .seat.l .minis{align-items:flex-end}
body:not(.portrait) .seat.me .minis .hits{padding-left:6px;border-left:1.5px dashed rgba(255,255,255,.45)}
.sres{font-size:11.5px;font-weight:900;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:8px;white-space:nowrap}
.sres.over{background:rgba(179,36,30,.75)}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);color:#fff;font-weight:900;font-size:12.5px;padding:2px 9px 2px 3px;border-radius:999px;font-variant-numeric:tabular-nums;transition:left .35s,top .35s}
.bet .chip{width:15px;height:15px}

/* ---------- XÚC XẮC: mặt 9, 10, J, Q, K, A, mỗi mặt một màu ---------- */
.dz{--dw:24px;--fc:#1d2330;width:var(--dw);height:var(--dw);border-radius:calc(var(--dw) * .22);background:linear-gradient(155deg,#fff 0%,#f3f5fa 60%,#e3e7f0 100%);border:1px solid #c9cfdc;
  box-shadow:0 2px 0 #aeb6c7,0 3px 6px rgba(20,30,60,.22);position:relative;display:inline-grid;place-items:center;flex:none;
  font-family:var(--tb-font-brand);font-weight:800;color:var(--fc);font-size:calc(var(--dw) * .56);line-height:1;user-select:none;-webkit-user-select:none;transition:transform .15s ease-out,box-shadow .15s}
.dz b{font-weight:800;margin-top:calc(var(--dw) * .1);letter-spacing:-.05em}
.dz.f0{--fc:#2f6fd6} .dz.f1{--fc:#1f9d55} .dz.f2{--fc:#c27f00} .dz.f3{--fc:#e0682b} .dz.f4{--fc:#d9362b} .dz.f5{--fc:#8a4fd1}
.dz.back{background:radial-gradient(circle at 30% 25%,#4b5b86,#25304d 72%);border-color:#1b2440;box-shadow:0 2px 0 #121a30,0 3px 6px rgba(0,0,0,.3)}
.dz.back::after{content:"?";font-family:var(--tb-font-brand);font-weight:800;color:rgba(255,255,255,.5);font-size:calc(var(--dw) * .5);margin-top:calc(var(--dw) * .08)}
.dz.hid{background:repeating-linear-gradient(135deg,#fff 0 5px,#edf1ff 5px 10px);border-color:#9aaee8}
.dz.up{box-shadow:0 0 0 2.5px var(--gold),0 2px 0 #aeb6c7,0 3px 6px rgba(20,30,60,.22)}
.dz.big{--dw:54px;border-width:1.5px;border-radius:12px;box-shadow:0 3px 0 #aeb6c7,0 5px 10px rgba(20,30,60,.16)}
.dz.big.up{box-shadow:0 0 0 3px var(--gold),0 3px 0 #aeb6c7,0 5px 10px rgba(20,30,60,.16)}
.dz.sel{transform:translateY(-8px) rotate(-7deg);box-shadow:0 0 0 3px var(--hit),0 9px 14px rgba(224,104,43,.35)}
/* lăn 0,7 giây (ROLL_DUR trong JS): rơi xuống, lộn vài vòng, nảy nhẹ; mặt số chỉ hiện ra lúc gần nằm yên */
.dz[data-roll]{animation:tumble .7s cubic-bezier(.2,.7,.3,1) var(--rd,0ms) both}
.dz[data-roll] b,.dz[data-roll].back::after{animation:facein .7s linear var(--rd,0ms) both}
@keyframes tumble{0%{transform:translate(-10px,-24px) rotate(-320deg) scale(.45);opacity:0}12%{opacity:1}40%{transform:translate(2px,3px) rotate(-70deg) scale(1.08)}58%{transform:translate(0,-7px) rotate(18deg) scale(1)}76%{transform:translate(0,1px) rotate(-6deg) scale(1.03)}100%{transform:none;opacity:1}}
@keyframes facein{0%,70%{opacity:0}100%{opacity:1}}
/* viên vừa đổi trạng thái (lật ngửa khi giữ lại, lật ra lúc so tay) */
.dz.flip{animation:flipup .38s ease-out}
@keyframes flipup{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.minis .base{gap:3px}
body.portrait .minis .dz{--dw:19px}
.ruleimg .dz{--dw:32px}
.rank{display:flex;flex-direction:column;gap:5px;margin:6px 0 4px}
.rank .rr{display:flex;align-items:center;gap:10px}
.rank .rr b{flex:0 0 130px;font-size:14px}
.rank .rd{display:flex;gap:4px}
.rank .dz{--dw:26px}

/* ---------- KHU CỦA MÌNH ---------- */
.hand.dice{gap:10px;min-height:84px;align-items:flex-end}
.hand .slot.pickable{cursor:pointer}
.hand .slot.pickable:hover .dz:not(.sel){transform:translateY(-3px)}
.hand .slot .tg.re{color:var(--hit)} .hand .slot .tg.keep{color:#13824a}
.ctl .btn.roll{background:var(--hit)} .ctl .btn.roll.keep{background:#13824a} .ctl .btn.roll:hover{filter:brightness(1.07)}
.mhead .sum{font-weight:900}
.mhead .sum.c5,.mhead .sum.c6,.mhead .sum.c7{color:#13824a;border-color:#9bd6b0;background:#eefaf1}
.stag.re{background:var(--hit)}
.sres.won{background:rgba(19,130,74,.85)}
.srow .hn{font-weight:900;font-size:13.5px;white-space:nowrap;text-align:right}
.srow .hcards .dz{--dw:28px}
body.portrait .dz.big{--dw:48px}
body.portrait .hand.dice{gap:7px}
#mine{display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhead .h3{margin:0}
.mhead .sum{font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.mhead .sum b{font-weight:900;font-size:14.5px}
.mhead .sum.over b{color:var(--lose)} .mhead .sum.exact b{color:var(--win)}
.mhead .stack{margin-left:auto;font-weight:900;color:#13824a;font-variant-numeric:tabular-nums}
.hand{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;min-height:60px}
.hand .grp{display:flex;gap:6px;align-items:flex-end;padding-right:6px}
.hand .grp + .grp{padding-left:10px;border-left:1.5px dashed var(--line)}
.hand .slot{display:flex;flex-direction:column;align-items:center;gap:5px}
.hand .slot .tg{min-height:23px;display:flex;align-items:center;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.02em}
.hand .slot .tg.up{color:var(--gold-ink)}
.hand .slot .tg.hit{color:var(--hit)}
.hand .slot .pick{height:23px;font-size:11.5px;font-weight:900;padding:0 10px;border-radius:8px;border:none;background:var(--tb-primary);color:var(--tb-primary-ink);cursor:pointer;animation:wob 1.2s infinite}
@keyframes wob{50%{transform:translateY(-2px)}}
.prompt{font-size:14px;line-height:1.45;margin:0}
.prompt b{font-weight:900}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .btn{flex:1 1 110px;padding:11px 12px;font-size:15px}
.ctl .btn.fold{border-color:#e6b3b0;color:#b3241e}
.ctl .btn.call{background:#13824a;color:#fff;border-color:transparent}
.ctl .btn.raise{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.ctl .btn.hsb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 12px;color:#fff;border-color:transparent}
.ctl .btn.hsb span{font-family:var(--tb-font-brand);font-size:19px;letter-spacing:.06em;line-height:1.1}
.ctl .btn.hsb small{font-size:12px;font-weight:700;opacity:.9}
.ctl .btn.hit{background:var(--hit)} .ctl .btn.hit:hover{filter:brightness(1.07)}
.ctl .btn.stay{background:var(--stay)} .ctl .btn.stay:hover{filter:brightness(1.07)}
.raisebox{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.raisebox .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.raisebox .row button{flex:1 1 60px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--btn-line);background:#fff;font-weight:800;font-size:12.5px;cursor:pointer}
.raisebox input[type=range]{flex:1;min-width:140px;accent-color:#f0a020}
.raisebox .row button.back{flex:0 0 auto;padding:8px 14px}
.raisebox .row .btn.raise{flex:0 0 auto;min-width:150px;padding:8px 16px;background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent;font-size:13.5px}
.raisebox input[type=number]{width:80px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--btn-line);font:inherit;font-weight:900;text-align:right}
.wait{color:var(--muted);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0}
.wait b{color:var(--text)}
.dots::after{content:"";animation:dots 1.4s infinite steps(4)}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.eqfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eqfoot .btn{flex:0 0 auto}
.eqfoot .note{flex:1}

/* kết quả */
.show{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--field);border:1.5px solid var(--line)}
.srow.win{border-color:var(--win);background:#eefaf1}
.srow .who{display:flex;align-items:center;gap:8px;min-width:0}
.srow .who .av{width:30px;height:30px;font-size:14px}
.srow .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .who small{display:block;font-size:11px;font-weight:800;color:var(--muted)}
.srow .hcards{display:flex;gap:3px;align-items:center;flex-wrap:wrap;min-width:0}
.srow .hcards .cd{--w:30px}

#info p{margin:0 0 4px;font-size:13px}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg);position:relative}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.credit{margin-right:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg.small button{min-width:0;padding:7px 8px}
.field{width:100%;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:800;font-size:15px}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 240px}
#joinCode{flex:1 1 140px;min-width:0;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-size:18px}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
.netcode{font-family:var(--tb-font-brand);font-size:42px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:2px 0 8px;user-select:all;text-align:center}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#mLobby .card{max-width:520px}
.lseats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lseats li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--field);border:1px solid var(--line);box-sizing:border-box;min-height:48px}
#lobbyBot button:disabled{opacity:.45;cursor:not-allowed}
.lseats li .av{width:32px;height:32px;font-size:15px}
.lseats li b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lseats li small{color:var(--muted);font-weight:800;font-size:12px}
.lseats li button{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.lseats li button.lv{border:1.5px solid var(--btn-line);background:#fff;border-radius:8px;font-size:12px;padding:3px 9px;font-weight:800;cursor:pointer;color:var(--text);line-height:1.3}
.lseats li button.lv:hover{background:var(--btn-hover)}
.lvrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lvrow > span{flex:0 0 120px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px;min-width:0}
.lvrow .seg{flex:1}
.lvrow .av{width:24px;height:24px;font-size:11px}
.av .bot.lv-easy{background:#e8b000} .av .bot.lv-medium{background:#3d8bff} .av .bot.lv-hard{background:#d9362b}
/* mức máy bằng sao: 1 sao vàng, 2 sao xanh dương, 3 sao đỏ */
.lvrow .seg button,#segBotLv button{letter-spacing:-1px;white-space:nowrap}
.lvrow .seg button[data-v="easy"],#segBotLv button[data-v="easy"]{border-color:#ffd24a;background:rgba(255,210,74,.2)}
.lvrow .seg button[data-v="medium"],#segBotLv button[data-v="medium"]{border-color:#3d8bff;background:rgba(61,139,255,.16)}
.lvrow .seg button[data-v="hard"],#segBotLv button[data-v="hard"]{border-color:#e5453b;background:rgba(229,69,59,.16)}
.lvrow .seg button:hover:not(.on),#segBotLv button:hover:not(.on){filter:brightness(1.08)}
.lvrow .seg button.on[data-v="easy"],#segBotLv button.on[data-v="easy"]{background:#ffd24a;border-color:#ffd24a;color:#3a2a00}
.lvrow .seg button.on[data-v="medium"],#segBotLv button.on[data-v="medium"]{background:#3d8bff;border-color:#3d8bff;color:#fff}

.lseats li.empty{justify-content:center;color:var(--muted);font-size:13px;border-style:dashed;background:none}
.addbot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

.over-list li .av{width:30px;height:30px;font-size:14px}
.over-list li.me{background:#fffbea;border:1.5px solid var(--gold)}

/* ---------- HƯỚNG DẪN ---------- */
#tutBlock{position:fixed;inset:0;z-index:150;background:rgba(15,20,35,.55);transition:clip-path .25s}
#tutBlock.clear{background:rgba(15,20,35,.0)}
#tutRing{position:fixed;z-index:151;border-radius:14px;box-shadow:0 0 0 3px var(--gold),0 0 22px 4px rgba(255,201,40,.65);pointer-events:none;transition:all .25s;animation:ring 1.4s infinite}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--gold),0 0 30px 10px rgba(255,201,40,.35)}}
#tutBox{position:fixed;z-index:152;display:flex;align-items:flex-end;gap:8px;max-width:min(440px,calc(100vw - 20px));transition:left .25s,top .25s}
#tutBox .owl{width:74px;height:84px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.bubble{background:#fff;border-radius:16px;padding:13px 16px 12px;box-shadow:0 12px 34px rgba(15,20,35,.35);border:2px solid var(--gold);min-width:0}
.bubble .step{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#d9362b}
.bubble h4{margin:2px 0 6px;font-family:var(--tb-font-brand);font-size:19px;line-height:1.2}
.bubble p{margin:0;font-size:14px;line-height:1.5}
.bubble p + p{margin-top:6px}
.bubble .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;align-items:center;flex-wrap:wrap}
.bubble .bt .skip{margin-right:auto;background:none;border:none;color:var(--muted);font-weight:800;font-size:12.5px;cursor:pointer;padding:4px}
.bubble .todo{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:900;color:#a64a00;background:#fff3e0;border-radius:8px;padding:3px 9px}
.bubble code{font-family:var(--tb-font-brand);font-weight:800;background:var(--field);padding:0 5px;border-radius:5px;white-space:nowrap}

body.portrait #app{padding:8px 8px 24px}
body.portrait .brand span{display:none}
body.portrait .brand h1{font-size:21px}
body.portrait .actions .btn{padding:7px 11px;font-size:13px}
body.portrait #status{font-size:13px;min-height:52px}
body.portrait .sbox{padding:3px 9px 3px 3px;max-width:112px}
body.portrait .av{width:32px;height:32px;font-size:15px}
body.portrait .sinfo b{max-width:66px;font-size:12px}
body.portrait .cd.mini{--w:21px}
/* điện thoại: tên vòng nằm dưới pot, xúc xắc bên phải pot, pot vẫn đúng tâm */
body.portrait #center{width:auto;display:block}
body.portrait #center .phase{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
body.portrait .srow{grid-template-columns:1fr auto auto}
body.portrait .srow .hcards{grid-column:1 / -1;grid-row:2}
/* bàn 3 và 5 người: tên vòng nằm ngay trên pot, canh giữa (2 và 4 người thì nằm bên trái pot) */
body #center.stack{display:block;width:auto}
body #center.stack .phase{position:absolute;top:auto;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
body.portrait #center.stack .phase{top:calc(100% + 6px);bottom:auto}
@media (max-width:1040px){#stage{grid-template-columns:1fr}#side{display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:640px){#side{grid-template-columns:1fr}}
/* ghế của mình: "Tên (bạn)", tên dài thì cắt bớt tên nhưng luôn giữ "(bạn)" */
.youtag{font-weight:700;opacity:.6;white-space:nowrap}
.sinfo b.me{display:flex;max-width:150px}
.sinfo b.me .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sinfo b.me .youtag{flex:none;margin-left:.28em}   /* trong flex dấu cách đầu bị bỏ */
.seat.me .sbox{max-width:220px}
body.portrait .seat.me .sbox{max-width:190px}
body.portrait .sinfo b.me{max-width:130px}
</style>

    m_level: "Mức độ", m_bot_n: "Máy {0}", i_mode_mix: "Đấu máy · nhiều mức", i_bots: "Máy: {0}", n_lv_tip: "Bấm để đổi mức", lv_easy: "★", lv_medium: "★★", lv_hard: "★★★",

  logT(T, n ? "l_re" : "l_keep", s, n, upFaces(H, s));
  H.last[s] = { a: "re", n };
  emit(T, { t: "re", s, mask });
  H.toAct = nextRoller(T, s);
  if (H.toAct < 0) startStreet(T, H.reN);
  return true;
}
/* ---------- CƯỢC ---------- (giống Hit, Stay: ante là tiền cược của vòng cược 1) */
// mức cược tối đa trong vòng cược đang diễn ra (cap trừ phần đã bỏ ở vòng trước)
const streetMax = (H, s) => H.cap - (H.contrib[s] - H.bet[s]);
function startStreet(T, street) {
  const H = T.H;
  H.street = street; H.phase = "bet"; H.acted = {}; H.raises = 0;
  if (street === 2) { for (const s of H.live) H.bet[s] = 0; H.last = {}; }
  H.curBet = Math.max(...H.live.filter(s => inHand(H, s)).map(s => H.bet[s]));
  emit(T, { t: "phase" });
  // ante đã bằng trần (hoặc vòng 1 đã tố tới trần): không ai tố được nữa, bỏ qua vòng cược
  const ins = H.live.filter(s => inHand(H, s));
  if (ins.every(s => streetMax(H, s) <= H.curBet && H.bet[s] === H.curBet)) { H.skipped = (H.skipped || 0) | street; endStreet(T); return; }
  H.toAct = nextToAct(T, H.first, true);
  if (H.toAct < 0) endStreet(T);
}
function nextToAct(T, from, inclusive) {
  const H = T.H, n = T.seats.length;
  for (let k = inclusive ? 0 : 1; k <= n; k++) {
    const s = (from + k) % n;
    if (inHand(H, s) && (!H.acted[s] || H.bet[s] < H.curBet)) return s;
  }
  return -1;
}
function legalActions(T, s) {
  const H = T.H;
  if (!H || H.phase !== "bet" || H.toAct !== s) return null;
  const toCall = Math.max(0, H.curBet - H.bet[s]), max = streetMax(H, s);
  return { fold: true, check: toCall === 0, call: toCall, raise: max > H.curBet ? { min: H.curBet + 1, max } : null, toCall, curBet: H.curBet, pot: potTotal(H), cap: H.cap };
}
// a = {type: "fold"|"check"|"call"|"raise", to}; to = mức cược của vòng cược này (như poker)
function act(T, s, a) {
  const H = T.H, L = legalActions(T, s);
  if (!L || !a) return false;
  if (a.type === "fold") { H.folded[s] = true; logT(T, "l_fold", s); H.last[s] = { a: "fold" }; }
  else if (a.type === "check") { if (!L.check) return false; logT(T, "l_check", s); H.last[s] = { a: "check" }; }
  else if (a.type === "call") { if (!L.call) return false; put(T, s, L.call); logT(T, "l_call", s, L.call); H.last[s] = { a: "call", v: H.bet[s] }; }
  else if (a.type === "raise") {
    if (!L.raise) return false;
    const to = Math.round(a.to);
    if (!(to >= L.raise.min && to <= L.raise.max)) return false;
    put(T, s, to - H.bet[s]);
    for (const x of H.live) if (x !== s) H.acted[x] = false;
    logT(T, H.curBet === 0 ? "l_bet" : "l_raise", s, to);
    H.last[s] = { a: H.curBet === 0 ? "bet" : "raise", v: to };
    H.curBet = to; H.raises++; H.aggr[s]++;
  } else return false;
  H.acted[s] = true;
  emit(T, { t: "act", s, a: a.type });
  const left = H.live.filter(x => inHand(H, x));
  if (left.length === 1) { winByFold(T, left[0]); return true; }
  H.toAct = nextToAct(T, s);
  if (H.toAct < 0) endStreet(T);
  return true;
}
function endStreet(T) {
  const H = T.H;
  H.toAct = -1;
  if (H.street === 1) startRerolls(T, 2); else showdown(T);
}

/* ---------- LẬT XÚC XẮC ---------- */
// chia pot cho người thắng; chip lẻ cho người thắng gần người đi đầu nhất (tính từ người đi đầu)
function payWinners(T, amt, winners) {
  const H = T.H, pay = {}, each = Math.floor(amt / winners.length);
  for (const s of winners) pay[s] = each;
  let left = amt - each * winners.length;
  for (const s of orderFrom(T, H.first, winners)) { if (left <= 0) break; pay[s]++; left--; }
  return pay;
}
function showdown(T) {
  const H = T.H, ins = H.live.filter(s => inHand(H, s));
  const entries = ins.map(s => ({ s, ...evalDice(H.dice[s]) }));
  const winners = bestOf(entries), amt = potTotal(H), pay = payWinners(T, amt, winners);
  for (const s in pay) T.seats[s].chips += pay[s];
  H.result = { entries, winners, won: pay, pot: amt };
  for (const s of winners) logT(T, winners.length > 1 ? "l_win_split" : "l_win", s, pay[s], entries.find(e => e.s === s).tb);
  finishHand(T);
}
function winByFold(T, s) {
  const H = T.H, amt = potTotal(H);
  T.seats[s].chips += amt;
  H.result = { fold: s, won: { [s]: amt }, winners: [s], pot: amt, entries: [] };
  logT(T, "l_win_fold", s, amt);
  finishHand(T);
}
function finishHand(T) {
  const H = T.H;
  H.phase = "done"; H.toAct = -1;
  const busted = H.live.filter(s => T.seats[s].chips <= 0);
  const remaining = liveSeats(T).length;
  // cùng hết chip trong một ván thì cùng hạng
  for (const s of busted) { T.seats[s].out = true; T.seats[s].place = remaining - busted.length + 1; logT(T, "l_out", s, T.seats[s].place); }
  const live = liveSeats(T);
  if (live.length <= 1) { if (live.length) T.seats[live[0]].place = 1; T.over = { winner: live[0] ?? -1 }; logT(T, "l_champ", live[0]); }
  emit(T, { t: "done" });
}

/* ---------- BOT ----------
   Bot chỉ dùng thông tin nó được thấy: xúc xắc của mình và các viên ngửa của người khác. Viên úp của người khác luôn là
   viên vừa đổ (hoặc của lần đổ đầu) nên bot coi như ngẫu nhiên đều 6 mặt; mức khó còn đọc cách cược: ai đã tố thì
   nhiều khả năng tay mạnh (chia lại viên úp tối đa 8 lần cho khớp).
   Phần kỳ vọng được tính bằng mô phỏng: lăn ngẫu nhiên viên úp của đối thủ, cho mọi người đổ nốt các lần còn lại theo
   cách giữ đơn giản (greedyMask), rồi so tay. */
const BOT = {
  easy: { sims: 40, msims: 0, err: .3, noise: .12, bluff: .02, aggr: .45, loose: .7 },
  medium: { sims: 160, msims: 40, err: 0, noise: .04, bluff: .05, aggr: .8, loose: .9 },
  hard: { sims: 320, msims: 120, err: 0, noise: .015, bluff: .07, aggr: 1, loose: .85, read: true },
};
function botLevel(T, s) { return BOT[T.seats[s].level] || BOT.easy; }
// cách giữ đơn giản: giữ phần đã thành bộ, đổ lại phần lẻ (Tứ quý thì đổ viên lẻ để thử Ngũ quý; Mậu thầu thì giữ 4 viên liền để chờ Sảnh)
function greedyMask(d) {
  const ev = evalDice(d), cnt = [0, 0, 0, 0, 0, 0];
  for (const f of d) cnt[f]++;
  if (ev.cat === 7 || ev.cat === 5 || ev.cat === 4) return 0;
  let m = 0;
  if (ev.cat === 0) { d.forEach((f, i) => { if (f === 0) m |= 1 << i; }); return m; }
  const keepMin = ev.cat === 2 ? 2 : ev.cat === 1 ? 2 : 3;   // Thú giữ hai đôi; Đôi giữ đôi; Sám/Tứ quý giữ bộ
  d.forEach((f, i) => { if (cnt[f] < keepMin) m |= 1 << i; });
  return m;
}
// độ hợp lý (0..1) của tay d với số lần đối thủ đã tố trong ván
function plausible(d, aggr) {
  const c = evalDice(d).cat, w = c >= 4 ? 1 : c === 3 ? .75 : c === 2 ? .5 : c === 1 ? .25 : .1;
  return Math.pow(w, Math.min(2, aggr));
}
/* Mô phỏng phần pot kỳ vọng của bot s. myMask: null = mình đổ nốt theo cách đơn giản; số = lần đổ lại đang tới lượt mình
   dùng đúng mặt nạ đó, các lần sau theo cách đơn giản. */
function simulate(T, s, sims, rng, myMask = null) {
  const H = T.H, ins = H.live.filter(x => inHand(H, x)), P = botLevel(T, s);
  const r6 = () => Math.floor(rng() * 6);
  let acc = 0;
  for (let k = 0; k < sims; k++) {
    const ents = [];
    for (const x of ins) {
      let d, left = REROLLS - H.rer[x];
      if (x === s) {
        d = H.dice[s].slice();
        if (myMask != null) { for (let i = 0; i < NDICE; i++) if (myMask >> i & 1) d[i] = r6(); left--; }
      } else {
        d = H.dice[x].map((f, i) => H.up[x][i] ? f : r6());
        if (P.read && H.aggr[x]) for (let t = 0; t < 8 && rng() > plausible(d, H.aggr[x]); t++) d = H.dice[x].map((f, i) => H.up[x][i] ? f : r6());
      }
      for (; left > 0; left--) { const m = greedyMask(d); for (let i = 0; i < NDICE; i++) if (m >> i & 1) d[i] = r6(); }
      ents.push({ s: x, score: evalDice(d).score });
    }
    const w = bestOf(ents);
    if (w.includes(s)) acc += 1 / w.length;
  }
  return acc / Math.max(1, sims);
}
// chọn viên đổ lại. Máy dễ: cách giữ đơn giản, đôi khi giữ/đổ nhầm 1 viên. Máy vừa/khó: thử mọi cách giữ khác nhau
// (bỏ các cách trùng mặt giữ), mỗi cách mô phỏng msims lần với cùng chuỗi số ngẫu nhiên để so cho công bằng.
function botReroll(T, s, rng = Math.random) {
  const sc = T.script && T.script[s];
  if (sc && sc.length && sc[0].re) return sc.shift().re.reduce((m, i) => m | 1 << i, 0);
  const H = T.H, P = botLevel(T, s), d = H.dice[s];
  if (!P.msims) {
    let m = greedyMask(d);
    if (rng() < P.err) m ^= 1 << Math.floor(rng() * NDICE);
    return m;
  }
  const seen = new Set(), seed = Math.floor(rng() * 2 ** 31);
  let best = 0, bestV = -1;
  for (let m = 0; m < 1 << NDICE; m++) {
    const key = d.filter((f, i) => !(m >> i & 1)).sort().join();
    if (seen.has(key)) continue;
    seen.add(key);
    const v = simulate(T, s, P.msims, mulberry32(seed), m) - popcount(m) * 1e-4;   // bằng nhau thì đổ ít viên hơn (lộ nhiều hơn nhưng giữ chắc)
    if (v > bestV) { bestV = v; best = m; }
  }
  return best;
}
function botAction(T, s, rng = Math.random) {
  const sc = T.script && T.script[s];
  if (sc && sc.length && sc[0].type) return sc.shift();
  const H = T.H, L = legalActions(T, s);
  if (!L) return null;
  const P = botLevel(T, s);
  const nIn = H.live.filter(x => inHand(H, x)).length;
  let e = simulate(T, s, P.sims, rng) + (rng() * 2 - 1) * P.noise;
  e = Math.max(0, Math.min(1, e));

  const raiseTo = frac => { if (!L.raise) return null; const to = Math.max(L.raise.min, Math.min(L.raise.max, L.curBet + Math.max(1, Math.round((pot + L.toCall) * frac)))); return { type: "raise", to }; };
  if (L.toCall === 0) {
    if (L.raise && r > 1.35 && rng() < P.aggr * (H.raises ? .5 : 1)) return raiseTo(e > .75 ? .9 : .5);
    if (L.raise && nIn <= 3 && rng() < P.bluff) return raiseTo(.5);
    return { type: "check" };
  }
  const odds = L.toCall / (pot + L.toCall), need = odds / P.loose;
  if (e < need && !(L.toCall <= 1 && e > need * .6)) return { type: "fold" };
  if (L.raise && H.raises < 3 && r > 1.7 && e > .45 && rng() < P.aggr * .7) return raiseTo(.75);
  if (L.raise && H.raises < 2 && nIn <= 3 && rng() < P.bluff * .5 && e > need) return raiseTo(.6);
  return { type: "call" };
}
/* RULES-AI-END */

/* ============================================================
   TRẠNG THÁI CHUNG
   ============================================================ */
const PREFS_KEY = "pokerdice.prefs";
const PREFS = { name: "", bots: 2, level: "easy", levels: null, vs: "bot", net: "create", botLv: "easy", tutSeen: false, id: "" };
try { Object.assign(PREFS, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch (e) {}
if (!PREFS.id) PREFS.id = Math.random().toString(36).slice(2, 12);
const LEVELS = ["easy", "medium", "hard"];
// mức của từng máy khi đấu máy (máy 1 ngồi ngay bên trái mình, rồi theo chiều kim đồng hồ), mặc định 1 sao
if (!Array.isArray(PREFS.levels)) PREFS.levels = [];
for (let i = 0; i < 4; i++) if (!LEVELS.includes(PREFS.levels[i])) PREFS.levels[i] = "easy";
if (!LEVELS.includes(PREFS.botLv)) PREFS.botLv = "easy";
const savePrefs = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) {} };
savePrefs();
const BOT_NAMES = ["Euclid", "Hypatia", "Gauss", "Euler", "Noether", "Ramanujan", "Fermat", "Turing", "Lovelace", "Archimedes", "Lương Thế Vinh", "Khwarizmi", "Descartes", "Kovalevskaya"];
const SEAT_COLORS = ["#ef7a2e", "#4a6fd8", "#2ea65a", "#d6457a", "#8e5bd8"];
const cleanName = s => String(s || "").replace(/[<>&"'`]/g, "").replace(/\s+/g, " ").trim().slice(0, 12);   // tên tối đa 12 ký tự (mọi game có đặt tên)
const myName = () => cleanName(PREFS.name) || tr("def_name");

let MODE = null;   // {kind: "bot" | "online" | "tutorial", level}
let T = null;      // bàn chơi: chỉ có ở máy giữ luật (đấu máy, hướng dẫn, chủ phòng online)
let V = null;      // góc nhìn của ghế mình (máy giữ luật tự tạo, khách nhận qua mạng)
let ME = 0;        // ghế của mình
const isHost = () => !!T;

/* Góc nhìn của một ghế: chỉ chứa những gì ghế đó được thấy.
   Viên úp của người khác là -1 cho tới lúc lật xúc xắc (bỏ bài thì không lật). Xúc xắc của mình luôn thấy đủ, kèm cờ ngửa/úp.
   rc (số lần mỗi viên đã được đổ) gửi cho mọi người để vẽ hiệu ứng lăn đúng viên. */
function viewFor(me) {
  const H = T.H, done = !!(H && H.phase === "done");
  const seats = T.seats.map((p, i) => {
    const o = { name: p.name, kind: p.kind, level: p.level, away: !!p.away, chips: p.chips, out: p.out, place: p.place };
    if (H && H.live.includes(i)) {
      const all = i === me || (done && H.result && H.result.fold == null && inHand(H, i));
      const ev = all ? evalDice(H.dice[i]) : null;
      Object.assign(o, {
        live: true, fold: !!H.folded[i], bet: H.bet[i], contrib: H.contrib[i],
        dice: H.dice[i].map((f, k) => all || H.up[i][k] ? f : -1), up: H.up[i].slice(), rc: H.rc[i].slice(), rer: H.rer[i],
        last: H.last[i] || null, cat: ev ? ev.cat : null, tb: ev ? ev.tb : null,
      });
    }
    return o;
  });
  return {
    me, handNo: T.handNo, mode: MODE.kind, code: NET.code, level: MODE.level, seq: HOST.seq,
    phase: H ? H.phase : "idle", street: H ? H.street : 0, reN: H ? H.reN : 0, toAct: H ? H.toAct : -1, curBet: H ? H.curBet : 0, pot: H ? potTotal(H) : 0,
    first: H ? H.first : -1, ante: H ? H.ante : anteAt(1), cap: H ? H.cap : START_CHIPS, nextAnte: anteAt(T.handNo + 1),
    seats, legal: H ? legalActions(T, me) : null,
    result: done ? H.result : null, log: T.log.slice(-90), over: T.over,
    left: HOST.deadline ? Math.max(0, HOST.deadline - performance.now()) : 0, timerSeats: HOST.timerSeats.slice(), timerKind: HOST.dlKey.charAt(0),
  };
}

/* ============================================================
   CHỦ BÀN: chạy luật, bot, đồng hồ (đấu máy, hướng dẫn, chủ phòng online)
   ============================================================ */
const HOST = { deadline: 0, dlKey: "", timerSeats: [], jobs: new Map(), watch: false, seq: 0 };
const TIMES = { r: 30, b: 30, n: 12 };   // giây: lượt đổ lại, lượt cược, chờ ván tiếp (online)
const botSeat = s => T.seats[s].kind === "bot" || T.seats[s].away;
function job(key, ms, fn) { if (HOST.jobs.has(key)) return; HOST.jobs.set(key, setTimeout(() => { HOST.jobs.delete(key); fn(); }, ms)); }
function clearJobs() { for (const t of HOST.jobs.values()) clearTimeout(t); HOST.jobs.clear(); }
const botDelay = () => MODE.kind === "tutorial" ? 1100 : 650 + Math.random() * 750;
function hostUpdate() {
  if (!T) return;
  HOST.seq++;
  setDeadline();
  V = viewFor(ME);
  render();          // vẽ trước để lên lịch xúc xắc lăn (ROLLS), máy chờ xúc xắc dừng mới đi
  scheduleBots();
  if (MODE.kind === "online") broadcast();
}
function scheduleBots() {
  const H = T.H;
  if (!H || TUT.on && TUT.hold) return;
  const k = `${T.handNo}:${H.street}:${H.phase}:${H.reN}`, cur = H;
  if (H.phase === "re" && H.toAct >= 0 && botSeat(H.toAct)) {
    const s = H.toAct;
    job(`${k}:r:${s}`, botDelay() + rollWait(), () => {
      if (!T || T.H !== cur || cur.phase !== "re" || cur.toAct !== s) return;
      reroll(T, s, botReroll(T, s));
      hostUpdate();
    });
  }
  if (H.phase === "bet" && H.toAct >= 0 && botSeat(H.toAct)) {
    const s = H.toAct;
    job(`${k}:a:${s}:${H.raises}:${potTotal(H)}`, botDelay() + rollWait(), () => {
      if (!T || T.H !== cur || cur.phase !== "bet" || cur.toAct !== s) return;
      const a = botAction(T, s);
      if (!act(T, s, a)) act(T, s, legalActions(T, s).check ? { type: "check" } : { type: "fold" });
      hostUpdate();
    });
  }
  if (H.phase === "done" && !T.over && MODE.kind === "bot" && HOST.watch) job(`${k}:watch`, 2500, nextHand);
}
function setDeadline() {
  const H = T.H;
  let key = "", seats = [], extra = 0;
  if (MODE.kind === "online" && H && !T.over) {
    if (H.phase === "re" && H.toAct >= 0 && !botSeat(H.toAct)) {
      key = `r:${T.handNo}:${H.reN}:${H.toAct}`; seats = [H.toAct];
      // lượt đổ lại đầu tiên của ván: cộng thời gian chuyển chip, ante và lần đổ đầu; các lượt sau: cộng lúc xúc xắc người trước lăn
      extra = H.reN === 1 && H.live.every(s => !H.rer[s]) ? introMs(H.live.length, T.handNo > 1) + rollIntroMs(H.live.length) : ROLL_DUR + 150;
    }
    else if (H.phase === "bet" && H.toAct >= 0 && !botSeat(H.toAct)) { key = `b:${T.handNo}:${H.street}:${H.toAct}:${H.raises}:${potTotal(H)}`; seats = [H.toAct]; extra = ROLL_DUR + 150; }
    else if (H.phase === "done") key = `n:${T.handNo}`;
  }
  if (key !== HOST.dlKey) { HOST.dlKey = key; HOST.deadline = key ? performance.now() + TIMES[key.charAt(0)] * 1000 + extra : 0; }
  HOST.timerSeats = seats;
}
// hết giờ (online): máy đi thay lượt đó (ghế người mang mức "medium" cho việc này)
function hostTick() {
  if (!T || !HOST.deadline || performance.now() < HOST.deadline) return;
  const H = T.H;
  HOST.deadline = 0;
  if (!H) return;
  if (H.phase === "done") return nextHand();
  const s = H.toAct;
  if (H.phase === "re" && s >= 0) reroll(T, s, botReroll(T, s));
  else if (H.phase === "bet" && s >= 0 && !act(T, s, botAction(T, s))) { const L = legalActions(T, s); if (L) act(T, s, L.check ? { type: "check" } : { type: "fold" }); }
  hostUpdate();
}
setInterval(hostTick, 250);
function nextHand() {
  if (!T || T.over || !T.H || T.H.phase !== "done") return;
  clearJobs();
  startHand(T);
  hostUpdate();
}
function leaveAll() {
  clearJobs();
  tutStop();

  if (!isFinite(l)) return null;
  const p = 7;
  return { left: Math.round(l - p), top: Math.round(tp - p), right: Math.round(rr + p), bottom: Math.round(b + p), width: Math.round(rr - l + 2 * p), height: Math.round(b - tp + 2 * p) };
}
function tutPos() {
  const st = TUT_STEPS[TUT.i];
  if (!TUT.on || !st || !st._ready) return;
  const blk = $("#tutBlock"), ring = $("#tutRing"), box = $("#tutBox"), W = innerWidth, H = innerHeight;
  const r = st.wait ? null : tutRect(st);
  if (r) {
    blk.style.clipPath = `path(evenodd, "M0 0H${W}V${H}H0Z M${r.left} ${r.top}H${r.right}V${r.bottom}H${r.left}Z")`;
    ring.hidden = false;
    Object.assign(ring.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  } else { blk.style.clipPath = ""; ring.hidden = true; }
  const bw = box.offsetWidth, bh = box.offsetHeight;
  let x, y;
  if (r) {
    x = r.left + r.width / 2 - bw / 2;
    const below = H - r.bottom, above = r.top;
    if (below >= bh + 14) y = r.bottom + 12;
    else if (above >= bh + 14) y = r.top - bh - 12;
    else y = below > above ? H - bh - 8 : 8;
  } else { x = (W - bw) / 2; y = st.wait ? H - bh - 16 : (H - bh) / 2; }
  box.style.left = Math.round(Math.max(8, Math.min(W - bw - 8, x))) + "px";
  box.style.top = Math.round(Math.max(8, Math.min(H - bh - 8, y))) + "px";
}

/* ============================================================
   BẢNG CHỌN CHẾ ĐỘ, PHÒNG CHỜ, CHỮ
   ============================================================ */
function syncModeUI() {
  $$("#segVs button").forEach(b => b.classList.toggle("on", b.dataset.v === PREFS.vs));
  $$("#segBots button").forEach(b => b.classList.toggle("on", +b.dataset.v === PREFS.bots));
  const lv = PREFS.levels.slice(0, PREFS.bots);
  $("#botLevels").innerHTML = lv.map((l, i) => `<div class="lvrow"><span>${tr("m_bot_n", i + 1)}</span><div class="seg small">${LEVELS.map(x => `<button data-i="${i}" data-v="${x}" class="${x === l ? "on" : ""}">${tr("lv_" + x)}</button>`).join("")}</div></div>`).join("");
  $$("#segNet button").forEach(b => b.classList.toggle("on", b.dataset.v === PREFS.net));
  $("#botOpts").hidden = PREFS.vs !== "bot";
  $("#netOpts").hidden = PREFS.vs !== "online";
  $("#joinCode").hidden = PREFS.net !== "join";
  $("#levelNote").textContent = tr("lvn_" + PREFS.level);
}
function openMode() { $("#myName").value = cleanName(PREFS.name); syncModeUI(); $("#mMode").hidden = false; }
function modeStart() {
  PREFS.name = cleanName($("#myName").value); savePrefs();
  if (PREFS.vs === "bot") { $("#mMode").hidden = true; startBotGame(); return; }
  if (PREFS.net === "create") { $("#mMode").hidden = true; startHost(); return; }
  const code = normCode($("#joinCode").value);
  if (code.length !== CODE_LEN) { $("#joinCode").focus(); $("#joinCode").placeholder = tr("n_err_code"); return; }
  $("#mMode").hidden = true; startGuest(code);
}
function renderLobby(L) {
  $("#lobbyTitle").textContent = L.host ? tr("n_title_host") : tr("n_title_guest", L.code || NET.code);
  // đang tạo mã phòng thì vẫn giữ chỗ (mã tạm "·····") để khung không giãn ra khi mã về
  $("#lobbyCode").hidden = !L.code && !L.host;
  if (!L.code) { $("#netCode").textContent = "·····"; $("#netLink").value = ""; }
  $("#netCopy").disabled = !L.code;
  if (L.code) { $("#netCode").textContent = L.code; $("#netLink").value = inviteLink(L.code); }
  const seats = L.seats || [];
  let h = seats.map((s, i) => `<li>${avHTML(i, s.name, s.kind === "bot", s.kind === "bot" ? s.level || "easy" : null)}<b>${escH(s.name)}${i === L.you ? tr("n_you") : ""}</b>
    ${s.kind === "bot" && L.host ? `<button class="lv" data-lv="${i}" title="${tr("n_lv_tip")}">${tr("n_bot", tr("lv_" + (s.level || "easy")))}</button>` : `<small>${i === 0 ? tr("n_host") : s.kind === "bot" ? tr("n_bot", tr("lv_" + (s.level || "easy"))) : tr("n_human")}</small>`}${L.host && i > 0 ? `<button data-rm="${i}" aria-label="x">×</button>` : ""}</li>`).join("");
  for (let i = seats.length; i < MAX_SEATS; i++) h += `<li class="empty">${tr("n_empty")}</li>`;
  $("#lobbySeats").innerHTML = h;
  // đủ ghế thì vẫn giữ hàng thêm máy (làm mờ) để khung phòng chờ không co giãn
  $("#lobbyBot").hidden = !L.host;
  const full = seats.length >= MAX_SEATS;
  $("#addBot").disabled = full; $$("#segBotLv button").forEach(b => { b.disabled = full; });
  $$("#segBotLv button").forEach(b => b.classList.toggle("on", b.dataset.v === PREFS.botLv));
  $("#lobbyStart").hidden = !L.host;
  $("#lobbyStart").disabled = seats.length < 2;
  $("#lobbyStart").textContent = tr("n_start", seats.length);
  $("#lobbyMsg").textContent = L.host ? (L.code ? tr("n_wait_host") : tr("n_connecting")) : tr("n_wait_guest");
}
function applyLang() {
  document.documentElement.lang = LANG; document.title = tr("title") + " · Twistboard";
  $$("[data-i18n]").forEach(e => { e.innerHTML = tr(e.dataset.i18n); });
  $("#joinCode").placeholder = tr("m_code_ph"); $("#myName").placeholder = tr("def_name");
  $("#levelNote").textContent = tr("lvn_" + PREFS.level);
  $("#ruleDice").innerHTML = [0, 1, 2, 3, 4, 5].map(f => dieHTML(f)).join("");
  const EX = [[7, "A A A A A"], [6, "K K K K 9"], [5, "Q Q Q 10 10"], [4, "10 J Q K A"], [3, "J J J A 9"], [2, "A A 9 9 K"], [1, "10 10 A K Q"], [0, "A K Q J 9"]];
  $("#ruleRank").innerHTML = EX.map(([c, s]) => `<div class="rr"><b>${tr("cat_" + c)}</b><span class="rd">${s.split(" ").map(x => dieHTML(FACES.indexOf(x))).join("")}</span></div>`).join("");
  for (const el of [$("#mine"), $("#mHand"), $("#mCtl"), $("#log"), $("#tutBox")]) if (el) el._sig = null;
  if (NET.role) showLobbyIfOpen();
  render();
}
function showLobbyIfOpen() { if (!$("#mLobby").hidden) showLobby(); }
function setLang(l) {
  if (l !== "vi" && l !== "en" || l === LANG && document.documentElement.lang === l) return;
  LANG = l; try { localStorage.setItem("lang", l); } catch (e) {}
  applyLang();
  if (window.TB) TB.setLang(l);
}
if (window.TB) TB.onLang(l => setLang(l));

function fit() {
  PORTRAIT = innerWidth < 700;
  document.body.classList.toggle("portrait", PORTRAIT);
  const w = Math.max(290, Math.floor($("#play").clientWidth));
  let h = PORTRAIT ? Math.round(Math.max(440, Math.min(560, w * 1.2))) : Math.round(Math.max(340, Math.min(470, w * .52)));
  if (!PORTRAIT) {
    // máy tính: bàn thấp xuống cho vừa màn hình, để khung bài của mình không phải cuộn xuống mới thấy.
    // Giữ bàn một cỡ suốt vòng: luôn chừa chỗ cho khung bài cao nhất trong vòng (lúc mở hộp tố), không bóp bàn khi đổi giai đoạn.
    // Bảng kết quả cuối vòng cao hơn thì để ensureMine tự cuộn. Màn quá thấp thì tính như đã cuộn mép trên bàn lên sát thanh đầu trang.
    const reserve = innerHeight < 800 ? MINE_RESERVE[1] : MINE_RESERVE[0], mineNow = $("#mine").offsetHeight;
    const tTop = $("#table").getBoundingClientRect().top + scrollY, mine = Math.max(reserve, V && V.phase !== "done" ? mineNow : 0);
    const room = top => innerHeight - top - mine - 12 - 14, full = room(tTop);
    h = Math.round(Math.max(300, Math.min(h, full >= 300 ? full : room(headH() + 8))));
  }
  const old = getComputedStyle(document.documentElement).getPropertyValue("--th").trim();
  document.documentElement.style.setProperty("--tw", w + "px");
  document.documentElement.style.setProperty("--th", h + "px");
  return old !== h + "px";
}
// chiều cao khung bài của mình lúc cao nhất trong vòng (đang tố, có vài lá HIT): màn thường / màn thấp
const MINE_RESERVE = [304, 304];   // đo được: hộp tố mở 300px, lượt đổ lại 256px, lượt cược 202px (bảng kết quả 321px thì tự cuộn)
if (window.ResizeObserver) {
  let lastMine = 0;
  new ResizeObserver(() => {
    const m = $("#mine").offsetHeight;
    if (m === lastMine) return;
    lastMine = m;
    if (fit() && V) { renderTable(); if (TUT.on) tutPos(); }
    ensureMine();
  }).observe($("#mine"));
}
// chiều cao thanh đầu trang của Twistboard (dính trên cùng khi cuộn)
const headH = () => { const e = document.getElementById("tb-header"); return e && getComputedStyle(e).position !== "static" ? e.offsetHeight : 0; };
// cuộn vừa đủ để thấy đáy khung bài của mình, không cuộn mép trên bàn lẩn dưới thanh đầu trang
function ensureMine() {
  if (PORTRAIT || !V || V.phase === "idle" || TUT.on) return;
  const bottom = $("#mine").getBoundingClientRect().bottom, over = bottom + 12 - innerHeight;
  if (over <= 4) { if (scrollY > 0 && bottom + scrollY + 12 <= innerHeight) scrollTo({ top: 0, behavior: "smooth" }); return; }
  const d = Math.min(over, $("#table").getBoundingClientRect().top - headH() - 8);
  if (d > 4) scrollBy({ top: d, behavior: "smooth" });
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
$("#btnNew").onclick = () => openMode();
$("#btnRules").onclick = () => { $("#mRules").hidden = false; };
$("#btnTut").onclick = () => { $("#mRules").hidden = true; startTutorial(); };
$("#rulesOk").onclick = () => { $("#mRules").hidden = true; };
$("#rulesTut").onclick = () => { $("#mRules").hidden = true; startTutorial(); };
$("#segVs").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.vs = b.dataset.v; syncModeUI(); } };
$("#segBots").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.bots = +b.dataset.v; syncModeUI(); } };
$("#botLevels").onclick = e => { const b = e.target.closest("button[data-i]"); if (b) { PREFS.levels[+b.dataset.i] = b.dataset.v; PREFS.level = b.dataset.v; syncModeUI(); } };
$("#segNet").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.net = b.dataset.v; syncModeUI(); if (PREFS.net === "join") $("#joinCode").focus(); } };
$("#joinCode").oninput = e => { e.target.value = normCode(e.target.value); };
$("#joinCode").onkeydown = e => { if (e.key === "Enter") modeStart(); };
$("#myName").onkeydown = e => { if (e.key === "Enter") modeStart(); };
$("#modeStart").onclick = modeStart;
$("#modeCancel").onclick = () => { $("#mMode").hidden = true; };
$("#netCopy").onclick = () => {
  const inp = $("#netLink"), done = () => { $("#netCopy").textContent = tr("n_copied"); setTimeout(() => { $("#netCopy").textContent = tr("n_copy"); }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); document.execCommand("copy"); done(); });
  else { inp.select(); document.execCommand("copy"); done(); }
};
$("#segBotLv").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.botLv = b.dataset.v; savePrefs(); showLobby(); } };
$("#addBot").onclick = () => {
  if (NET.role !== "host" || NET.started || NET.lobby.length >= MAX_SEATS) return;
  const used = new Set(NET.lobby.map(x => x.name)), name = shuffle(BOT_NAMES.filter(n => !used.has(n)), Math.random)[0] || "Bot";
  NET.lobby.push({ id: "bot" + Math.random().toString(36).slice(2, 8), name, kind: "bot", level: PREFS.botLv, conn: null });
  lobbyUpdate();
};
$("#lobbySeats").onclick = e => {
  const lvb = e.target.closest("[data-lv]");
  if (lvb && NET.role === "host" && !NET.started) {   // bấm nhãn mức của máy: 1 → 2 → 3 sao → 1
    const x = NET.lobby[+lvb.dataset.lv];
    if (x && x.kind === "bot") { x.level = LEVELS[(LEVELS.indexOf(x.level || "easy") + 1) % 3]; lobbyUpdate(); }
    return;
  }
  const b = e.target.closest("[data-rm]");
  if (!b || NET.role !== "host" || NET.started) return;
  const i = +b.dataset.rm, x = NET.lobby[i];
  if (!x || i === 0) return;
  if (x.conn) { const c = x.conn; sendTo(c, { t: "err", code: "kicked" }); setTimeout(() => { try { c.close(); } catch (er) {} }, 400); }
  NET.lobby.splice(i, 1);
  lobbyUpdate();
};
$("#lobbyStart").onclick = hostStart;
$("#lobbyLeave").onclick = () => { leaveAll(); render(); openMode(); };
$("#netClose").onclick = () => { $("#mNet").hidden = true; if (!T && !V) openMode(); };
$("#seats").onclick = e => { const s = e.target.closest(".seat"); if (s) openSeat(+s.dataset.s); };
$("#seatOk").onclick = () => { $("#mSeat").hidden = true; };
$("#overClose").onclick = () => { $("#mOver").hidden = true; };
$("#overWatch").onclick = () => { $("#mOver").hidden = true; HOST.watch = true; if (T) hostUpdate(); };
$("#overNew").onclick = () => {
  $("#mOver").hidden = true;
  if (MODE && MODE.kind === "online" && NET.role === "host") hostToLobby();
  else if (MODE && MODE.kind === "bot") startBotGame();
  else openMode();
};
$("#welcomeGo").onclick = () => { PREFS.tutSeen = true; savePrefs(); $("#mWelcome").hidden = true; startTutorial(); };
$("#welcomeSkip").onclick = () => { PREFS.tutSeen = true; savePrefs(); $("#mWelcome").hidden = true; openMode(); };
$("#tutBox").onclick = e => {
  const b = e.target.closest("[data-tut]");
  if (!b) return;
  const a = b.dataset.tut;
  if (a === "next") tutNext();
  else if (a === "skip") { leaveAll(); render(); openMode(); }
  else if (a === "play") { tutStop(); PREFS.vs = "bot"; openMode(); }
  else if (a === "rules") { tutStop(); $("#mRules").hidden = false; }
};
const mine = $("#mine");
mine.addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]");
  if (pk && V && V.phase === "re" && V.toAct === ME) {   // bấm viên xúc xắc: bật/tắt đổ lại (hướng dẫn thì đã chọn sẵn, không đổi được)
    if (!TUT.on) { SELM.mask ^= 1 << +pk.dataset.pick; sfx("tick"); renderMine(); }
    return;
  }
  const t = e.target.closest("button");
  if (!t || !V) return;
  const L = V.legal;
  if (t.id === "bFold") doAct({ type: "fold" });
  else if (t.id === "bCall" && L) doAct(L.check ? { type: "check" } : { type: "call" });
  else if (t.id === "bRaise" && L && L.raise) { RAISE.open = true; RAISE.val = L.raise.min; renderActions($("#mCtl")); }
  else if (t.id === "rBack") { RAISE.open = false; renderActions($("#mCtl")); }
  else if (t.id === "rGo" && L && L.raise) doAct({ type: "raise", to: RAISE.val });
  else if (t.dataset.rv) setRaise(t.dataset.rv);
  else if (t.id === "bRoll") doReroll(SELM.mask);
  else if (t.id === "bNext") { if (isHost()) nextHand(); }
});
mine.addEventListener("input", e => { if (e.target.id === "rRange" || e.target.id === "rNum") setRaise(e.target.value); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  for (const id of ["#mSeat", "#mRules", "#mMode"]) if (!$(id).hidden) { $(id).hidden = true; return; }
});
let fitT = 0;
window.addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(() => { fit(); render(); if (TUT.on) tutPos(); }, 80); });
window.addEventListener("scroll", () => { if (TUT.on) tutPos(); }, { passive: true });
setInterval(() => { if (TUT.on) tutPos(); }, 400);
window.addEventListener("beforeunload", () => { if (NET.role) netClose(true); });

window.game = {
  get T() { return T; }, get V() { return V; }, get MODE() { return MODE; }, NET, HOST, TUT,
  doAct, doReroll, nextHand, evalDice, botReroll, SELM, startBotGame, startTutorial, viewFor,
};

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  if (window.TB && TB.closeX) TB.closeX({ "#mRules": "#rulesOk", "#mMode": "#modeCancel", "#mLobby": "#lobbyLeave", "#mNet": "#netClose", "#mSeat": "#seatOk", "#mOver": "#overClose", "#mWelcome": "#welcomeSkip" });   // nút × góc trên phải mỗi popup
  $("#welcomeOwl").innerHTML = OWL.replace('class="owl"', 'style="width:96px;height:110px"');
  applyLang();
  fit();
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {
    if (PREFS.name) startGuest(room);
    else { PREFS.vs = "online"; PREFS.net = "join"; openMode(); $("#joinCode").value = room; $("#myName").focus(); }
  } else if (!PREFS.tutSeen) $("#mWelcome").hidden = false;
  else openMode();
  render();
})();
</script>
</body>
</html>
