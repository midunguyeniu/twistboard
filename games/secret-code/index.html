<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">

<style>
/* lá bài theo kiểu lá trong show (chủ game gửi ảnh mẫu 11/2026): nền pastel, viền trắng ngà, khung trong góc lõm, chữ - số - hình đen xếp dọc */
.scc-gray{--cc:#d3d5d3}.scc-yellow{--cc:#e3db7e}.scc-blue{--cc:#8fd6df}.scc-green{--cc:#b9dc8c}.scc-purple{--cc:#a990d3}
.sc{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.sc-card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .06);background:var(--cc);color:#1b1b1b;padding:0;flex:none;
  border:calc(var(--cw) * .055) solid #eef0ea;box-shadow:0 0 0 1px #7d8582,0 3px 6px rgba(0,0,0,.35);cursor:pointer;
  font-family:Georgia,"Times New Roman",serif;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .07);
  transition:transform .12s ease-out,opacity .15s,box-shadow .15s,filter .15s}
.sc-card .fr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sc-card .fr path{fill:none;stroke:rgba(30,30,30,.55);stroke-width:1;vector-effect:non-scaling-stroke}
.sc-card .fr circle{fill:rgba(30,30,30,.5)}
.sc-card .l{font-size:calc(var(--cw) * .27);font-weight:600}
.sc-card .n{font-size:calc(var(--cw) * .26);font-variant-numeric:tabular-nums}
.sc-card .s{width:calc(var(--cw) * .2);height:calc(var(--cw) * .2);display:block;overflow:visible}
.sc-card .s *{fill:#151515}
.sc-card:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
.sc-card:disabled{cursor:default}
.sc-board{background:radial-gradient(ellipse at 30% 20%,#3e4446 0,transparent 60%),radial-gradient(ellipse at 80% 90%,#30353a 0,transparent 55%),#262a2c;
  border-radius:14px;padding:var(--pad,14px);box-shadow:inset 0 0 30px rgba(0,0,0,.45);max-width:100%}
.sc-grid{display:grid;grid-template-columns:repeat(6,var(--cw));gap:var(--gap);justify-content:center}   /* 6 cột × 5 hàng như bảng trong show */
.sc-grid .sc-card[data-i="24"]{grid-column:5}
/* máy tính: bảng bên trái, hàng mật mã (4 ô 2×2 + nút) bên phải; màn hẹp: hàng mật mã dưới bảng */
.sc-main{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
.sc.wide .sc-code{flex-direction:column;align-items:stretch}
.sc.wide .sc-slots{display:grid;grid-template-columns:repeat(2,var(--cw));justify-content:center}
.sc.wide .sc-btns{min-width:0}
.sc:not(.wide) .sc-btns{flex-direction:row}
.sc-grid .sc-card.on{opacity:.2;transform:scale(.92)}
.sc-grid .sc-card.on::after{content:"";position:absolute;inset:calc(var(--cw) * -.1);border:2px dashed rgba(255,255,255,.75);border-radius:6px}
.sc-grid.reveal .sc-card{opacity:.3}
.sc-grid.reveal .sc-card.ans{opacity:1;transform:none;box-shadow:0 0 0 1px #7d8582,0 0 0 4px #ffc928,0 0 14px rgba(255,201,40,.6)}
.sc-grid.reveal .sc-card.ans::after{display:none}
/* hàng mật mã */
.sc-code{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.sc-slots{display:flex;gap:var(--gap);padding:8px;border-radius:14px;background:var(--tb-surface-2);border:1.5px solid var(--tb-border)}
.sc-slot{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .08);border:2px dashed var(--tb-border-strong);display:grid;place-items:center;
  color:var(--tb-faint);font-weight:800;font-size:calc(var(--cw) * .28);flex:none}
.sc-slots.bad{border-color:var(--tb-red);animation:pkshake .4s}
.sc-slots.good{border-color:var(--tb-green);background:#e7f7ec}
.sc-btns{display:flex;flex-direction:column;gap:8px;min-width:120px}
.sc-btns .btn{font-size:15px;padding:10px 16px}
.sc-msg{min-height:1.4em;font-size:14px;font-weight:800;color:var(--tb-muted);text-align:center}
.sc-msg.bad{color:var(--tb-red)}.sc-msg.good{color:var(--tb-green)}
/* gợi ý */
.sc-clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;width:100%;counter-reset:cl}
.sc-clues li{display:flex;gap:9px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.38;color:var(--tb-text);counter-increment:cl}
.sc-clues li::before{content:counter(cl);flex:none;width:22px;height:22px;border-radius:50%;background:#1d2330;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;margin-top:1px}
.sc-clues li.ok::before{content:"✓";background:var(--tb-green)}
.sc-clues b{font-variant-numeric:tabular-nums}
.pk-prompt .sc-clues{margin-top:8px}
.sc .sc-clues{max-width:560px}
@media (min-width:781px){.sc .sc-clues{display:none}}
@media (max-width:780px){.pk-prompt .sc-clues{display:none}}
/* số lá từng màu / hình (mức ★) */
.sc-counts{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;font-weight:800;color:var(--tb-muted)}
.sc-counts span{display:inline-flex;align-items:center;gap:5px}
.sc-counts i{width:15px;height:15px;border-radius:4px;background:var(--cc);display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sc-counts svg{width:calc(var(--cw) * .2);height:calc(var(--cw) * .2);overflow:visible}   /* đúng cỡ hình trên lá (.sc-card .s) */
.sc-left{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}   /* thanh đếm canh giữa theo bảng lá */
/* kéo thả lá vào / ra hàng mật mã */
.sc-main .sc-card{touch-action:none}
.sc-card.dragging{opacity:.3}
.sc-ghost{position:fixed;z-index:90;margin:0;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 0 0 1px #7d8582,0 12px 26px rgba(0,0,0,.45);transition:none}
.sc-slots.drop{border-color:#ffc928;box-shadow:0 0 0 3px rgba(255,201,40,.45)}
.sc-board.drop{box-shadow:inset 0 0 30px rgba(0,0,0,.45),0 0 0 3px rgba(255,201,40,.55)}
.sc-counts svg *{fill:#1d2330}
.sc-counts b{color:var(--tb-text);font-size:15px}
.sc-counts .sep{width:1px;height:16px;background:var(--tb-border-strong)}
/* nút mức: ★ vàng, ★★ xanh dương, ★★★ đỏ (như Poker Trí Nhớ, Poker Phép Tính, Wall Go) */
#pkSegLevel button[data-v="easy"]{border-color:#ffd24a;background:rgba(255,210,74,.2)}
#pkSegLevel button[data-v="normal"]{border-color:#3d8bff;background:rgba(61,139,255,.16)}
#pkSegLevel button[data-v="hard"]{border-color:#e5453b;background:rgba(229,69,59,.16)}
#pkSegLevel button:hover:not(.on):not(:disabled){filter:brightness(1.06)}
#pkSegLevel button.on[data-v="easy"]{background:#ffd24a;border-color:#ffd24a;color:#3a2a00}
#pkSegLevel button.on[data-v="normal"]{background:#3d8bff;border-color:#3d8bff;color:#fff}
#pkSegLevel button.on[data-v="hard"]{background:#e5453b;border-color:#e5453b;color:#fff}
#pkSegLevel button{white-space:nowrap;min-width:0;padding:10px 6px;font-size:15px}
#pkSegLevel button[data-v="random"]{flex:1.3 1 0}
@media (max-width:560px){#pkSegLevel{flex-wrap:wrap}#pkSegLevel button{flex:1 1 40%}#pkSegLevel button[data-v="random"]{flex:1 1 100%}}
/* hình nhỏ trong thẻ Luật chơi */
.scr{display:flex;gap:6px;align-items:flex-end;justify-content:center;--cw:34px}
.scr .sc-card{cursor:default}
.pk-rc-fig .scr-cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:190px}
.pk-rc-fig .scr-cl li{background:#fff;border-radius:8px;padding:4px 8px;box-shadow:0 1px 3px rgba(20,30,60,.12);font-size:12px;font-weight:800;color:#1d2330;line-height:1.3;margin:0}
.scr-row{display:flex;gap:5px;padding:6px;border-radius:10px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);--cw:32px}
.scr-go{background:var(--tb-primary);color:var(--tb-primary-ink);border-radius:8px;padding:4px 12px;font-weight:900;font-size:13px}
@media (max-width:560px){.scr{--cw:28px}.scr-row{--cw:26px}}
</style>

<body>
<div id="tb-header"></div>
<script>TB.mountHeader({ page: "game", gameId: "secret-code" });</script>
<script>
"use strict";

/* RULES-START: luật + sinh đề Mật mã, không đụng DOM (cắt ra chạy bằng Node được).
   Cách sinh bộ bài và ra đề chép theo bản web quoridorgame.com/en/secret-code (chủ game chọn chép, 11/2026). */
const SC_COLORS = ["gray", "yellow", "blue", "green", "purple"];   // vị trí giữ như bản gốc (red ở đầu), chỉ đổi tên màu hiển thị
const SC_SHAPES = ["circle", "triangle", "diamond", "square", "star"];
const SC_AMOUNTS = [8, 6, 5, 4, 3];   // số lá của 5 màu (và 5 hình), gán ngẫu nhiên mỗi đề
const SC_KINDS = ["sum", "colorKinds", "shapeKinds", "diff", "pairSum", "product", "range", "ends", "rank"];
const SC_PAIRS = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];   // cặp lá theo thứ tự số: 0 nhỏ nhất ... 3 lớn nhất
const SC_HARD = ["diff", "range", "product", "ends", "rank"];
const scCmp = (c, a, b) => c === "eq" ? a === b : c === "le" ? a <= b : a >= b;
const scLead = c => c.kind === "sum" ? 3 : 2 * (c.kind === "colorKinds" || c.kind === "shapeKinds");
const scIsHard = c => SC_HARD.includes(c.kind);
const SC_LEVELS = {
  easy: { min: 6, max: 7, hardAtLeast: 0, needSum: true,
    allow: c => c.kind === "sum" ? c.cmp === "eq" : c.kind === "rank" ? c.pos === 0 || c.pos === 3 : c.kind !== "product" && c.kind !== "ends",
    lead: c => scLead(c) || +(c.kind === "rank") },
  normal: { min: 5, max: 6, hardAtLeast: 1, needSum: true, allow: c => c.kind !== "sum" || c.cmp !== "ge", lead: scLead,
    boostOne: [[["rank"], 1], [["pairSum", "range"], .5]] },
  hard: { min: 4, max: 6, hardAtLeast: 3, needSum: false, allow: c => c.kind !== "sum" || c.cmp !== "eq", lead: () => 0 },
};

/* số ngẫu nhiên có seed từ chuỗi (mã hôm nay) */
function scHash(s) {
  let t = 0x6a09e667 ^ s.length;
  for (let i = 0; i < s.length; i++) { t = Math.imul(t ^ s.charCodeAt(i), 0xcc9e2d51); t = t << 13 | t >>> 19; }
  t = Math.imul(t ^ t >>> 16, 0x85ebca6b); t = Math.imul(t ^ t >>> 13, 0xc2b2ae35);
  return (t ^ t >>> 16) >>> 0;
}
function scRng(seed) {
  let n = seed >>> 0;
  return () => { let e = n = n + 0x6d2b79f5 >>> 0; e = Math.imul(e ^ e >>> 15, 1 | e); e ^= e + Math.imul(e ^ e >>> 7, 61 | e); return ((e ^ e >>> 14) >>> 0) / 4294967296; };
}
function scShuffle(arr, r) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- BỘ BÀI: 26 lá A-Z, mỗi lá 1 màu + 1 hình ---------- */
function scMakeDeck(r) {
  const cAmt = scShuffle(SC_AMOUNTS, r), sAmt = scShuffle(SC_AMOUNTS, r);
  let m;
  for (;;) {   // bảng màu × hình: mỗi ô tối đa 3 lá, đủ số lá từng màu/hình
    m = SC_COLORS.map(() => SC_SHAPES.map(() => 0));
    const cl = [...cAmt], sl = [...sAmt]; let ok = true;
    for (let k = 0; k < 26 && ok; k++) {
      const opts = [];
      SC_COLORS.forEach((_, a) => SC_SHAPES.forEach((_, b) => { if (cl[a] > 0 && sl[b] > 0 && m[a][b] < 3) opts.push([a, b]); }));
      if (!opts.length) { ok = false; break; }
      const [a, b] = opts[Math.floor(r() * opts.length)];
      m[a][b]++; cl[a]--; sl[b]--;
    }
    if (ok) break;
  }
  const list = [];
  SC_COLORS.forEach((c, a) => SC_SHAPES.forEach((s, b) => { for (let k = 0; k < m[a][b]; k++) list.push({ color: c, shape: s }); }));
  for (;;) {   // xếp lá vào A-Z: 2 lá kề không giống hệt, 3 lá liền không cùng màu/cùng hình, mỗi màu nằm rải đều (số trung bình 8-19)
    const d = scShuffle(list, r);
    let ok = true;
    for (let i = 1; i < d.length && ok; i++) {
      const p = d[i - 1], q = d[i];
      if (p.color === q.color && p.shape === q.shape) ok = false;
      else if (i >= 2) { const o = d[i - 2]; if ((o.color === p.color && p.color === q.color) || (o.shape === p.shape && p.shape === q.shape)) ok = false; }
    }
    for (const c of SC_COLORS) {
      if (!ok) break;
      const pos = d.flatMap((x, i) => x.color === c ? [i + 1] : []), avg = pos.reduce((a, b) => a + b, 0) / pos.length;
      if (avg < 8 || avg > 19) ok = false;
    }
    if (ok) return d.map((x, i) => ({ id: i, letter: String.fromCharCode(65 + i), n: i + 1, ...x }));
  }
}
const scColorCounts = deck => SC_COLORS.map(c => deck.filter(x => x.color === c).length);
const scShapeCounts = deck => SC_SHAPES.map(s => deck.filter(x => x.shape === s).length);
const scRankOf = cnt => cnt.map(t => cnt.filter(e => e > t).length);   // 0 = nhiều nhất ... 4 = ít nhất
function scRanks(deck) {   // hạng màu / hạng hình của từng lá
  const rc = scRankOf(scColorCounts(deck)), rs = scRankOf(scShapeCounts(deck));
  return { color: deck.map(x => rc[SC_COLORS.indexOf(x.color)]), shape: deck.map(x => rs[SC_SHAPES.indexOf(x.shape)]) };
}

/* ---------- BẢNG 14.950 BỘ 4 LÁ + MẶT NẠ BIT ---------- */
let SC_T = null;
const SC_DECK_CACHE = new WeakMap();
function scTable() {
  if (SC_T) return SC_T;
  const hands = [];
  for (let a = 0; a < 26; a++) for (let b = a + 1; b < 26; b++) for (let c = b + 1; c < 26; c++) for (let d = c + 1; d < 26; d++) hands.push([a, b, c, d]);
  const N = hands.length, T = { hands, sum: new Uint16Array(N), ends: new Uint8Array(N), diff: SC_PAIRS.map(() => new Uint8Array(N)),
    pairSum: SC_PAIRS.map(() => new Uint8Array(N)), product: SC_PAIRS.map(() => new Uint16Array(N)), words: Math.ceil(N / 32) };
  hands.forEach((h, k) => {
    T.sum[k] = h[0] + h[1] + h[2] + h[3] + 4; T.ends[k] = h[0] + h[3] + 2;
    SC_PAIRS.forEach(([i, j], p) => { T.diff[p][k] = h[j] - h[i]; T.pairSum[p][k] = h[i] + h[j] + 2; T.product[p][k] = (h[i] + 1) * (h[j] + 1); });
  });
  return SC_T = T;
}
function scDeckTable(deck) {
  let D = SC_DECK_CACHE.get(deck); if (D) return D;
  const { hands } = scTable(), N = hands.length, rk = scRanks(deck), col = deck.map(x => x.color), shp = deck.map(x => x.shape);
  D = { colorKinds: new Uint8Array(N), shapeKinds: new Uint8Array(N), colorRank: [0, 1, 2, 3].map(() => new Uint8Array(N)), shapeRank: [0, 1, 2, 3].map(() => new Uint8Array(N)) };
  hands.forEach((h, k) => {
    D.colorKinds[k] = new Set(h.map(x => col[x])).size; D.shapeKinds[k] = new Set(h.map(x => shp[x])).size;
    for (let p = 0; p < 4; p++) { D.colorRank[p][k] = rk.color[h[p]]; D.shapeRank[p][k] = rk.shape[h[p]]; }
  });
  SC_DECK_CACHE.set(deck, D); return D;
}
const scPair = (i, j) => SC_PAIRS.findIndex(([a, b]) => a === i && b === j);
function scMask(clue, deck) {   // bit k = 1 nếu bộ thứ k khớp gợi ý
  const T = scTable(), { hands, words } = T;
  const [arr, cmp, n] = (() => {
    switch (clue.kind) {
      case "sum": return [T.sum, clue.cmp, clue.n];
      case "ends": return [T.ends, clue.cmp, clue.n];
      case "diff": return [T.diff[scPair(clue.i, clue.j)], "eq", clue.n];
      case "range": return [T.diff[scPair(0, 3)], "eq", clue.n];
      case "pairSum": return [T.pairSum[scPair(clue.i, clue.j)], clue.cmp, clue.n];
      case "product": return [T.product[scPair(clue.i, clue.j)], clue.cmp, clue.n];
      case "colorKinds": return [scDeckTable(deck).colorKinds, "eq", clue.n];
      case "shapeKinds": return [scDeckTable(deck).shapeKinds, "eq", clue.n];
      case "rank": return [scDeckTable(deck)[clue.attr === "color" ? "colorRank" : "shapeRank"][clue.pos], "eq", clue.rank];
    }
  })();
  const m = new Uint32Array(words);
  for (let k = 0; k < hands.length; k++) if (scCmp(cmp, arr[k], n)) m[k >>> 5] |= 1 << (k & 31);
  return m;
}
function scPop(m, stop = Infinity) {
  let n = 0;
  for (let i = 0; i < m.length; i++) { let x = m[i]; while (x) { x &= x - 1; n++; } if (n > stop) break; }
  return n;
}
function scFull() {
  const { hands, words } = scTable(), m = new Uint32Array(words).fill(0xffffffff), r = hands.length & 31;
  if (r) m[words - 1] = (1 << r) - 1;
  return m;
}
function scAnd(list) { const m = scFull(); for (const x of list) for (let i = 0; i < m.length; i++) m[i] &= x[i]; return m; }
const scStep = v => v <= 50 ? 5 : v <= 200 ? 10 : 50;   // gợi ý ≤/≥ làm tròn theo bước này
function scBounds(make, v, deck) {   // gợi ý dạng ≤ / ≥ quanh giá trị thật, bỏ gợi ý quá lỏng (còn > 60% số bộ)
  const N = scTable().hands.length, out = [];
  for (const [cmp, n] of [["le", Math.ceil(v / scStep(v)) * scStep(v)], ["ge", Math.floor(v / scStep(v)) * scStep(v)]]) {
    if (n <= 0) continue;
    const clue = make(cmp, n), mask = scMask(clue, deck), left = scPop(mask);
    if (left <= .6 * N) out.push({ clue, mask, left });
  }
  return out;
}
const scBestBound = (make, v, deck) => scBounds(make, v, deck).sort((a, b) => a.left - b.left)[0] || null;
function scGroup(c) {   // gợi ý cùng nhóm thì chỉ lấy 1
  switch (c.kind) {
    case "sum": case "colorKinds": case "shapeKinds": case "ends": return c.kind;
    case "range": return "diff:03";
    case "pairSum": return c.i === 0 && c.j === 3 ? "ends" : `pairSum:${c.i}${c.j}`;
    case "diff": case "product": return `${c.kind}:${c.i}${c.j}`;
    case "rank": return `rank:${c.pos}:${c.attr}`;
  }
}
function scCandidates(hand, deck) {   // mọi gợi ý đúng với đáp án
  const n = p => hand[p] + 1, rk = scRanks(deck), sum = n(0) + n(1) + n(2) + n(3);
  const inner = SC_PAIRS.filter(([i, j]) => i !== 0 || j !== 3);
  const list = [{ kind: "sum", cmp: "eq", n: sum },
    { kind: "colorKinds", n: new Set(hand.map(x => deck[x].color)).size },
    { kind: "shapeKinds", n: new Set(hand.map(x => deck[x].shape)).size },
    ...inner.map(([i, j]) => ({ kind: "diff", i, j, n: n(j) - n(i) })),
    { kind: "range", n: n(3) - n(0) },
    ...[0, 1, 2, 3].flatMap(p => [{ kind: "rank", pos: p, attr: "color", rank: rk.color[hand[p]] }, { kind: "rank", pos: p, attr: "shape", rank: rk.shape[hand[p]] }]),
  ].map(clue => ({ clue, mask: scMask(clue, deck) }));
  for (const x of [...scBounds((cmp, v) => ({ kind: "sum", cmp, n: v }), sum, deck),
