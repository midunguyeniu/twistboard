<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ ca-rô trượt · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<style>
:root{
  --S:480px; --cell:150px;
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold:#ffc928; --gold-ink:var(--tb-gold-ink);
  --x:#ef4b5f; --x-soft:#fde3e6; --o:#2f7de1; --o-soft:#dde9fb;
  --board:#2c3550; --tile:#f6f7fb; --tile-hover:#ffffff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.92)}
#app{width:fit-content;margin:0 auto;padding:14px 12px 28px}
body.portrait #app{width:100%;padding:8px 8px 24px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.actions{display:flex;gap:8px}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}

#status{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);margin-bottom:12px;font-size:14px;min-height:42px}
.mk{flex:none;width:20px;height:20px;display:inline-grid;place-items:center}
.mk svg{width:100%;height:100%}
.mk.think{animation:blink .9s infinite}
@keyframes blink{50%{opacity:.2}}

/* quân X / O vẽ bằng SVG */
.ix path{stroke:var(--x);fill:none;stroke-linecap:round}
.io circle{stroke:var(--o);fill:none}

#stage{display:flex;gap:20px;align-items:flex-start;justify-content:center}
#boardWrap{position:relative;flex:none}
#board{position:relative;width:var(--S);height:var(--S);background:var(--board);border-radius:24px;padding:10px;
  box-shadow:0 14px 34px rgba(20,30,60,.25);user-select:none;-webkit-user-select:none;touch-action:none}
#grid{position:relative;width:calc(var(--cell) * var(--n));height:calc(var(--cell) * var(--n))}
.cell{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--c) * var(--cell));top:calc(var(--r) * var(--cell))}
.cell::before{content:"";position:absolute;inset:5px;border-radius:16px;background:var(--tile);transition:background .15s,box-shadow .15s}
.cell.can{cursor:pointer}
.cell.can:hover::before{background:var(--tile-hover);box-shadow:0 0 0 3px rgba(255,201,40,.55)}
.cell.tgt::after{content:"";position:absolute;left:50%;top:50%;width:16%;height:16%;margin:-8% 0 0 -8%;border-radius:50%;background:rgba(44,53,80,.18)}
.cell.tgt.over::before{background:#fff6d6;box-shadow:0 0 0 3px var(--gold)}
.cell.from::before{background:repeating-linear-gradient(45deg,var(--tile) 0 8px,#eceef4 8px 16px)}
.cell.from.mine::before{box-shadow:inset 0 0 0 2.5px rgba(31,174,75,.55)}
.cell.from.theirs::before{box-shadow:inset 0 0 0 2.5px rgba(229,50,43,.5)}
#pieces{position:absolute;left:10px;top:10px;pointer-events:none}
.pc{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--c) * var(--cell));top:calc(var(--r) * var(--cell));display:grid;place-items:center;
  transition:left .32s cubic-bezier(.3,.8,.3,1),top .32s cubic-bezier(.3,.8,.3,1),transform .18s,opacity .2s;z-index:1}
.pc::before{content:"";position:absolute;inset:5px;border-radius:16px;opacity:0;transition:opacity .2s}
.pc.k0::before{background:var(--x-soft)} .pc.k1::before{background:var(--o-soft)}
.pc svg{position:relative;width:58%;height:58%}
.pc.new svg{animation:pop .26s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.pc.mov{cursor:grab}
.pc.sel{transform:scale(1.07);z-index:3}
.pc.sel::before,.pc.drag::before{opacity:1;box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.25)}
.pc.drag{transition:none;z-index:5;cursor:grabbing}
.pc.snap{transition:none}
.pc.last::after{content:"";position:absolute;inset:9px;border-radius:13px;border:3px solid #1fae4b}
.pc.last.theirs::after{border-color:#e5322b}
.pc.ghost{opacity:.28}
.pc.hint svg{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:none}50%{transform:scale(1.08)}}
.pc.win::before{opacity:1;background:#d9f5e1;box-shadow:0 0 0 3px #1fae4b}
#winLine{position:absolute;left:10px;top:10px;pointer-events:none;z-index:6;overflow:visible}
#winLine line{stroke:#1fae4b;stroke-linecap:round;stroke-dasharray:10;stroke-dashoffset:10;animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.side{width:290px;flex:none;display:flex;flex-direction:column;gap:10px}
.panel{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px;row-gap:8px;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:2px solid var(--line);box-shadow:var(--tb-shadow);transition:border-color .2s,box-shadow .2s}
.panel.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,40,.35)}
.picon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.picon svg{width:72%;height:72%}
#panel-0 .picon{background:var(--x-soft)} #panel-1 .picon{background:var(--o-soft)}
.pinfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.pinfo b{font-size:15px}
.pinfo span{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptime{font-family:var(--tb-font-brand);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.panel.active .ptime{color:var(--text)}
.ptime.low{color:#d9362b!important;animation:blink .5s infinite}
.pbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--tb-green);border-radius:99px;transform-origin:left;transition:background .3s}
.pbar i.low{background:#e5453b}
.phand{grid-column:1/-1;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
.phand i{width:16px;height:16px;display:inline-grid;place-items:center}
.phand i svg{width:100%;height:100%}
.phand i.used{opacity:.22}
.phand span{margin-left:6px}
#info{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow);font-size:13.5px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
#info dt{color:var(--muted)} #info dd{margin:0;font-weight:800;text-align:right}
#tip{margin:10px 0 0;color:var(--gold-ink);font-weight:700;line-height:1.4}

#gameover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,25,40,.35);z-index:20;animation:fade .3s;border-radius:24px}
.go-card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:22px 26px;text-align:center;max-width:90%;box-shadow:var(--tb-shadow-lg);position:relative}
.go-card h2{margin:0 0 6px;font-family:var(--tb-font-brand);font-size:30px}
.go-card p{margin:0 0 16px;color:var(--muted)}
.go-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#goNet{margin:-8px 0 14px}
#goNet:empty{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg);position:relative}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg button:disabled{cursor:not-allowed;pointer-events:none}
#segLevel button{min-width:0;padding:9px 4px}
#segSide button,#segSize button{display:flex;align-items:center;justify-content:center;gap:8px}
#segSide button svg{width:18px;height:18px;flex:none}
.off{opacity:.28;filter:grayscale(1)}
.off .seg button.on{background:var(--btn);color:var(--text);border-color:var(--line);box-shadow:none}
#levelNote{min-height:2.8em;line-height:1.4;margin:6px 0 0}
#sizeNote{line-height:1.4;margin:6px 0 0}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 240px}
#joinCode{flex:1 1 140px;min-width:0;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;font-size:18px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
#joinCode:disabled{opacity:.35}
#mNet .card{max-width:460px;text-align:center}
#mNet .foot{justify-content:center}
.netcode{font-family:var(--tb-font-brand);font-size:46px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:4px 0 12px;user-select:all}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#netMsg{color:var(--muted);margin:14px 0 0}
/* minh hoạ trong hộp Luật chơi */
.demo{display:flex;gap:14px;align-items:center;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.demo .mini{display:grid;grid-template-columns:repeat(3,26px);gap:3px;padding:5px;background:var(--board);border-radius:9px}
.demo .mini i{width:26px;height:26px;border-radius:6px;background:var(--tile);display:grid;place-items:center}
.demo .mini i svg{width:70%;height:70%}
.demo .mini i.fr{background:repeating-linear-gradient(45deg,var(--tile) 0 4px,#e3e6ee 4px 8px)}
.demo .mini i.to{box-shadow:inset 0 0 0 2px #1fae4b}
.demo .arr{font-size:22px;color:var(--muted);font-weight:900}

body.portrait .brand{display:none}
body.portrait .actions{width:100%} body.portrait #btnNew{margin-left:auto}
body.portrait #status{font-size:13px;margin-bottom:8px;min-height:58px}
body.portrait #stage{flex-direction:column;align-items:center;gap:10px}
body.portrait .side{display:contents}
body.portrait .panel{width:var(--S)}
body.portrait .panel.top-p{order:1} body.portrait #boardWrap{order:2} body.portrait .panel.bot-p{order:3} body.portrait #info{order:4;width:var(--S)}
body.portrait .ptime{font-size:22px}
@media (max-width:600px){#segLevel button{flex:0 0 calc((100% - 16px) / 3)}#segLevel{justify-content:center}.seg button{min-width:0}}
</style>

  <div class="card">

</div>

  <div class="card">
    <h2 id="netTitle"></h2>
    <div id="netCodeBox" hidden>
      <div class="netcode" id="netCode"></div>
      <div class="netlink"><input id="netLink" readonly><button class="btn" id="netCopy" data-i18n="n_copy"></button></div>

    <p id="netMsg"></p>
    <div class="foot"><button class="btn" id="netCancel" data-i18n="cancel"></button></div>
  </div>

<script>
"use strict";
/* ============================================================
   SLIDING TIC TAC TOE
   Bàn 3x3 (3 liền hàng, mỗi bên 3 quân) hoặc 4x4 (4 liền hàng, mỗi bên 5 quân). X đi trước.
   Đặt quân tới khi đủ số quân, sau đó mỗi lượt bắt buộc kéo 1 quân của mình sang 1 ô trống bất kỳ.
   Đủ hàng sau nước của mình là thắng. 10 giây mỗi nước, hết giờ thua. Không có hoà, trừ khi đấu AI lặp thế 3 lần.
   Toạ độ: ô i = r*n + c. Bên 0 = X, bên 1 = O. Thế cờ lưu bằng 2 mặt nạ bit XM, OM.
   ============================================================ */
const $ = (s, root = document) => root.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const TIME = 10;   // giây mỗi nước (chủ game chọn cố định 10 giây)

/* RULES-AI-START */
/* Luật + AI, không đụng DOM (cắt ra chạy bằng Node được: tools/test-sliding-tictactoe.js).
   Bàn n×n, ô i = r*n + c, bên 0 = X (đi trước), bên 1 = O. Thế cờ = 2 mặt nạ bit (xm, om) + bên tới lượt.
   Mỗi bên đặt quân tới khi đủ p quân, sau đó mỗi lượt bắt buộc kéo 1 quân của mình sang 1 ô trống bất kỳ.
   Ai có k quân liền hàng (ngang, dọc, chéo) ngay sau nước của mình thì thắng. */
const VARIANTS = { "3": { n: 3, k: 3, p: 3 }, "4": { n: 4, k: 4, p: 5 } };

/* Bộ luật dựng sẵn cho 1 kiểu bàn: các đường thắng, bảng tra "mặt nạ có chứa đường thắng", và cách đánh số thế cờ.
   Hàm này tự đủ (không gọi gì bên ngoài) vì được chép nguyên văn vào Web Worker để giải bàn 4x4. */
function makeRules(n, k, p) {
  const C = n * n, FULL = (1 << C) - 1;
  const lines = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      let m = 0, ok = true;
      for (let j = 0; j < k; j++) { const rr = r + dr * j, cc = c + dc * j; if (rr < 0 || rr >= n || cc < 0 || cc >= n) { ok = false; break; } m |= 1 << (rr * n + cc); }
      if (ok) lines.push(m);
    }
  const WIN = new Uint8Array(1 << C);
  for (let m = 0; m <= FULL; m++) for (const l of lines) if ((m & l) === l) { WIN[m] = 1; break; }
  const pop = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
  // số tổ hợp, hạng colex của mặt nạ (không phụ thuộc độ rộng), nén bit (pext) theo từng byte
  const BIN = []; for (let a = 0; a <= C; a++) { BIN.push([]); for (let b = 0; b <= C; b++) BIN[a].push(b === 0 ? 1 : a === 0 ? 0 : BIN[a - 1][b - 1] + (b <= a - 1 ? BIN[a - 1][b] : 0)); }
  const RANK = new Int32Array(1 << C);
  for (let m = 0; m <= FULL; m++) { let r = 0, i = 0; for (let q = 0; q < C; q++) if (m >> q & 1) { i++; r += BIN[q][i]; } RANK[m] = r; }
  const PX = new Uint8Array(65536), POP8 = new Uint8Array(256);
  for (let f = 0; f < 256; f++) { POP8[f] = pop(f); for (let o = 0; o < 256; o++) { let r = 0, j = 0; for (let q = 0; q < 8; q++) if (f >> q & 1) { if (o >> q & 1) r |= 1 << j; j++; } PX[f << 8 | o] = r; } }
  const compress = (o, f) => PX[(f & 255) << 8 | (o & 255)] | (PX[(f >> 8 & 255) << 8 | (o >> 8 & 255)] << POP8[f & 255]);
  // nhóm thế cờ theo (số X, số O, bên tới lượt). Hợp lệ: X tới lượt khi số X = số O; O tới lượt khi số X = số O + 1; đủ quân thì cả hai.
  const G = (p + 1) * (p + 1) * 2, OFF = new Float64Array(G).fill(-1);
  let total = 0;
  for (let nx = 0; nx <= p; nx++) for (let no = 0; no <= p; no++) for (let s = 0; s < 2; s++) {
    const ok = (nx === p && no === p) || (s === 0 ? nx === no : nx === no + 1);
    if (!ok || nx + no > C) continue;
    OFF[(nx * (p + 1) + no) * 2 + s] = total; total += BIN[C][nx] * BIN[C - nx][no];
  }
  function index(xm, om, s) {
    const nx = pop(xm), no = pop(om);
    return OFF[(nx * (p + 1) + no) * 2 + s] + RANK[xm] * BIN[C - nx][no] + RANK[compress(om, ~xm & FULL)];
  }
  return { n, k, p, C, FULL, lines, WIN, pop, index, total, OFF, BIN };
}

/* Giải trọn vẹn bằng phân tích ngược (retrograde): val[i] = 1 bên tới lượt thắng chắc, -1 thua chắc, 0 hoà (đi vòng mãi);
   dep[i] = số nửa nước tới khi kết thúc nếu cả hai chơi chuẩn (thắng nhanh nhất / thua chậm nhất). */
function solveRules(R) {
  const { C, FULL, WIN, pop, index, total, p } = R;
  const val = new Int8Array(total), dep = new Uint16Array(total), cnt = new Uint8Array(total);
  const qa = new Uint32Array(total), qs = new Uint8Array(total); let qn = 0;
  const masks = []; for (let c = 0; c <= C; c++) masks.push([]);
  for (let m = 0; m <= FULL; m++) masks[pop(m)].push(m);
  for (let nx = 0; nx <= p; nx++) for (let no = 0; no <= p; no++) for (let s = 0; s < 2; s++) {
    const ok = (nx === p && no === p) || (s === 0 ? nx === no : nx === no + 1);
    if (!ok || nx + no > C) continue;
    const empt = C - nx - no;
    for (const xm of masks[nx]) for (const om of masks[no]) {
      if (xm & om) continue;
      const i = index(xm, om, s), mine = s ? om : xm, theirs = s ? xm : om;
      if (WIN[theirs]) { val[i] = -1; qa[qn] = (xm | om << 16) >>> 0; qs[qn++] = s; }
      else if (WIN[mine]) val[i] = 2;   // không thể xảy ra trong ván thật
      else cnt[i] = (s ? no : nx) < p ? empt : p * empt;
    }
  }
  for (let h = 0; h < qn; h++) {
    const a = qa[h], xm = a & 0xffff, om = a >>> 16, s = qs[h], t = index(xm, om, s);
    const q = 1 - s, qm = q ? om : xm, nx = pop(xm), no = pop(om), empty = ~(xm | om) & FULL;
    const vt = val[t], dt = dep[t] + 1;
    const visit = (pxm, pom) => {
      const ps = index(pxm, pom, q);
      if (val[ps] !== 0) return;
      if (vt === -1) { val[ps] = 1; dep[ps] = dt; }
      else if (--cnt[ps] === 0) { val[ps] = -1; dep[ps] = dt; }
      else return;
      qa[qn] = (pxm | pom << 16) >>> 0; qs[qn++] = q;
    };
    // nước trước là nước đặt quân của bên q
    if (q === 0 ? nx - 1 === no : nx === no) for (let b = qm; b; b &= b - 1) { const bit = b & -b; q ? visit(xm, om ^ bit) : visit(xm ^ bit, om); }
    // nước trước là nước kéo quân của bên q (cả hai đã đủ quân)
    if (nx === p && no === p) for (let b = qm; b; b &= b - 1) { const bit = b & -b; for (let e = empty; e; e &= e - 1) { const eb = e & -e; q ? visit(xm, om ^ bit ^ eb) : visit(xm ^ bit ^ eb, om); } }
  }
  return { val, dep };
}

/* Các nước hợp lệ của bên s: { f: ô đi (-1 nếu đặt quân mới), t: ô tới } */
function legalActions(R, xm, om, s) {
  const mine = s ? om : xm, empty = ~(xm | om) & R.FULL, out = [];
  const bits = m => { const r = []; for (let i = 0; i < R.C; i++) if (m >> i & 1) r.push(i); return r; };
  if (R.pop(mine) < R.p) for (const t of bits(empty)) out.push({ f: -1, t });
  else for (const f of bits(mine)) for (const t of bits(empty)) out.push({ f, t });
  return out;
}
function applyAction(xm, om, s, a) {
  const d = (a.f >= 0 ? 1 << a.f : 0) | 1 << a.t;
  return s ? [xm, om ^ d] : [xm ^ d, om];
}
/* Kết quả mỗi nước theo bảng đã giải, nhìn từ phía bên đi: r = 1 thắng / 0 hoà / -1 thua, d = số nửa nước tới hết ván,
   trap = tỉ lệ nước đáp trả của đối thủ bị thua chắc (dùng để chọn giữa các nước hoà: gài bẫy). */
function rateActions(R, S, xm, om, s) {
  return legalActions(R, xm, om, s).map(a => {
    const [x2, o2] = applyAction(xm, om, s, a), mine = s ? o2 : x2;
    if (R.WIN[mine]) return { ...a, r: 1, d: 1, trap: 1 };
    if (!S) {   // chưa có bảng giải (máy không giải được): chỉ nhìn trước 1 nước đáp trả
      const opWins = legalActions(R, x2, o2, 1 - s).some(b => { const [x3, o3] = applyAction(x2, o2, 1 - s, b); return R.WIN[s ? x3 : o3]; });
      return { ...a, r: opWins ? -1 : 0, d: 2, trap: 0 };
    }
    const j = R.index(x2, o2, 1 - s), v = S.val[j];
    let trap = 0;
    if (v === 0) {
      const rep = legalActions(R, x2, o2, 1 - s);
      for (const b of rep) { const [x3, o3] = applyAction(x2, o2, 1 - s, b); if (!R.WIN[s ? x3 : o3] && S.val[R.index(x3, o3, s)] === 1) trap++; }
      trap /= rep.length || 1;
    }
    return { ...a, r: -v, d: S.dep[j] + 1, trap };
  });
}
/* 5 mức AI. win1: tỉ lệ thấy nước thắng ngay; block: tỉ lệ thấy đối thủ sắp thắng (tránh nước để đối thủ thắng ngay);
   deep: tỉ lệ dùng bảng giải để chọn nước tốt nhất; safe: khi không chọn nước tốt nhất thì vẫn tránh nước thua chắc trong vòng bao nhiêu nửa nước (0 = không tránh). */
const AI_LEVELS = {
  easy:   { win1: .6,  block: .35, deep: 0,   safe: 0 },
  normal: { win1: .9,  block: .7,  deep: 0,   safe: 0 },
  hard:   { win1: 1,   block: .95, deep: .25, safe: 0 },
  expert: { win1: 1,   block: 1,   deep: .6,  safe: 3 },
  master: { win1: 1,   block: 1,   deep: 1,   safe: 99 },
};
function aiPick(R, S, xm, om, s, level, rnd = Math.random) {
  const cfg = AI_LEVELS[level] || AI_LEVELS.normal;
  const A = rateActions(R, S, xm, om, s), pick = arr => arr[Math.floor(rnd() * arr.length)];
  const score = x => x.r > 0 ? 1000 - x.d : x.r < 0 ? -1000 + x.d : x.trap;
  if (rnd() < cfg.deep) {   // chơi theo bảng giải: thắng nhanh nhất, không thì hoà (ưu tiên nước gài bẫy), không thì thua chậm nhất
    const best = A.reduce((m, x) => score(x) > score(m) ? x : m, A[0]);
    return pick(best.r === 0 ? A.filter(x => x.r === 0 && x.trap >= best.trap - .05) : A.filter(x => score(x) === score(best)));
  }
  const wins = A.filter(x => x.r > 0 && x.d === 1);
  if (wins.length && rnd() < cfg.win1) return pick(wins);
  let pool = A;
  if (rnd() < cfg.block) { const ok = pool.filter(x => !(x.r < 0 && x.d <= 2)); if (ok.length) pool = ok; }
  if (cfg.safe) { const ok = pool.filter(x => !(x.r < 0 && x.d <= cfg.safe)); if (ok.length) pool = ok; }
  return pick(pool);
}
/* RULES-AI-END */

    w.onerror = e => { e.preventDefault && e.preventDefault(); w.terminate(); URL.revokeObjectURL(url); entry.failed = true; res(); };   // AI dùng cách nhìn 1 nước

  if (peer || conn) setTimeout(() => { try { if (conn) conn.close(); } catch (e) {} try { if (peer) peer.destroy(); } catch (e) {} }, bye ? 400 : 0);
}

/* ---------- RENDER ---------- */
const boardEl = $("#board"), gridEl = $("#grid"), piecesEl = $("#pieces");
const pieceEls = new Map();   // mã quân → phần tử
let cellEls = [], newPiece = 0, snapPiece = 0, hoverCell = -1, sel = -1, drag = null;
function buildGrid() {
  document.documentElement.style.setProperty("--n", R.n);
  gridEl.innerHTML = "";
  cellEls = [];
  for (let i = 0; i < R.C; i++) {
    const e = document.createElement("div"), { r, c } = cellOf(i);
    e.className = "cell"; e.style.setProperty("--r", r); e.style.setProperty("--c", c);
    gridEl.appendChild(e); cellEls.push(e);
  }
}
const ghostEl = document.createElement("div"); ghostEl.className = "pc ghost"; ghostEl.hidden = true; piecesEl.appendChild(ghostEl);
const canAct = () => started && !over && isLocal(turn);
function renderBoard() {
  const last = moves.length ? moves[moves.length - 1] : null, my = canAct(), plc = my && placing(turn);
  const tgtOn = my && !plc && (sel >= 0 || (drag && drag.moved));
  for (let i = 0; i < R.C; i++) {
    const e = cellEls[i], empty = at(i) === -1;
    let cls = "cell";
    if (empty && (plc || tgtOn)) cls += " can";
    if (empty && tgtOn) cls += " tgt" + (drag && drag.over === i ? " over" : "");
    if (last && last.f === i && empty) cls += " from " + (last.s === humanS() ? "mine" : "theirs");
    e.className = cls;
  }
  const alive = new Set();
  for (let i = 0; i < R.C; i++) {
    const s = at(i); if (s < 0) continue;
    const id = pid[i]; alive.add(id);
    let e = pieceEls.get(id);
    if (!e) { e = document.createElement("div"); e.innerHTML = ICON(s); piecesEl.appendChild(e); pieceEls.set(id, e); }
    const { r, c } = cellOf(i);
    if (id === snapPiece) { e.classList.add("snap"); void e.offsetWidth; }
    e.style.setProperty("--r", r); e.style.setProperty("--c", c);
    if (!(drag && drag.from === i && drag.moved)) e.style.transform = "";
    let cls = "pc k" + s;
    if (id === newPiece) cls += " new";
    if (last && last.t === i) cls += " last " + (last.s === humanS() ? "mine" : "theirs");
    if (over && over.line && (over.line >> i & 1)) cls += " win";
    if (my && !plc && s === turn) cls += " mov";
    if (sel === i) cls += " sel";
    if (drag && drag.from === i && drag.moved) cls += " drag";
    if (id === snapPiece) cls += " snap";
    e.className = cls;
  }
  if (snapPiece) { const e = pieceEls.get(snapPiece); requestAnimationFrame(() => e && e.classList.remove("snap")); }
  for (const [id, e] of pieceEls) if (!alive.has(id)) { e.remove(); pieceEls.delete(id); }
  newPiece = 0; snapPiece = 0;
  const showGhost = hoverCell >= 0 && plc && at(hoverCell) === -1;
  ghostEl.hidden = !showGhost;
  if (showGhost) {
    ghostEl.innerHTML = ICON(turn); const { r, c } = cellOf(hoverCell);
    ghostEl.style.setProperty("--r", r); ghostEl.style.setProperty("--c", c);
  }
  renderWinLine();
}
function renderWinLine() {
  const svg = $("#winLine"), n = R.n, cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell")) || 100;
  svg.setAttribute("width", cell * n); svg.setAttribute("height", cell * n);
  if (!over || !over.line) { svg.innerHTML = ""; return; }
  const cells = []; for (let i = 0; i < R.C; i++) if (over.line >> i & 1) cells.push(i);
  const a = cellOf(cells[0]), b = cellOf(cells[cells.length - 1]), P = (v) => (v + .5) * cell;
  const key = cells.join(",") + "@" + cell;
  if (svg.dataset.k === key) return;
  svg.dataset.k = key;
  const len = Math.hypot(P(b.c) - P(a.c), P(b.r) - P(a.r)) + 1;
  svg.innerHTML = `<line x1="${P(a.c)}" y1="${P(a.r)}" x2="${P(b.c)}" y2="${P(b.r)}" stroke-width="${Math.max(6, cell * .09)}" style="stroke-dasharray:${len};stroke-dashoffset:${len}"/>`;
}
function roleOf(s) {
  if (isBot(s)) return tr("role_bot", tr("lv_" + MODE.level));
  if (isRemote(s)) return tr("role_opp");
  return tr("role_you");
}
function renderClocks() {
  for (const s of [0, 1]) {
    const p = $("#panel-" + s), t = p.querySelector(".ptime"), bar = p.querySelector(".pbar i");
    const active = started && !over && turn === s;
    p.classList.toggle("active", active);
    if (isBot(s)) { t.textContent = ""; t.classList.remove("low"); bar.style.transform = "scaleX(1)"; bar.classList.remove("low"); continue; }
    const left = active && deadline ? timeLeft() : TIME * 1000;
    const sec = Math.ceil(left / 1000);
    t.textContent = sec + "s";
    t.classList.toggle("low", active && sec <= 3);
    bar.style.transform = `scaleX(${Math.max(0, Math.min(1, left / (TIME * 1000)))})`;
    bar.classList.toggle("low", active && sec <= 3);
  }
}
function renderPanels() {
  for (const s of [0, 1]) {
    const p = $("#panel-" + s);
    p.querySelector(".picon").innerHTML = ICON(s);
    p.querySelector(".pinfo b").textContent = tr("n_" + s);
    p.querySelector(".pinfo span").textContent = started ? roleOf(s) : "";
    const n = countOf(s);
    p.querySelector(".phand").innerHTML = Array.from({ length: R.p }, (_, j) => `<i class="${j < n ? "used" : ""}">${ICON(s)}</i>`).join("") +
      `<span>${n < R.p ? tr("hand_left", R.p - n) : tr("hand_full")}</span>`;
    p.classList.toggle("top-p", s !== humanS()); p.classList.toggle("bot-p", s === humanS());
  }
  const side = $(".side");   // màn ngang: đối thủ ở trên, mình ở dưới
  if (humanS() === 0) side.insertBefore($("#panel-1"), $("#panel-0")); else side.insertBefore($("#panel-0"), $("#panel-1"));
  renderClocks();
}
function renderStatus() {
  const mk = $("#stMark"); let h, s = over ? over.winner : turn;
  mk.innerHTML = s === 0 || s === 1 ? ICON(s) : ""; mk.className = "mk";
  if (!started) { h = tr("st_notstarted"); mk.innerHTML = ""; }
  else if (over) {
    const me = humanS();
    if (over.aborted) h = tr("st_aborted");
    else if (over.left) h = tr("st_left");
    else if (over.rep) h = tr("st_rep");
    else if (over.timeout !== undefined) h = over.timeout === me ? tr("st_to_you") : tr("st_to_opp");
    else h = over.winner === me ? tr("st_win_you") : MODE.vs === "bot" ? tr("st_win_bot") : tr("st_win_opp");
  }
  else if (isBot(turn)) { h = tr(botWaiting ? "st_prep" : "st_bot"); mk.classList.add("think"); }
  else if (isRemote(turn)) h = tr("st_remote");
  else h = placing(turn) ? tr("st_place", R.p - countOf(turn)) : tr("st_move");
  $("#statusText").innerHTML = h;
}
function renderInfo() {
  $("#infoList").innerHTML = `<dt>${tr("i_board")}</dt><dd>${tr("i_board_v", R.n, R.k)}</dd><dt>${tr("i_pieces")}</dt><dd>${tr("i_pieces_v", R.p)}</dd>` +
    `<dt>${tr("i_time")}</dt><dd>${tr("i_time_v")}</dd><dt>${tr("i_moves")}</dt><dd>${moves.length}</dd>`;
  $("#tip").textContent = tr(started && !placing(humanS()) ? "tip_move" : "tip_place");
}
function renderOver() {
  const go = $("#gameover");
  if (!over || overDismissed) { go.hidden = true; return; }
  const me = humanS();
  if (go.hidden) sfx(over.aborted || over.winner === null ? "draw" : over.winner === me ? "win" : "lose");
  go.hidden = false;
  $("#goTitle").textContent = over.aborted ? tr("go_aborted") : over.winner === null ? tr("go_draw") : over.timeout === me ? tr("go_timeout")
    : over.winner === me ? tr("go_you") : MODE.vs === "bot" ? tr("go_bot") : tr("go_opp");
  $("#goSub").textContent = over.aborted ? tr("gs_aborted") : over.left ? tr("gs_left") : over.rep ? tr("gs_rep")
    : over.timeout !== undefined ? (over.timeout === me ? tr("gs_to_you") : tr("gs_to_opp")) : tr("gs_line", R.k, over.move);
  const rematch = MODE.vs === "online" && netOpen();
  $("#goNew").textContent = tr(rematch ? "go_rematch" : "b_new");
  $("#goNew").disabled = rematch && NET.rm.me;
  $("#goNet").textContent = !rematch ? "" : NET.rm.me ? tr("go_rm_wait") : NET.rm.them ? tr("go_rm_them") : "";
}
function render() { renderBoard(); renderPanels(); renderStatus(); renderInfo(); renderOver(); }

/* ---------- KÍCH THƯỚC ---------- */
function fit() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight - ((document.getElementById("tb-header") || {}).offsetHeight || 0);
  const portrait = vw < 820;
  document.body.classList.toggle("portrait", portrait);
  let S = portrait ? Math.min(vw - 16, vh - 270) : Math.min(vw - 24 - 290 - 20, vh - 140);
  S = Math.max(280, Math.min(S, 540));
  const cell = Math.floor((S - 20) / R.n); S = cell * R.n + 20;
  document.documentElement.style.setProperty("--S", S + "px");
  document.documentElement.style.setProperty("--cell", cell + "px");
  if (cellEls.length) renderWinLine();
}

/* ---------- ĐIỀU KHIỂN: bấm ô để đặt; kéo thả hoặc bấm quân rồi bấm ô để kéo quân ---------- */
function cellFromPoint(x, y) {
  const rect = gridEl.getBoundingClientRect(), cw = rect.width / R.n;
  const c = Math.floor((x - rect.left) / cw), r = Math.floor((y - rect.top) / cw);
  return r >= 0 && r < R.n && c >= 0 && c < R.n ? r * R.n + c : -1;
}
boardEl.addEventListener("pointerdown", e => {
  if (!canAct() || e.button > 0) return;
  const i = cellFromPoint(e.clientX, e.clientY); if (i < 0) return;
  if (placing(turn)) { if (at(i) === -1) humanAct({ f: -1, t: i }); return; }
  if (at(i) === turn) {
    drag = { from: i, x: e.clientX, y: e.clientY, moved: false, over: -1, id: e.pointerId, wasSel: sel === i };
    sel = i; sfx("pick");
    try { boardEl.setPointerCapture(e.pointerId); } catch (er) {}
    renderBoard();
  } else if (at(i) === -1 && sel >= 0) humanAct({ f: sel, t: i });
  else if (sel >= 0) { sel = -1; renderBoard(); }
});
boardEl.addEventListener("pointermove", e => {
  if (drag && e.pointerId === drag.id) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; renderBoard(); }
    if (drag.moved) {
      const el = pieceEls.get(pid[drag.from]); if (el) el.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`;
      const i = cellFromPoint(e.clientX, e.clientY), ov = i >= 0 && at(i) === -1 ? i : -1;
      if (ov !== drag.over) { drag.over = ov; renderBoard(); }
    }
    return;
  }
  if (e.pointerType === "mouse") {
    const i = canAct() && placing(turn) ? cellFromPoint(e.clientX, e.clientY) : -1;
    if (i !== hoverCell) { hoverCell = i; renderBoard(); }
  }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.moved) {
    const i = cancel ? -1 : cellFromPoint(e.clientX, e.clientY);
    if (i >= 0 && at(i) === -1 && canAct() && humanAct({ f: d.from, t: i }, true)) return;
    sel = -1;   // thả ra ngoài: quân trượt về chỗ cũ
  } else if (d.wasSel) sel = -1;   // bấm lại quân đang chọn: bỏ chọn
  renderBoard();
}
boardEl.addEventListener("pointerup", e => endDrag(e, false));
boardEl.addEventListener("pointercancel", e => endDrag(e, true));
boardEl.addEventListener("mouseleave", () => { if (hoverCell >= 0) { hoverCell = -1; renderBoard(); } });

/* ---------- BẢNG CHỌN CHẾ ĐỘ ---------- */
let modeDraft = null;
$("#segLevel").innerHTML = LEVELS.map(l => `<button data-v="${l}" data-i18n="lv_${l}"></button>`).join("");
const MODE_SEGS = [["#segVs", "vs"], ["#segNet", "net"], ["#segSize", "size"], ["#segSide", "human"], ["#segLevel", "level"]];
function syncMode() {
  for (const [id, key] of MODE_SEGS) document.querySelectorAll(id + " button").forEach(b => b.classList.toggle("on", b.dataset.v === modeDraft[key]));
  const online = modeDraft.vs === "online", join = online && modeDraft.net === "join";
  $("#netOpts").classList.toggle("off", !online);
  $("#segNet").querySelectorAll("button").forEach(b => { b.disabled = !online; });
  $("#joinCode").disabled = !join; $("#joinCode").placeholder = tr("m_code_ph");
  if (!$("#joinCode").value && modeDraft.code) $("#joinCode").value = modeDraft.code;
  $("#netNote").textContent = tr(join ? "m_net_join" : "m_net_create");
  $("#ruleOpts").classList.toggle("off", join);   // vào phòng người khác: chủ phòng chọn luật
  $("#ruleOpts").querySelectorAll("button").forEach(b => { b.disabled = join; });
  $("#levelOpts").classList.toggle("off", online);
  $("#segLevel").querySelectorAll("button").forEach(b => { b.disabled = online; });
  $("#sizeNote").textContent = tr("sz_" + modeDraft.size);
  $("#levelNote").textContent = tr("lv_" + modeDraft.level) + ": " + tr("lvn_" + modeDraft.level);
  $("#modeStart").textContent = online ? tr(join ? "m_join" : "m_create") : started && !over ? tr("m_forfeit") : tr("m_start");
  if (!online && modeDraft.size === "4") solverFor("4");   // giải trước bảng 4x4 trong lúc người chơi chọn
}
function openMode() {
  modeDraft = clone(PREFS); modeDraft.net = MODE.net || "create"; modeDraft.code = "";
  syncMode();
  $("#modeCancel").textContent = started ? tr("cancel") : tr("m_back");
  $("#mMode").hidden = false;
}
let returnToMode = true;
function openRules() { $("#mRules").hidden = false; }
function buildDemo() {   // minh hoạ: X kéo quân từ góc sang ô trống, thành 3 liền hàng
  const X = ICON_X, O = ICON_O;
  const mini = (cells, fr, to) => `<div class="mini">${cells.map((v, i) => `<i class="${i === fr ? "fr" : i === to ? "to" : ""}">${v}</i>`).join("")}</div>`;
  $("#rulesDemo").innerHTML = mini([X, O, "", O, X, "", X, "", O], -1, -1) + '<span class="arr">→</span>' + mini(["", O, X, O, X, "", X, "", O], 0, 2);
}

/* ---------- NGÔN NGỮ ---------- */
function setLang(l) {
  LANG = l; try { localStorage.setItem("lang", l); } catch (e) {}
  if (window.TB) TB.setLang(l);
  applyI18n(); if (modeDraft && !$("#mMode").hidden) syncMode();
  render();
}
if (window.TB) TB.onLang(l => { if (l !== LANG) setLang(l); });

/* ---------- SỰ KIỆN ---------- */
for (const [id, key] of MODE_SEGS)
  document.querySelectorAll(id + " button").forEach(b => b.addEventListener("click", () => {
    modeDraft[key] = b.dataset.v; syncMode();
    if (modeDraft.vs === "online" && modeDraft.net === "join" && (key === "net" || key === "vs")) $("#joinCode").focus();
  }));
$("#joinCode").addEventListener("input", e => { const v = normCode(e.target.value); if (e.target.value !== v) e.target.value = v; });
$("#joinCode").addEventListener("keydown", e => { if (e.key === "Enter") $("#modeStart").click(); });
$("#netCancel").addEventListener("click", () => { netClose(true); $("#mNet").hidden = true; if (!started) openMode(); });
$("#netCopy").addEventListener("click", () => {
  const inp = $("#netLink"), btn = $("#netCopy");
  const done = () => { btn.textContent = tr("n_copied"); setTimeout(() => { btn.textContent = tr("n_copy"); }, 1500); };
  const legacy = () => { inp.select(); try { document.execCommand("copy"); done(); } catch (e) {} };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, legacy); else legacy();
});
window.addEventListener("pagehide", () => { if (netOpen()) try { NET.conn.send({ t: "bye" }); } catch (e) {} });
$("#modeCancel").addEventListener("click", () => {
  $("#mMode").hidden = true;
  if (!started) { returnToMode = true; openRules(); }
});
$("#modeStart").addEventListener("click", () => {
  for (const k of ["vs", "human", "level", "size"]) if (!(modeDraft.vs === "online" && modeDraft.net === "join" && k !== "vs")) PREFS[k] = modeDraft[k];
  savePrefs();
  if (modeDraft.vs === "online") {
    if (modeDraft.net === "join") {
      modeDraft.code = normCode($("#joinCode").value);
      if (modeDraft.code.length !== CODE_LEN) { $("#netNote").textContent = tr("n_err_code"); $("#joinCode").focus(); return; }
    }
    return startOnline();
  }
  netClose(true);
  MODE = clone(modeDraft); $("#mMode").hidden = true; newGame(false);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#mNet").hidden) $("#netCancel").click();
  else if (!$("#mRules").hidden) $("#rulesOk").click();
  else if (!$("#mMode").hidden) { if (started) $("#mMode").hidden = true; }
  else if (sel >= 0) { sel = -1; renderBoard(); }
});
$("#btnNew").addEventListener("click", () => {
  if (MODE.vs === "online" && netOpen() && over) { overDismissed = false; return renderOver(); }
  openMode();
});
$("#goNew").addEventListener("click", () => { if (MODE.vs === "online" && netOpen()) return requestRematch(); openMode(); });
$("#goView").addEventListener("click", () => { overDismissed = true; renderOver(); });
$("#btnRules").addEventListener("click", () => { returnToMode = false; openRules(); });
$("#rulesOk").addEventListener("click", () => { $("#mRules").hidden = true; if (returnToMode) { returnToMode = false; openMode(); } });
document.querySelectorAll(".modal").forEach(m => m.addEventListener("mousedown", e => {
  if (e.target !== m || m.id === "mNet" || (m.id === "mMode" && !started)) return;
  if (m.id === "mRules") return $("#rulesOk").click();
  m.hidden = true;
}));
window.addEventListener("resize", fit);

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  applyI18n(); buildDemo(); newGame(true);
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {   // mở từ link mời: vào phòng luôn
    try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
    modeDraft = { ...clone(PREFS), vs: "online", net: "join", code: room };
    startOnline();
  } else openRules();
  if (PREFS.vs === "bot" && PREFS.size === "4") solverFor("4");   // lần trước chơi 4x4 với AI: giải trước
  if (window.TB && TB.closeX) TB.closeX({ "#mRules": "#rulesOk", "#mMode": "#modeCancel", "#mNet": "#netCancel", "#gameover": "#goView" });
  window.game = {   // tiện debug ở console
    get mode() { return MODE; }, get state() { return { XM, OM, turn, over, moves, R }; },
    humanAct, act, aiPick, solverFor, stateHash, rateActions,
  };
})();
</script>
