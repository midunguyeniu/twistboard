/* nút mức: ★/★★/★★★ tô màu chung (vàng, xanh dương, đỏ) như Mật mã, Poker Trí Nhớ; luôn 1 hàng (chủ game chọn 11/2026) */

<script>
"use strict";
/* RULES-START: luật + đọc đề, không đụng DOM (cắt ra chạy bằng Node được).
   Mỗi ô lưới chia 4 tam giác theo 2 đường chéo ("phần tư"): k = 0 trên, 1 phải, 2 dưới, 3 trái.
   Mảnh ghép là danh sách phần tư [hàng, cột, k]; thực tế mỗi ô của mảnh là ô đủ (4 phần tư) hoặc nửa ô cắt chéo (2 phần tư kề nhau),
   nên cạnh mảnh nằm ngang, dọc hoặc chéo 45°. Mặt nạ một ô: bit k bật nếu có phần tư k (1 trên, 2 phải, 4 dưới, 8 trái): f = đủ ô, 3/6/c/9 = nửa ô. */
const SY_LEVELS = ["easy", "normal", "hard"];
const SY_NP = { easy: 3, normal: 4, hard: 5 };            // số mảnh mỗi bộ
const SY_FLIP = { easy: false, normal: false, hard: true };  // được lật mảnh
const SY_SETS = 3;                                          // một lượt chơi = 3 bộ
const SY_DIR = [[0, -1], [1, 0], [0, 1], [-1, 0]];          // hướng [dx, dy] từ tâm ô ra cạnh của phần tư k

function syNorm(q) {   // dời về góc (0,0) và sắp xếp
  let r0 = Infinity, c0 = Infinity;
  for (const x of q) { if (x[0] < r0) r0 = x[0]; if (x[1] < c0) c0 = x[1]; }
  return q.map(([r, c, k]) => [r - r0, c - c0, k]).sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
}
const syRot0 = q => q.map(([r, c, k]) => [c, -r - 1, (k + 1) & 3]);      // xoay 90° theo chiều kim đồng hồ (chưa dời)
const syFlip0 = q => q.map(([r, c, k]) => [r, -c - 1, k & 1 ? k ^ 2 : k]); // lật trái-phải (chưa dời)
/* Hướng o (0-7): lật trước nếu o & 4, rồi xoay (o & 3) lần 90° theo chiều kim đồng hồ. */
function syOrient(q, o) {
  let p = o & 4 ? syFlip0(q) : q;
  for (let i = 0; i < (o & 3); i++) p = syRot0(p);
  return syNorm(p);
}
const syKey = q => q.map(x => x.join(",")).join(";");   // q đã qua syNorm
function sySize(q) { let h = 0, w = 0; for (const [r, c] of q) { if (r + 1 > h) h = r + 1; if (c + 1 > w) w = c + 1; } return { h, w }; }
/* Hai mảnh giống nhau (tính cả xoay, và lật nếu flip) */
function sySame(a, b, flip) {
  const kb = syKey(syNorm(b));
  for (let o = 0; o < (flip ? 8 : 4); o++) if (syKey(syOrient(a, o)) === kb) return true;
  return false;
}

/* Mã hoá một mảnh trong kho đề: "hàng,cột:dòng/dòng" với mỗi ký tự là mặt nạ hex của một ô, hàng,cột là chỗ của mảnh trong lời giải. */
function syDecodePiece(s) {
  const i = s.indexOf(":"), [r0, c0] = s.slice(0, i).split(",").map(Number), q = [];
  s.slice(i + 1).split("/").forEach((row, r) => [...row].forEach((ch, c) => {
    const m = parseInt(ch, 16); for (let k = 0; k < 4; k++) if ((m >> k) & 1) q.push([r0 + r, c0 + c, k]);
  }));
  return q;
}
function syEncodePiece(q) {
  let r0 = Infinity, c0 = Infinity, r1 = -Infinity, c1 = -Infinity;
  for (const [r, c] of q) { r0 = Math.min(r0, r); c0 = Math.min(c0, c); r1 = Math.max(r1, r); c1 = Math.max(c1, c); }
  const g = []; for (let r = r0; r <= r1; r++) g.push(new Array(c1 - c0 + 1).fill(0));
  for (const [r, c, k] of q) g[r - r0][c - c0] |= 1 << k;
  return r0 + "," + c0 + ":" + g.map(row => row.map(m => m.toString(16)).join("")).join("/");
}

/* Kiểm tra hình đang ghép. qs = mọi phần tư [hàng, cột, k] của mọi mảnh (vị trí thật trên bàn).
   Trả về { over: Set khoá các phần tư bị chồng, joined: các phần tư liền một khối (chạm nhau theo cạnh), axis: trục đối xứng hoặc null }. */
const syQK = (r, c, k) => r + "," + c + "," + k;
function syNeighbors(r, c, k) {
  const across = k === 0 ? [r - 1, c, 2] : k === 1 ? [r, c + 1, 3] : k === 2 ? [r + 1, c, 0] : [r, c - 1, 1];
  return [[r, c, (k + 1) & 3], [r, c, (k + 3) & 3], across];
}
function syJoined(qs) {
  if (!qs.length) return false;
  const all = new Set(qs.map(q => syQK(...q))), seen = new Set([syQK(...qs[0])]), st = [qs[0]];
  while (st.length) {
    const q = st.pop();
    for (const n of syNeighbors(...q)) { const key = syQK(...n); if (all.has(key) && !seen.has(key)) { seen.add(key); st.push(n); } }
  }
  return seen.size === all.size;
}
/* Trục đối xứng gương của tập phần tư (không trùng). Toạ độ nhân đôi: tâm ô (2c+1, 2r+1).
   Kết quả { t, s }: t = "v" trục dọc x = s/4 (đơn vị ô), "h" trục ngang y = s/4, "d" đường chéo y = x - s/2, "a" đường chéo y = -x + s/2. */
function syAxis(qs) {
  if (!qs.length) return null;
  const pts = qs.map(([r, c, k]) => [2 * c + 1, 2 * r + 1, SY_DIR[k][0], SY_DIR[k][1]]);
  const key = (x, y, dx, dy) => x + "," + y + "," + dx + "," + dy;
  const base = new Set(pts.map(p => key(...p)));
  let mnx = Infinity, mny = Infinity; for (const p of pts) { mnx = Math.min(mnx, p[0]); mny = Math.min(mny, p[1]); }
  const M = [["v", (x, y) => [-x, y]], ["h", (x, y) => [x, -y]], ["d", (x, y) => [y, x]], ["a", (x, y) => [-y, -x]]];
  for (const [t, f] of M) {
    const m = pts.map(([x, y, dx, dy]) => [...f(x, y), ...f(dx, dy)]);
    let ax = Infinity, ay = Infinity; for (const p of m) { ax = Math.min(ax, p[0]); ay = Math.min(ay, p[1]); }
    const sx = mnx - ax, sy = mny - ay;
    if (m.every(([x, y, dx, dy]) => base.has(key(x + sx, y + sy, dx, dy)))) return { t, s: t === "h" ? sy : sx };
  }
  return null;
}
function syCheck(qs) {
  const seen = new Set(), over = new Set(), uniq = [];
  for (const q of qs) { const key = syQK(...q); if (seen.has(key)) over.add(key); else { seen.add(key); uniq.push(q); } }
  const joined = syJoined(uniq);
  return { over, joined, axis: !over.size && joined ? syAxis(uniq) : null };
}

/* Đường viền của một tập phần tư (dùng để vẽ): giữ các cạnh tam giác không dùng chung, nối thành các vòng, gộp đoạn thẳng hàng.
   Trả về chuỗi path SVG theo đơn vị ô (góc ô là số nguyên). Vẽ với fill-rule evenodd nên lỗ thủng (nếu có) vẫn đúng. */
function syOutline(q) {
  const cnt = new Map(), P = (x, y) => x + "," + y;
  const add = (a, b) => { const k = a < b ? a + "|" + b : b + "|" + a; cnt.set(k, (cnt.get(k) || 0) + 1); };
  for (const [r, c, k] of q) {
    const TL = P(2 * c, 2 * r), TR = P(2 * c + 2, 2 * r), BR = P(2 * c + 2, 2 * r + 2), BL = P(2 * c, 2 * r + 2), C = P(2 * c + 1, 2 * r + 1);
    const [a, b] = k === 0 ? [TL, TR] : k === 1 ? [TR, BR] : k === 2 ? [BR, BL] : [BL, TL];
    add(a, b); add(b, C); add(C, a);
  }
  const adj = new Map();
  for (const [k, n] of cnt) if (n === 1) { const [a, b] = k.split("|"); for (const [x, y] of [[a, b], [b, a]]) { if (!adj.has(x)) adj.set(x, []); adj.get(x).push(y); } }
  const used = new Set(), ek = (a, b) => a < b ? a + "|" + b : b + "|" + a, xy = s => s.split(",").map(Number);
  let d = "";
  for (const [start, list] of adj) for (const first of list) {
    if (used.has(ek(start, first))) continue;
    const pts = [start]; let prev = start, cur = first; used.add(ek(start, first));
    while (cur !== start) {
      pts.push(cur);
      const nx = adj.get(cur).find(n => !used.has(ek(cur, n)));
      if (nx === undefined) break;
      used.add(ek(cur, nx)); prev = cur; cur = nx;
    }
    const v = pts.map(xy), out = [];
    for (let i = 0; i < v.length; i++) {   // bỏ điểm nằm giữa hai đoạn thẳng hàng
      const a = v[(i - 1 + v.length) % v.length], b = v[i], cc = v[(i + 1) % v.length];
      if ((b[0] - a[0]) * (cc[1] - b[1]) - (b[1] - a[1]) * (cc[0] - b[0]) !== 0) out.push(b);
    }
    d += "M" + out.map(([x, y]) => x / 2 + " " + y / 2).join("L") + "Z";
  }
  return d;
}

/* Dựng đề từ kho: bank = chuỗi các mảnh cách nhau dấu cách. tf (0-7) xoay/lật cả lời giải để thêm biến thể
   (lật cả hình thì các mảnh cũng lật theo, nên đề không cần lật mảnh vẫn giải được). oris = hướng ban đầu của từng mảnh. */
function syPuzzle(level, idx, tf, oris) {
  const parts = SY_BANK[level][idx].split(" ").map(syDecodePiece).map(p => {
    let q = tf & 4 ? syFlip0(p) : p;
    for (let i = 0; i < (tf & 3); i++) q = syRot0(q);
    return q;
  });
  let r0 = Infinity, c0 = Infinity;
  for (const p of parts) for (const [r, c] of p) { r0 = Math.min(r0, r); c0 = Math.min(c0, c); }
  const pieces = parts.map((p, i) => {
    let pr = Infinity, pc = Infinity; for (const [r, c] of p) { pr = Math.min(pr, r); pc = Math.min(pc, c); }
    return { q: syNorm(p), at: [pr - r0, pc - c0], o: oris[i] || 0 };
  });
  return { level, idx, tf, flip: SY_FLIP[level], pieces };
}
function syGen(level, rng) {
  const lv = SY_LEVELS.includes(level) ? level : "normal", bank = SY_BANK[lv];
  const idx = Math.floor(rng() * bank.length), tf = Math.floor(rng() * 8), n = bank[idx].split(" ").length, oris = [];
  for (let i = 0; i < n; i++) oris.push(Math.floor(rng() * 4) + (SY_FLIP[lv] && rng() < .5 ? 4 : 0));
  return syPuzzle(lv, idx, tf, oris);
}
/* Một lượt chơi: SY_SETS bộ khác nhau cùng mức (như bản gốc: chuyển qua lại giữa các bộ, xong cả 3 mới tính). */
function syRound(level, rng) {
  const sets = [], used = new Set();
  for (let guard = 0; sets.length < SY_SETS && guard < 50; guard++) {
    const pz = syGen(level, rng);
    if (used.has(pz.idx)) continue;
    used.add(pz.idx); sets.push(pz);
  }
  return { level: sets[0].level, flip: sets[0].flip, sets };
}
/* RULES-END */

/* ---------- VẼ + ĐIỀU KHIỂN ---------- */
/* Mỗi bộ một màu (chủ game chọn): mọi mảnh trong bộ cùng màu, viền đậm hơn một chút cùng tông để vẫn nhìn ra từng mảnh. [màu, màu đậm, màu viền] */
const SY_PALETTE = [["#58b77a", "#2d7d4c", "#3f9a60"], ["#4d9de0", "#256aa8", "#3584c8"], ["#ec6fa0", "#b03d6c", "#d24f86"], ["#a77bd6", "#6f48a0", "#8d60c2"], ["#e5534b", "#a8302a", "#c93c35"], ["#f08a5d", "#b8512a", "#d86f41"]];
const svgNS = "http://www.w3.org/2000/svg";
const HOLD_MS = 280;   // giữ lâu hơn mức này rồi thả (không kéo) thì không tính là chạm để xoay
let SV = null;   // bàn đang hiện (khung nhắc đọc tình trạng)
/* Đoạn trục đối xứng (đơn vị ô) cắt qua khung bao của hình, dư mỗi đầu 0,6 ô */
function syAxisLine(axis, qs) {
  let r0 = Infinity, c0 = Infinity, r1 = -Infinity, c1 = -Infinity;
  for (const [r, c] of qs) { r0 = Math.min(r0, r); c0 = Math.min(c0, c); r1 = Math.max(r1, r + 1); c1 = Math.max(c1, c + 1); }
  const m = .6, s = axis.s;
  if (axis.t === "v") return [s / 4, r0 - m, s / 4, r1 + m];
  if (axis.t === "h") return [c0 - m, s / 4, c1 + m, s / 4];
  // đường chéo: lấy hai điểm ở hai cạnh khung bao rồi kéo dài thêm
  const f = axis.t === "d" ? x => x - s / 2 : x => -x + s / 2, inv = axis.t === "d" ? y => y + s / 2 : y => s / 2 - y;
  const xs = [c0, c1, inv(r0), inv(r1)].sort((a, b) => a - b), xa = xs[1], xb = xs[2], k = m / Math.SQRT2;
  const dir = axis.t === "d" ? 1 : -1;
  return [xa - k, f(xa) - k * dir, xb + k, f(xb) + k * dir];
}
/* Một mảnh trong bàn nhỏ (thẻ luật, ảnh minh hoạ): q = phần tư, at = [hàng, cột], màu thứ i */
function syPieceSvg(q, at, i, extra = "") {
  const [f, k] = SY_PALETTE[i % SY_PALETTE.length];
  return `<g class="sy-pc" style="--pc:${f};--pk:${k}" transform="translate(${at[1]} ${at[0]})"${extra}><g class="sy-in"><path d="${syOutline(q)}"/></g></g>`;
}

/* Một bàn (một bộ mảnh) trong khung host. hooks.won() khi bộ này vừa đối xứng, hooks.change() sau mỗi thao tác. Bộ đã xong thì khoá. */
function syBoard(host, pz, ctx, W, H, narrow, hooks, color) {
  const M = .35;
  const P = pz.pieces.map((p, i) => ({ i, q: p.q, o: p.o, cur: null, h: 0, w: 0, pos: [0, 0], el: null, inEl: null }));
  const setGeom = (p, o) => { p.o = o; p.cur = syOrient(p.q, o); const z = sySize(p.cur); p.h = z.h; p.w = z.w; };
  P.forEach(p => setGeom(p, p.o));
  let sel = -1, won = false, status = { over: 0, joined: 0, cluster: 1, axis: null }, start = null;
  const can = () => ctx.canPlay() && !won;

  /* Xếp ban đầu (chủ game chọn, như bản gốc): các mảnh xếp hàng ngang sát đáy bàn, canh đáy, cách đều nhau, phần trên để trống cho việc ghép.
     Một hàng không đủ chỗ (mỗi mảnh cách nhau ít nhất 1 ô) thì xếp thêm hàng phía trên. Không xếp được thì dùng cách rải cũ (layoutSpread). */
  function layout() {
    const rows = [[]];
    let used = 0;
    for (const p of P) {
      const row = rows[rows.length - 1];
      if (row.length && used + 1 + p.w > W) { rows.push([p]); used = p.w; }   // giữa hai mảnh ít nhất 1 ô
      else { row.push(p); used += (row.length > 1 ? 1 : 0) + p.w; }
    }
    let base = H;   // đáy của hàng đang xếp
    for (const row of rows) {
      const rh = Math.max(...row.map(p => p.h)), tot = row.reduce((a, p) => a + p.w, 0), n = row.length;
      const gap = Math.max(1, (W - tot) / (n + 1));   // cách đều cả hai mép; chật thì giữa hai mảnh vẫn tối thiểu 1 ô
      if (base - rh < 0) return layoutSpread();
      let x = (W - tot - gap * (n - 1)) / 2;
      for (const p of row) { p.pos = [base - p.h, Math.round(x)]; x += p.w + gap; }
      base -= rh + 1;
    }
  }
  /* Cách rải dự phòng: mảnh lớn trước, mỗi mảnh chọn chỗ trống cách các mảnh khác ít nhất 1 ô và càng xa các mảnh đã đặt càng tốt. */
  function layoutSpread() {
    const occ = new Uint8Array(W * H), centers = [];
    const cellsOf = p => [...new Set(p.cur.map(([r, c]) => r * 1000 + c))].map(v => [Math.floor(v / 1000), v % 1000]);
    const order = [...P].sort((a, b) => b.q.length - a.q.length);
    for (const p of order) {
      const cells = cellsOf(p);
      let best = null, bv = -Infinity;
      for (const gap of [1, 0]) {
        for (let r = 0; r + p.h <= H; r++) for (let c = 0; c + p.w <= W; c++) {
          let ok = true;
          for (const [cr, cc] of cells) {
            for (let dr = -gap; dr <= gap && ok; dr++) for (let dc = -gap; dc <= gap && ok; dc++) {
              const rr = r + cr + dr, c2 = c + cc + dc;
              if (rr >= 0 && c2 >= 0 && rr < H && c2 < W && occ[rr * W + c2]) ok = false;
            }
            if (!ok) break;
          }
          if (!ok) continue;
          const cy = r + p.h / 2, cx = c + p.w / 2;
          let v = centers.length ? Math.min(...centers.map(([y, x]) => Math.hypot(y - cy, x - cx))) : 0;
          v += Math.random() * 1.5;
          if (v > bv) { bv = v; best = [r, c]; }
        }
        if (best) break;
      }
      if (!best) best = [Math.floor(Math.random() * (H - p.h + 1)), Math.floor(Math.random() * (W - p.w + 1))];
      p.pos = best; centers.push([best[0] + p.h / 2, best[1] + p.w / 2]);
      for (const [cr, cc] of cells) occ[(best[0] + cr) * W + best[1] + cc] = 1;
    }
  }
  layout();
  start = P.map(p => ({ o: p.o, pos: p.pos.slice() }));

  host.innerHTML = `<svg class="sy-svg off" viewBox="${-M} ${-M} ${W + 2 * M} ${H + 2 * M}"
    style="aspect-ratio:${W + 2 * M}/${H + 2 * M};width:min(100%, calc((100vh - ${narrow ? 300 : 285}px) * ${(W + 2 * M) / (H + 2 * M)}))">
    <g class="sy-pcs"></g><line class="sy-axis" x1="0" y1="0" x2="0" y2="0"/></svg>`;
  const svg = host.querySelector("svg"), layer = svg.querySelector(".sy-pcs"), axisEl = svg.querySelector(".sy-axis");
  for (const p of P) {
    const g = document.createElementNS(svgNS, "g"); g.setAttribute("class", "sy-pc"); g.style.setProperty("--pc", color[0]); g.style.setProperty("--pk", color[2]); g.dataset.i = p.i;   // viền đậm hơn cùng tông: nhìn ra từng mảnh (chủ game chọn)
    const inner = document.createElementNS(svgNS, "g"); inner.setAttribute("class", "sy-in");
    const sh = document.createElementNS(svgNS, "path"); sh.setAttribute("class", "sy-sh"); sh.setAttribute("transform", "translate(.17 .17)");
    inner.appendChild(sh); inner.appendChild(document.createElementNS(svgNS, "path"));
    inner.addEventListener("animationend", () => inner.classList.remove("spin", "spinb", "flip"));   // gỡ ngay, không thì đưa mảnh lên trên cùng sẽ chạy lại hiệu ứng
    g.appendChild(inner); layer.appendChild(g); p.el = g; p.inEl = inner;
  }
  const place = p => { p.el.style.transform = `translate(${p.pos[1]}px, ${p.pos[0]}px)`; };
  const drawPiece = p => { const d = syOutline(p.cur); for (const el of p.inEl.children) el.setAttribute("d", d); place(p); };
  const anim = (p, cls) => { p.inEl.classList.remove("spin", "spinb", "flip"); p.inEl.getBoundingClientRect(); p.inEl.classList.add(cls); };
  P.forEach(drawPiece);

  const allQ = () => [].concat(...P.map(p => p.cur.map(([r, c, k]) => [r + p.pos[0], c + p.pos[1], k])));
  /* Số mảnh lớn nhất đang liền nhau (để báo tiến độ) */
  function biggestCluster() {
    const own = new Map();
    P.forEach(p => { for (const [r, c, k] of p.cur) own.set(syQK(r + p.pos[0], c + p.pos[1], k), p.i); });
    const adj = P.map(() => new Set());
    P.forEach(p => { for (const [r, c, k] of p.cur) for (const n of syNeighbors(r + p.pos[0], c + p.pos[1], k)) { const j = own.get(syQK(...n)); if (j !== undefined && j !== p.i) adj[p.i].add(j); } });
    let best = 0; const seen = new Set();
    for (const p of P) if (!seen.has(p.i)) {
      let n = 0; const st = [p.i]; seen.add(p.i);
      while (st.length) { const i = st.pop(); n++; for (const j of adj[i]) if (!seen.has(j)) { seen.add(j); st.push(j); } }
      best = Math.max(best, n);
    }
    return best;
  }
  function evaluate() {
    const qs = allQ(), chk = syCheck(qs), overP = new Set();
    if (chk.over.size) P.forEach(p => { for (const [r, c, k] of p.cur) if (chk.over.has(syQK(r + p.pos[0], c + p.pos[1], k))) { overP.add(p.i); break; } });
    P.forEach(p => p.el.classList.toggle("ov", overP.has(p.i)));
    status = { over: overP.size, joined: chk.joined, cluster: biggestCluster(), axis: chk.axis };
    if (chk.axis && can()) {
      won = true; sel = -1; showAxis(chk.axis, qs); paintSel(); svg.classList.add("won", "off");
      hooks.won();
    }
    hooks.change();
  }
  function showAxis(axis, qs) {
    const [x1, y1, x2, y2] = syAxisLine(axis, qs);
    axisEl.setAttribute("x1", x1); axisEl.setAttribute("y1", y1); axisEl.setAttribute("x2", x2); axisEl.setAttribute("y2", y2);
    axisEl.classList.add("on");
  }
  const paintSel = () => P.forEach(p => p.el.classList.toggle("sel", pz.flip && p.i === sel));
  const clampPos = (p, r, c) => [Math.max(0, Math.min(H - p.h, r)), Math.max(0, Math.min(W - p.w, c))];
  const toFront = p => layer.appendChild(p.el);

  /* xoay / lật quanh tâm mảnh */
  function turn(p, how) {
    const cy = p.pos[0] + p.h / 2, cx = p.pos[1] + p.w / 2, n = p.o & 3, f = p.o & 4;
    const o = how === "cw" ? f | ((n + 1) & 3) : how === "ccw" ? f | ((n + 3) & 3) : (f ^ 4) | ((4 - n) & 3);
    setGeom(p, o);
    p.pos = clampPos(p, Math.round(cy - p.h / 2), Math.round(cx - p.w / 2));
    p.el.classList.add("drag"); drawPiece(p); void p.el.getBoundingClientRect(); p.el.classList.remove("drag");
    anim(p, how === "cw" ? "spin" : how === "ccw" ? "spinb" : "flip");
    ctx.sfx("step"); evaluate();
  }
  function flipSel() {
    if (!can() || !pz.flip) return;
    if (sel < 0) { ctx.note(ctx.tr("f_pick"), "bad"); return; }
    ctx.note(""); turn(P[sel], "flip");
  }
  function reset() {
    if (!can()) return;
    P.forEach((p, i) => { setGeom(p, start[i].o); p.pos = start[i].pos.slice(); drawPiece(p); });
    sel = -1; paintSel(); evaluate();
  }

  /* kéo thả + chạm */
  function toBoard(ev) {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
    const q = pt.matrixTransform(m.inverse()); return { x: q.x, y: q.y };
  }
  let drag = null;
  svg.addEventListener("contextmenu", e => e.preventDefault());
  svg.addEventListener("pointerdown", e => {
    if (!can() || drag || (e.button !== 0 && e.button !== 2)) return;
    const g = e.target.closest(".sy-pc"); if (!g) return;
    e.preventDefault();
    const p = P[+g.dataset.i], b = toBoard(e);
    drag = { p, id: e.pointerId, x0: b.x, y0: b.y, r0: p.pos[0], c0: p.pos[1], moved: false, right: e.button === 2, t0: performance.now() };
    drag.hold = setTimeout(() => { if (drag && drag.p === p) p.el.classList.add("held"); }, HOLD_MS);   // giữ yên: nhấc mảnh lên, thả ra không xoay
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    toFront(p); sel = p.i; paintSel();
  });
  svg.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const b = toBoard(e), dx = b.x - drag.x0, dy = b.y - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < .22) return;
    drag.moved = true; drag.p.el.classList.add("drag", "held");
    drag.p.el.style.transform = `translate(${drag.c0 + dx}px, ${drag.r0 + dy}px)`;
    drag.dx = dx; drag.dy = dy;
  });
  function endDrag(cancel) {
    if (!drag) return;
    const d = drag, p = d.p; drag = null;
    clearTimeout(d.hold); p.el.classList.remove("held");
    p.el.classList.remove("drag");
    if (!can()) { place(p); return; }
    if (d.moved) {
      if (!cancel) p.pos = clampPos(p, Math.round(d.r0 + d.dy), Math.round(d.c0 + d.dx));
      place(p); ctx.sfx("step"); evaluate();
    } else if (!cancel && performance.now() - d.t0 < HOLD_MS) turn(p, d.right ? "ccw" : "cw");   // chỉ chạm nhanh mới xoay
  }
  svg.addEventListener("pointerup", e => { if (drag && e.pointerId === drag.id) endDrag(false); });
  svg.addEventListener("pointercancel", e => { if (drag && e.pointerId === drag.id) endDrag(true); });

  evaluate();

  return {
    pz, P, W, H, flipSel, reset, get status() { return status; }, get won() { return won; },
    start() { if (!won) svg.classList.remove("off"); },
    reveal() {   // hết đề mà chưa ghép xong: các mảnh tự trượt về một cách ghép đúng
      drag = null; sel = -1; paintSel(); svg.classList.add("off"); ctx.note("");
      if (won) return;
      let sh = 0, sw = 0; for (const p of pz.pieces) { const z = sySize(p.q); sh = Math.max(sh, p.at[0] + z.h); sw = Math.max(sw, p.at[1] + z.w); }
      const or = Math.max(0, Math.floor((H - sh) / 2)), oc = Math.max(0, Math.floor((W - sw) / 2));
      P.forEach((p, i) => {
        p.el.classList.add("slow"); p.el.classList.remove("ov");
        setGeom(p, 0); p.pos = [pz.pieces[i].at[0] + or, pz.pieces[i].at[1] + oc]; drawPiece(p);
      });
      const qs = allQ(), ax = syAxis(qs);
      if (ax) setTimeout(() => showAxis(ax, qs), 650);
      status = { over: 0, joined: true, cluster: P.length, axis: ax, shown: true };
    },
    key(e) {
      if (!can()) return;
      const k = e.key.toLowerCase();
      if (k === "f" && pz.flip) { e.preventDefault(); flipSel(); }
      else if ((k === "r" || k === " ") && sel >= 0) { e.preventDefault(); turn(P[sel], e.shiftKey ? "ccw" : "cw"); }
    },
  };
}

/* Một lượt = 3 bộ (như bản gốc): thanh 1-2-3 phía trên bàn để chuyển bộ bất cứ lúc nào, bộ xong có dấu ✓ và bị khoá.
   Xong cả 3 bộ mới tính là giải xong. */
function mountSY(el, R, ctx) {
  const narrow = window.innerWidth < 600, W = narrow ? 9 : 14, H = narrow ? 12 : 9, n = R.sets.length;
  const colors = SY_PALETTE.slice(); for (let i = colors.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [colors[i], colors[j]] = [colors[j], colors[i]]; }   // 3 bộ, 3 màu khác nhau
  el.innerHTML = `<div class="sy"><div class="sy-tabs">${R.sets.map((_, i) => `<button type="button" class="sy-tab" data-i="${i}" style="--tc:${colors[i][0]};--tk:${colors[i][1]}"><b>${i + 1}</b></button>`).join("")}</div><div class="sy-boards"></div></div>`;
  const tabs = [...el.querySelectorAll(".sy-tab")], wrap = el.querySelector(".sy-boards");
  let cur = 0, ready = false;
  const boxes = R.sets.map(() => { const d = document.createElement("div"); d.className = "sy-board"; wrap.appendChild(d); return d; });
  const solvedN = () => B.filter(b => b.won).length;
  function paintTabs() {
    tabs.forEach((t, i) => {
      const ok = !!(B[i] && B[i].won);
      t.classList.toggle("on", i === cur); t.classList.toggle("ok", ok); t.firstChild.textContent = ok ? "✓" : i + 1;
      t.setAttribute("aria-label", ctx.tr("tab_set", i + 1) + (B[i] && B[i].won ? " ✓" : ""));
    });
  }
  function show(i) {
    cur = i; boxes.forEach((b, j) => { b.hidden = j !== i; });
    paintTabs(); ctx.note(""); ctx.prompt();
  }
  function onWon(i) {
    if (!ready) return;
    paintTabs();
    if (solvedN() === n) return ctx.solved();
    ctx.sfx("ok");
    setTimeout(() => {   // tự chuyển sang bộ chưa xong kế tiếp
      if (cur !== i || !ctx.canPlay()) return;
      for (let k = 1; k <= n; k++) { const j = (i + k) % n; if (!B[j].won) return show(j); }
    }, 900);
  }
  const B = R.sets.map((pz, i) => syBoard(boxes[i], pz, ctx, W, H, narrow, { won: () => onWon(i), change: () => { if (ready) { ctx.progress(solvedN()); if (i === cur) ctx.prompt(); paintTabs(); } } }, colors[i]));
  ready = true;
  tabs.forEach((t, i) => t.addEventListener("click", () => { if (i !== cur) { ctx.sfx("step"); show(i); } }));
  const tools = [];
  if (R.flip) tools.push({ id: "flip", label: "t_flip", on: () => B[cur].flipSel() });
  tools.push({ id: "reset", label: "t_reset", on: () => B[cur].reset() });
  tools.push({ id: "giveup", label: "t_giveup", confirm: "t_giveup_sure", cls: "danger wide", on: () => ctx.giveUp() });
  ctx.tools(tools);
  SV = { R, B, n, W, H, show, get cur() { return cur; }, get solved() { return solvedN(); },
    get pz() { return B[cur].pz; }, get P() { return B[cur].P; }, get status() { return B[cur].status; }, get won() { return B[cur].won; } };
  show(0);
  return {
    start() { B.forEach(b => b.start()); },
    reveal() { B.forEach(b => b.reveal()); ctx.note(""); paintTabs(); ctx.prompt(); },
    destroy() { SV = null; },
    key(e) {
      if (/^[1-9]$/.test(e.key) && +e.key <= n) { e.preventDefault(); show(+e.key - 1); return; }
      B[cur].key(e);
    },
  };
}

/* ---------- THẺ LUẬT CHƠI ---------- */
// Hình mẫu: ngôi nhà mái nhọn, đối xứng qua trục dọc giữa 2 cột.

const SYR_B = [[0, 1, 2], [0, 1, 3], [1, 1, 0], [1, 1, 1], [1, 1, 2], [1, 1, 3], [2, 1, 0], [2, 1, 1], [2, 1, 2], [2, 1, 3]];

function syrBoard(w, h, list, opt = {}) {

  return `<svg viewBox="${-m} ${-m} ${w + 2 * m} ${h + 2 * m}" width="${(w + 2 * m) * s}" height="${(h + 2 * m) * s}">${g}</svg>`;
}

  { h: "c2_h", p: "c2_p", fig: () => `<div class="syr">
      <div>${syrBoard(2, 3, [[SYR_A, [0, 0], 0], [SYR_B, [0, 1], 1], [SYR_C, [2, 0], 2]], { size: 21, axis: [1, -.25, 1, 3.25] })}<span class="syr-tag ok">✓</span></div>
      <div>${syrBoard(3, 3, [[SYR_A, [0, 0], 0], [SYR_B, [0, 1], 1], [SYR_C, [2, 2], 2]], { size: 21 })}<span class="syr-tag no">✗</span></div></div>` },
  { h: "c3_h", p: "c3_p", fig: () => `<div class="syr">${syrBoard(1, 3, [[SYR_B, [0, 0], 1]], { size: 30 })}<span class="syr-arrow">↻</span>
      ${syrBoard(3, 1, [[syOrient(SYR_B, 1), [0, 0], 1]], { size: 30 })}</div>` },
];

PK.start({

      h_rules: "Luật", h_ctrl: "Cách chơi", h_solo: "Chơi một mình", h_online: "Online 2 người", h_tips: "Mẹo",
