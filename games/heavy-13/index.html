<!DOCTYPE html>
<html lang="vi" data-tb-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heavy 13 · Twistboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cinzel:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/platform.css">
<script src="../../assets/platform.js"></script>
<style>
:root{
  --bg:var(--tb-bg); --panel:var(--tb-surface); --line:var(--tb-border); --text:var(--tb-text); --muted:var(--tb-muted);
  --btn:#fff; --btn-hover:var(--tb-hover); --btn-line:var(--tb-border-strong); --field:var(--tb-surface-2); --gold:#ffc928; --gold-ink:var(--tb-gold-ink);
  /* bàn chơi: giấy trắng, mực đen, nét khắc như tấm bảng trong show; 3 tượng đỡ cân chỉ khác màu */
  --cream:#f7f6f1; --cream-2:#ebe8df; --sand:#dedad0; --ink:#262421; --ink-2:#57534b; --wood:#6f6a60;
  --c0:#dc5149; --c1:#3f8a55; --c2:#4a5cc0; --pen:#c0392b; --ok:#2e8b4a;
  --serif:"Cinzel",Georgia,"Times New Roman",serif;
  /* --ps: cỡ khúc cột trên cân = cỡ khúc cột vẽ trên lá bài của mình; --chip: cỡ chip ở ô người chơi = chip của mình */
  --ps:38px; --chip:32px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--tb-font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;transition:transform .12s ease-out,background-color .15s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.95)}
#app{max-width:1200px;margin:0 auto;padding:14px 14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--tb-font-brand);font-size:26px;line-height:1.1}
.brand span{color:var(--muted);font-size:13.5px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--text);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--tb-primary);color:var(--tb-primary-ink);border-color:transparent}
.btn.primary:hover{background:var(--tb-primary-hover)}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
#side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card2{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--tb-shadow)}
.h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.h3 span{color:var(--muted);letter-spacing:0;text-transform:none}
.note{color:var(--muted);font-size:12.5px}

/* ---------- BÀN CHƠI: giấy trắng, viền có nét gạch toả ra như tranh khắc ---------- */
#board{position:relative;width:100%;max-width:none;margin:0 auto;border-radius:18px;overflow:hidden;color:var(--ink);user-select:none;-webkit-user-select:none;
  background:var(--cream);border:1.5px solid #cfcac0;box-shadow:var(--tb-shadow)}
#board::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(38,36,33,.2) 0 .35deg,transparent .35deg 1.6deg);
  -webkit-mask:radial-gradient(ellipse 75% 70% at 50% 42%,transparent 62%,#000 100%);mask:radial-gradient(ellipse 75% 70% at 50% 42%,transparent 62%,#000 100%)}
#board > *{position:relative;z-index:1}

/* ---------- 3 CÂN: thanh 1-13 trên cùng, cột đá xếp chồng, bệ đá màu, tượng lực sĩ quỳ đỡ ---------- */
#stands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 0}
.stand{--sc:var(--c0);--sd:color-mix(in srgb,var(--sc) 62%,#111);--sl:color-mix(in srgb,var(--sc) 30%,#fff);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:default;position:relative;border-radius:14px;padding:4px 2px 2px;transition:background-color .2s;min-width:0}
.stand.s1{--sc:var(--c1)} .stand.s2{--sc:var(--c2)}
/* xếp cột: mỗi tầng 3 chỗ, thứ tự giữa → trái → phải, đầy tầng thì lên tầng trên (chủ game chốt) */
.stack{--rh:calc(var(--ps) * 64 / 60 * .93);position:relative;z-index:1;margin-bottom:-2px;width:calc(var(--ps) * 3 + 4px);height:calc(var(--tiers,1) * var(--rh) + var(--ps) * .07);min-height:calc(var(--rh) * 3 + var(--ps) * .07)}
.stack .rock{position:absolute;margin:0;left:calc(var(--col) * (var(--ps) + 2px));bottom:calc(var(--tier) * var(--rh))}
.slab{position:relative;width:calc(min(100%,210px) * .74);height:30px;border:2px solid var(--ink);border-radius:3px 3px 6px 6px;z-index:2;display:flex;align-items:center;justify-content:center;gap:2px;color:#fff;
  background:linear-gradient(var(--sd) 0 4px,var(--sc) 4px calc(100% - 5px),var(--sd) calc(100% - 5px)),var(--sc);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.slab b{position:relative;font-family:var(--serif);font-weight:900;font-size:21px;margin-top:3px;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.slab small{position:relative;font-family:var(--serif);font-weight:700;font-size:11px;opacity:.85;margin-top:5px}
.slab .bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.35)}}
.atlas{display:block;width:min(100%,210px);aspect-ratio:200/172;margin-top:-3px;transform-origin:50% 100%}
.stand.hot .atlas{animation:strain .11s linear infinite alternate}
@keyframes strain{0%{transform:translateX(-1.6px) rotate(-.6deg) scaleY(.99)}50%{transform:translateX(.4px) rotate(.2deg) scaleY(1)}100%{transform:translateX(1.6px) rotate(.6deg) scaleY(.995)}}
/* vạch run hai bên tượng: chỉ hiện khi cân sắp chạm 13, hai nhóm vạch thay nhau ẩn hiện */
.atlas .shk{display:none;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.stand.hot .atlas .shk{display:inline}
.atlas .shk .a{animation:shk .36s steps(1) infinite}
.atlas .shk .b{animation:shk .36s steps(1) infinite -.18s}
@keyframes shk{0%{opacity:1}50%{opacity:0}}
.stand.crash .atlas .shk{display:none}
.stand.hot .slab{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 0 0 4px rgba(220,60,45,.25)}
/* đang nhắm một cân (chọn chip màu / tới lượt đặt / chọn cân cho chip cầu vồng): 2 cân còn lại tối mờ đi */
.stand{transition:background-color .2s,opacity .25s,filter .25s}
.stand.dim{opacity:.55;filter:brightness(.5) saturate(.6)}
.stand.pickable{cursor:pointer}
.stand.pickable:hover{background:rgba(38,36,33,.05)}
/* chồng cột + bệ là một khối: nhún cùng nhau */
.load{display:flex;flex-direction:column;align-items:center;width:100%;position:relative;z-index:2}
.stand.pickable .load{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-3px)}}
.stand.chosen .load{animation:none}

/* cột đá: mọi khúc cột cùng một cỡ, số trên đầu cột */
.rock{width:var(--ps);height:calc(var(--ps) * 64 / 60);display:block;flex:none;margin-top:calc(var(--ps) * -.07)}
.rock svg,.rc svg{display:block;width:100%;height:100%;overflow:visible}
.rock.new{animation:land .42s cubic-bezier(.3,1.5,.5,1) var(--ld,0ms) both}
@keyframes land{0%{opacity:0;transform:translateY(-16px) scale(.8)}100%{opacity:1;transform:none}}
.rock.fly{position:fixed;left:0;top:0;margin:0;z-index:80;pointer-events:none}
.colnum{font-family:var(--serif);font-weight:900;font-size:13px;fill:#262421;text-anchor:middle}

/* ---------- NGƯỜI CHƠI ---------- */
#players{display:grid;grid-template-columns:repeat(var(--np,4),minmax(0,1fr));gap:8px;padding:14px 14px 4px}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px 8px;border-radius:12px;background:rgba(255,255,255,.9);border:2px solid #d8d4ca;min-width:0;cursor:default;transition:border-color .2s,background-color .2s,opacity .2s}
.pl.me{background:#fffbea}
.pl.cur{border-color:var(--ink);background:#fffdf6;box-shadow:0 0 0 3px rgba(43,33,24,.15);animation:turnp 1.2s ease-in-out infinite}
@keyframes turnp{50%{box-shadow:0 0 0 3px rgba(43,33,24,.03)}}
.pl.done{opacity:.6}
.ph{display:flex;align-items:center;gap:5px;max-width:100%;min-width:0}
.ph b{font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.av{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:11.5px;font-family:var(--tb-font-brand);position:relative}
.av .bot{position:absolute;right:-5px;bottom:-4px;width:13px;height:13px;border-radius:50%;background:#1d2330;display:grid;place-items:center}
.av .bot svg{width:9px;height:9px;color:#fff}
.av .bot.lv-easy{background:#e8b000} .av .bot.lv-medium{background:#3d8bff} .av .bot.lv-hard{background:#d9362b}
.ord{position:absolute;left:-7px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;border:2px solid #fff;z-index:2}
.ord.gone{background:var(--ok)}
.pp{display:flex;align-items:center;gap:5px;min-height:46px}
.pp .rc{--cw:28px}
.pp .chip,#mChips .chip{--cs:var(--chip)}
.pp .wait{font-size:20px;color:#a9a397;font-weight:900;letter-spacing:2px}
.pn{font-family:var(--tb-font-brand);font-weight:800;font-size:17px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pn.has{color:var(--pen)}
.pn.pop{animation:bump .5s ease-out}
.tbk{font-family:var(--serif);position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9.5px;font-weight:900;padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.03em}
.ptag{position:absolute;top:-9px;right:-4px;font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:999px;background:#e0682b;color:#fff;white-space:nowrap}
.ptag.ok{background:var(--ok)}
.pl.flip .pp .chip{animation:flipin .4s ease-out var(--fd0,0ms) both}
.pl.flip .pp .rc{animation:flipin .4s ease-out var(--fd1,450ms) both}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:none}}

/* lá đá (bài): mặt trước số to + hình khúc cột, mặt sau hoạ tiết xanh rêu (chủ game gửi mẫu) */
.rc{--cw:52px;width:var(--cw);height:calc(var(--cw) * 92 / 60);display:inline-block;flex:none;position:relative;transition:transform .12s,opacity .15s;filter:drop-shadow(0 2px 0 rgba(38,36,33,.35))}
.cardnum{font-family:var(--serif);font-weight:900;font-size:25px;fill:#262421;text-anchor:middle}
.cardnum.sm{font-size:8.5px}
.rc.used{opacity:.18;filter:grayscale(1)}
.rc.sel{transform:translateY(-7px)}
.rc.sel::after{content:"";position:absolute;left:8%;right:8%;bottom:-7px;height:4px;border-radius:3px;background:var(--ink)}
.rc.ok::before{content:"✓";position:absolute;right:-6px;top:-7px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:1.5px solid #fff;font-family:var(--tb-font);z-index:1}

/* chip: tròn màu, hình trắng ở giữa (đỏ ●, xanh lá ◆, xanh dương ▲, cầu vồng ★) cho người khó phân biệt màu */
.chip{--cs:34px;width:var(--cs);height:var(--cs);border-radius:50%;display:inline-grid;place-items:center;flex:none;border:2px solid var(--ink);box-shadow:0 2px 0 rgba(43,33,24,.85);position:relative}
.chip svg{width:52%;height:52%;fill:#fff}
.chip.k0{background:var(--c0)} .chip.k1{background:var(--c1)} .chip.k2{background:var(--c2)}
.chip.k3{background:conic-gradient(from 200deg,var(--c0),#e8a12a,var(--c1),var(--c2),#7a4fc0,var(--c0))}
.chip.back{background:radial-gradient(circle,#fff 0 1.1px,transparent 1.4px) 0 0/5px 5px,#1f1f1f}
.chip.back svg{display:none}

/* ---------- DÒNG NHẮC ---------- */
#prompt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;text-align:center;min-height:62px;justify-content:center}
#pMain{font-weight:900;font-size:15.5px;line-height:1.35}
#pMain b{font-weight:900}
#pSub{font-weight:800;font-size:14px;color:var(--ink-2);min-height:19px}
#pSub:empty{display:none}
#pSub .bad{color:var(--pen)} #pSub .good{color:var(--ok)}
#timer{position:absolute;right:12px;top:12px;font-family:var(--tb-font-brand);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;padding:1px 9px;border-radius:9px;background:#fff;border:1.5px solid #d8d4ca}
#timer.low{color:#d9362b;animation:blink .5s infinite}
#timer:empty{display:none}
@keyframes blink{50%{opacity:.3}}

/* ---------- KHU CỦA MÌNH: 7 lá, 4 loại chip, nút ---------- */
#mine{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
#mCards{display:grid;grid-template-columns:repeat(7,auto);gap:8px;justify-content:center}
#mCards .rc{--cw:calc(var(--ps) * 60 / 42);cursor:pointer}
#mCards .rc.used{cursor:default}
#mCards .rc:not(.used):not(.sel):hover{transform:translateY(-3px)}
#mCards.locked .rc{cursor:default}
#mChips{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:8px 18px;border-radius:999px;background:#fff;border:1.5px solid #d8d4ca}
.cslot{display:flex;align-items:flex-end;gap:9px;cursor:pointer;background:none;border:none;padding:0}
.cslot .chip{transition:transform .12s}
.cslot:hover:not(:disabled) .chip{transform:translateY(-2px)}
.cslot small{font-weight:900;font-size:12px;color:var(--ink-2);min-width:8px}
.cslot.sel .chip{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink);transform:translateY(-3px)}
.cslot:disabled{cursor:default}
.cslot:disabled:hover .chip{transform:none}
.cslot.none .chip{opacity:.25;filter:grayscale(.6)}
.dots::after{content:"";animation:dots 1.4s infinite steps(4)}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.pp .wait{animation:blink 1.4s infinite}
#mCtl{display:flex;gap:10px;width:100%;max-width:460px}
.hb{flex:1;min-width:0;padding:12px 14px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;border:2px solid var(--ink);background:var(--cream-2);color:var(--ink);box-shadow:0 3px 0 rgba(43,33,24,.85);font-family:var(--tb-font-brand);letter-spacing:.02em}
.hb.dark{background:var(--ink);color:#fff;flex:2}
.hb:hover:not(:disabled){filter:brightness(1.06)}
.hb:disabled{opacity:.35;cursor:not-allowed}
.hb small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--tb-font);font-size:11px;font-weight:800;opacity:.75;letter-spacing:0}
#mine.idle #mCards .rc,#mine.idle #mChips{opacity:.45}

/* kết quả vòng */

#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:360px;overflow:auto;font-size:12.5px}
#log li{padding:3px 7px;border-radius:7px;background:var(--field);line-height:1.35}
#log li.hd{background:none;font-weight:900;color:var(--gold-ink);padding-top:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
#log li.bad{background:#fdeeee;color:#9b2a20;font-weight:800}
#log li.win{background:#eefaf1;color:#13662f;font-weight:800}
#info p{margin:0 0 4px;font-size:13px}
#info b{font-weight:900}
.stdg{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.stdg li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--field)}
.stdg li .pl2{width:16px;color:var(--gold-ink);font-family:var(--tb-font-brand)}
.stdg li span.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stdg li b{color:var(--pen);font-variant-numeric:tabular-nums}
.stdg li.me{background:#fffbea}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(20,25,40,.5);display:grid;place-items:center;z-index:50;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 24px;box-shadow:var(--tb-shadow-lg);position:relative}
.card h2{margin:0 0 10px;font-family:var(--tb-font-brand);font-size:26px;line-height:1.15}
.card h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.card p,.card li{font-size:14.5px;line-height:1.55}
.card ul{margin:6px 0;padding-left:20px}
.card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.credit{margin-right:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;background:var(--btn);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.seg button:hover{background:var(--btn-hover)}
.seg button.on{background:var(--gold);color:var(--tb-primary-ink);border-color:var(--gold)}
.seg.small button{min-width:0;padding:7px 8px}
#segBots,#segLen,#segLenL{flex-wrap:nowrap}#segBots button,#segLen button,#segLenL button{min-width:0}
.field{width:100%;background:#fff;color:var(--text);border:2px solid var(--btn-line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:800;font-size:15px}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.netrow .seg{flex:2 1 240px}
#joinCode{flex:1 1 140px;min-width:0;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-size:18px}
#joinCode::placeholder{letter-spacing:normal;font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
.netcode{font-family:var(--tb-font-brand);font-size:42px;font-weight:800;letter-spacing:.22em;padding-left:.22em;color:var(--gold-ink);margin:2px 0 8px;user-select:all;text-align:center}
.netlink{display:flex;gap:8px}
.netlink input{flex:1;min-width:0;background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
#mLobby .card{max-width:520px}
.lseats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lseats li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--field);border:1px solid var(--line);min-height:44px}
.lseats li .av{width:30px;height:30px;font-size:14px}
.lseats li .av .bot{width:15px;height:15px}
.lseats li b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lseats li small{color:var(--muted);font-weight:800;font-size:12px}
.lseats li button{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.lseats li button.lv{border:1.5px solid var(--btn-line);background:#fff;border-radius:8px;font-size:12px;padding:3px 9px;font-weight:800;cursor:pointer;color:var(--text);line-height:1.3}
.lseats li.empty{justify-content:center;color:var(--muted);font-size:13px;border-style:dashed;background:none}
.addbot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.addbot .seg{flex:1}
#addBot:disabled,#segBotLv button:disabled{opacity:.45;cursor:not-allowed}
#netMsg,#lobbyMsg{color:var(--muted);margin:12px 0 0;text-align:center}
.lvrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lvrow > span{flex:0 0 110px;font-weight:800;font-size:13.5px}
.lvrow .seg{flex:1}
/* mức máy bằng sao: 1 sao vàng, 2 sao xanh dương, 3 sao đỏ */
.lvrow .seg button,#segBotLv button{letter-spacing:-1px;white-space:nowrap}
.lvrow .seg button[data-v="easy"],#segBotLv button[data-v="easy"]{border-color:#ffd24a;background:rgba(255,210,74,.2)}
.lvrow .seg button[data-v="medium"],#segBotLv button[data-v="medium"]{border-color:#3d8bff;background:rgba(61,139,255,.16)}
.lvrow .seg button[data-v="hard"],#segBotLv button[data-v="hard"]{border-color:#e5453b;background:rgba(229,69,59,.16)}
.lvrow .seg button.on[data-v="easy"],#segBotLv button.on[data-v="easy"]{background:#ffd24a;border-color:#ffd24a;color:#3a2a00}
.lvrow .seg button.on[data-v="medium"],#segBotLv button.on[data-v="medium"]{background:#3d8bff;border-color:#3d8bff;color:#fff}
.lvrow .seg button.on[data-v="hard"],#segBotLv button.on[data-v="hard"]{background:#e5453b;border-color:#e5453b;color:#fff}
.over-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.over-list li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--field);font-weight:800}
.over-list li .plc{font-family:var(--tb-font-brand);font-size:20px;width:26px;color:var(--gold-ink)}
.over-list li .av{width:28px;height:28px;font-size:13px}
.over-list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.over-list li b{color:var(--pen);font-family:var(--tb-font-brand);font-size:19px}
.over-list li.me{background:#fffbea;border:1.5px solid var(--gold)}
/* hình minh hoạ trong Luật chơi */
.fig{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px;padding:10px 12px;border-radius:12px;background:var(--cream);border:1px solid #d8d4ca;color:var(--ink)}
.fig .rc{--cw:30px}
.fig .stand{width:150px;padding:0}
.fig .stand .atlas{width:140px}
.fig .stand .slab{width:104px;height:24px}
.fig .stand .slab b{font-size:16px;margin-top:2px}
.fig .stand .stack{min-height:0}
.fig .chip{--cs:26px}
.fig{--ps:27px}   /* cùng tỉ lệ khúc cột : bệ : tượng như trên bàn chơi */
.fig .ar{font-weight:900;font-size:18px;color:var(--ink-2)}
.fig .tx{font-weight:800;font-size:13.5px}
.fig .tx.bad{color:var(--pen)}
.fig .mini{display:flex;align-items:flex-end;gap:2px}
.youtag{font-weight:700;opacity:.6;white-space:nowrap}

@media (max-width:1040px){#stage{grid-template-columns:1fr}#side{display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:640px){#side{grid-template-columns:1fr}}
body.portrait #app{padding:8px 8px 24px}
body.portrait .brand{display:none}   /* điện thoại: ẩn logo + tên game cho đỡ tốn chỗ */
body.portrait .actions .btn{padding:7px 11px;font-size:13px}
body.portrait #board{border-radius:16px}
body.portrait #stands{gap:4px;padding:12px 6px 0}
body.portrait{--ps:min(27px,calc((100vw - 92px) / 10));--chip:26px}
body.portrait .slab{height:23px;width:74%}
body.portrait .slab b{font-size:15px;margin-top:2px}
body.portrait .slab small{font-size:8px;margin-top:3px}

body.portrait #players{gap:6px;padding:12px 8px 4px}
body.portrait #players.wrap{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}
body.portrait .pp .rc{--cw:23px}
body.portrait .pp{min-height:38px;gap:3px}
body.portrait .ph b{font-size:11.5px}
body.portrait .av{width:18px;height:18px;font-size:10px}
body.portrait #mine{padding:2px 8px 14px}
body.portrait #mCards{gap:5px}
body.portrait #mChips{gap:12px;padding:7px 14px}
body.portrait #pMain{font-size:14.5px}
/* màn máy tính thấp (vd. 1536x730): thu gọn để không phải cuộn */
body.short #stands{padding-top:2px}
body.short{--ps:29px;--chip:28px}
body.short .atlas{width:min(100%,118px)}
body.short .slab{width:calc(min(100%,150px) * .74);height:27px}
body.short #players{gap:6px}
body.short .pl{padding:5px 4px 6px;gap:3px}
body.short .slab b{font-size:18px}
body.short #players{padding-top:10px}
body.short .pp{min-height:40px}
body.short .pp .rc{--cw:24px}
body.short #prompt{min-height:54px;padding:6px 14px}

body.short #mine{gap:9px;padding-bottom:12px}
body.short .hb{padding:9px 12px}
</style>
</head>

let LANG = (() => { try { const s = localStorage.getItem("lang"); if (s === "vi" || s === "en") return s; } catch (e) {} return (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en"; })();

let AC = null;
try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
const wakeAC = () => { if (AC && AC.state !== "running") AC.resume().catch(() => {}); };
for (const ev of ["pointerdown", "keydown", "touchstart"]) addEventListener(ev, wakeAC, { passive: true });
function tone(freq, start, dur, type = "sine", vol = .16) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + .01); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.start(start); o.stop(start + dur + .02);
}
// tiếng rên trượt xuống của tượng khi sụp
function groan(start) {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.setValueAtTime(330, start); o.frequency.exponentialRampToValueAtTime(70, start + .34);
  f.type = "lowpass"; f.frequency.value = 900;
  o.connect(f); f.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(.3, start + .03); g.gain.exponentialRampToValueAtTime(0.0001, start + .36);
  o.start(start); o.stop(start + .4);
}
function noise(start, dur, freq, vol) {
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.1; g.gain.value = vol;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination); src.start(start);
}
let lastSfx = {};
function sfx(name, delay = 0) {
  if (!AC) return;
  const now = performance.now();
  if (!delay && lastSfx[name] && now - lastSfx[name] < 70) return;
  lastSfx[name] = now;
  try {
    wakeAC();
    const t = AC.currentTime + .01 + delay / 1000;
    if (name === "tick") tone(1500, t, .035, "triangle", .07);
    else if (name === "card") noise(t, .09, 3000, .3);
    else if (name === "lock") { noise(t, .08, 1800, .3); tone(520, t + .02, .08, "triangle", .08); }
    else if (name === "reveal") [0, .07, .14].forEach(d => noise(t + d, .05, 2400, .2));
    else if (name === "thud") { tone(95, t, .22, "sine", .35); noise(t, .1, 420, .35); }   // đá rơi vào đĩa cân
    else if (name === "pen") { tone(150, t, .3, "sawtooth", .07); [0, .06, .12, .18].forEach(d => noise(t + .05 + d, .07, 600 + Math.random() * 300, .25)); }
    else if (name === "crash") { groan(t); noise(t + .16, .45, 160, 2.2); noise(t + .16, .5, 80, 1.6); tone(62, t + .16, .55, "sine", .7); tone(45, t + .18, .5, "sine", .55); [.3, .42, .55].forEach(d => noise(t + d, .07, 900, .4)); }   // tượng sụp
    else if (name === "pass") { tone(660, t, .08, "triangle", .08); tone(500, t + .07, .1, "triangle", .07); }
    else if (name === "turn") { tone(660, t, .12, "triangle", .14); tone(880, t + .1, .16, "triangle", .14); }
    else if (name === "win") [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .1, .28, "triangle", .18));
    else if (name === "lose") [392, 330, 262].forEach((f, i) => tone(f, t + i * .14, .3, "triangle", .15));
  } catch (e) {}
}

/* ---------- LUẬT ----------

/* ---------- 3 CÂN ---------- */
const STAND_EL = [];

/* Chồng cột vượt 3 tầng: giữ nguyên chiều cao hàng cân (không đẩy trang phải cuộn) bằng cách thu nhỏ đều cả cụm
   cột + bệ + tượng của cả 3 cân (zoom), nên khúc cột 3 cân vẫn cùng một cỡ và chân tượng vẫn thẳng hàng. */
let STK_KEY = "";

function fitStands() {
  if (!STAND_EL.length) return;

  } else if (V.phase === "done") {
    const guest = MODE && MODE.kind === "online" && !isHost();
    h = guest ? `<button class="hb dark" disabled data-b="nextg">${tr("b_wait_host")}</button>` : `<button class="hb dark" data-b="next">${tr("b_next")}</button>`;
  } else h = "";
  const sig = h + LANG;
  if (ctl._sig !== sig) { ctl._sig = sig; ctl.innerHTML = h; }
}

/* ---------- ĐỒNG HỒ, THÔNG TIN, NHẬT KÝ ---------- */
function deadlineAt() { return isHost() ? HOST.deadline : V && V.left ? V.deadlineAt : 0; }
function updateTimers() {
  const el = $("#timer"), dl = deadlineAt();
  let txt = "", low = false;
  if (V && dl && V.phase !== "done") {
    const s = Math.max(0, Math.ceil((dl - performance.now()) / 1000));
    if (s <= (V.phase === "pick" ? TIMES.p : TIMES.m)) txt = String(s);   // còn chờ hiệu ứng thì chưa hiện
    low = s <= 8 && (V.timerSeats || []).includes(ME);
  }
  if (el.textContent !== txt) el.textContent = txt;
  el.classList.toggle("low", low);
  const nb = $('#mCtl [data-b="next"]');
  if (nb) { const s = dl && V && V.phase === "done" ? Math.max(0, Math.ceil((dl - performance.now()) / 1000)) : 0; const t = s ? tr("b_next_in", s) : tr("b_next"); if (nb.textContent !== t) nb.textContent = t; }
}
setInterval(updateTimers, 250);
setInterval(() => { if (V && V.phase === "place" && performance.now() - FX.revealAt < 2000) { renderPrompt(); renderPlayers(); } }, 300);   // bỏ chữ "Lật bài" và hiệu ứng lật khi đã xong
function renderInfo() {
  const el = $("#info");
  if (!V) { el.innerHTML = `<h3 class="h3">${tr("title")}</h3><p class="note" style="margin:0">${tr("tagline")}</p>`; return; }
  const mode = V.mode === "online" ? tr("i_mode_online", V.code || NET.code) : tr("i_mode_bot");
  const bots = V.seats.map(s => s.kind === "bot" ? `${escH(s.name)} (${tr("lv_" + s.level)})` : null).filter(Boolean);
  const order = V.seats.map((s, i) => i).sort((a, b) => penOf(a) - penOf(b) || V.penAt[a] - V.penAt[b] || a - b);
  const html = `<h3 class="h3">${tr("title")}<span>${mode}</span></h3><p>${tr("i_round", Math.max(1, V.round), V.rounds)}${V.rounds === 14 ? ` · <span class="note">${tr("i_set", V.round > 7 ? 2 : 1)}</span>` : ""}</p>`
    + (bots.length ? `<p class="note">${tr("i_bots", bots.join(", "))}</p>` : "") + (V.mode === "online" ? `<p class="note">${tr("i_timer")}</p>` : "")
    + `<h3 class="h3" style="margin-top:10px">${tr("i_stdg")}</h3><ol class="stdg">${order.map((s, k) => `<li class="${s === ME ? "me" : ""}"><span class="pl2">${k + 1}</span>${avHTML(s, V.seats[s].name, V.seats[s].kind === "bot", seatLv(V.seats[s]))}<span class="nm">${labelOf(s)}</span><b>${penOf(s) ? "−" + penOf(s) : "0"}</b></li>`).join("")}</ol>`;
  if (el._h !== html) { el._h = html; el.innerHTML = html; }
}
function logLine(e) {
  const a = e.a, nm = s => escH(nameOf(s));
  switch (e.k) {
    case "l_round": return tr(e.k, a[0]);
    case "l_newset": return tr(e.k);
    case "l_pen": return tr(e.k, nm(a[0]), a[1], standTag(a[2]));
    default: return tr(e.k, nm(a[0]));
  }
}
function renderLog() {
  const el = $("#log");
  if (!V) { if (el._sig !== "") { el._sig = ""; el.innerHTML = ""; } return; }
  const sig = V.log.length + ":" + JSON.stringify(V.log[V.log.length - 1] || null) + LANG + ME;
  if (el._sig === sig) return;
  el._sig = sig;
  el.innerHTML = V.log.map(e => `<li class="${e.k === "l_round" ? "hd" : e.k === "l_pen" ? "bad" : e.k === "l_over" ? "win" : ""}">${logLine(e)}</li>`).join("");
  el.scrollTop = el.scrollHeight;
}

/* ---------- HẾT VÁN ---------- */
let overKey = "";
function renderOver(force) {
  if (!V || !V.over || V.phase !== "done") return;
  const key = "over:" + V.round + ":" + V.over.pen.join(",");
  if (!force && key === overKey) return;
  const first = key !== overKey;
  overKey = key;
  const O = V.over, win = O.place[ME] === 1;
  $("#overTitle").textContent = win ? tr("o_win") : tr("o_lose", O.order.filter(s => O.place[s] === 1).map(nameOf).join(", "));
  const guest = MODE && MODE.kind === "online" && !isHost();
  $("#overSub").textContent = tr("o_sub") + (guest ? " " + tr("o_wait") : "");
  $("#overList").innerHTML = O.order.map(s => `<li class="${s === ME ? "me" : ""}"><span class="plc">${O.place[s]}</span>${avHTML(s, V.seats[s].name, V.seats[s].kind === "bot", seatLv(V.seats[s]))}<span class="nm">${labelOf(s)}</span><b>${O.pen[s] ? "−" + O.pen[s] : "0"}</b></li>`).join("");
  $("#overNew").hidden = guest;
  const show = () => { if (V && V.over) $("#mOver").hidden = false; };
  if (first) { setTimeout(show, 1600); sfx(win ? "win" : "lose", 1600); } else show();
}

/* ============================================================
   BẢNG CHỌN CHẾ ĐỘ, PHÒNG CHỜ, CHỮ
   ============================================================ */
function syncModeUI() {
  $$("#segVs button").forEach(b => b.classList.toggle("on", b.dataset.v === PREFS.vs));
  $$("#segBots button").forEach(b => b.classList.toggle("on", +b.dataset.v === PREFS.bots));
  $$("#segLen button").forEach(b => b.classList.toggle("on", +b.dataset.v === PREFS.len));
  const lv = PREFS.levels.slice(0, PREFS.bots);
  $("#botLevels").innerHTML = lv.map((l, i) => `<div class="lvrow"><span>${tr("m_bot_n", i + 1)}</span><div class="seg small">${LEVELS.map(x => `<button data-i="${i}" data-v="${x}" class="${x === l ? "on" : ""}">${tr("lv_" + x)}</button>`).join("")}</div></div>`).join("");
  $$("#segNet button").forEach(b => b.classList.toggle("on", b.dataset.v === PREFS.net));
  $("#botOpts").hidden = PREFS.vs !== "bot";
  $("#netOpts").hidden = PREFS.vs !== "online";
  $("#lenOpts").hidden = PREFS.vs === "online" && PREFS.net === "join";
  $("#joinCode").hidden = PREFS.net !== "join";
  $("#levelNote").textContent = tr("lvn_" + PREFS.level);
  $("#modeCancel").textContent = PLAYED ? tr("cancel") : tr("m_back");
}
function openMode() { $("#myName").value = cleanName(PREFS.name); syncModeUI(); $("#mMode").hidden = false; }
function modeStart() {
  PREFS.name = cleanName($("#myName").value); savePrefs();
  if (PREFS.vs === "bot") { $("#mMode").hidden = true; startBotGame(); return; }
  if (PREFS.net === "create") { $("#mMode").hidden = true; startHost(); return; }
  const code = normCode($("#joinCode").value);
  if (code.length !== CODE_LEN) { $("#joinCode").focus(); $("#joinCode").placeholder = tr("n_err_code"); return; }
  $("#mMode").hidden = true; startGuest(code);
}
function renderLobby(L) {
  $("#lobbyTitle").textContent = L.host ? tr("n_title_host") : tr("n_title_guest", L.code || NET.code);
  $("#lobbyCode").hidden = !L.code && !L.host;
  if (!L.code) { $("#netCode").textContent = "·····"; $("#netLink").value = ""; }
  $("#netCopy").disabled = !L.code;
  if (L.code) { $("#netCode").textContent = L.code; $("#netLink").value = inviteLink(L.code); }
  const seats = L.seats || [];
  let h = seats.map((s, i) => `<li>${avHTML(i, s.name, s.kind === "bot", s.kind === "bot" ? s.level || "easy" : null)}<b>${escH(s.name)}${i === L.you ? tr("n_you") : ""}</b>
    ${s.kind === "bot" && L.host ? `<button class="lv" data-lv="${i}" title="${tr("n_lv_tip")}">${tr("n_bot", tr("lv_" + (s.level || "easy")))}</button>` : `<small>${i === 0 ? tr("n_host") : s.kind === "bot" ? tr("n_bot", tr("lv_" + (s.level || "easy"))) : tr("n_human")}</small>`}${L.host && i > 0 ? `<button data-rm="${i}" aria-label="x">×</button>` : ""}</li>`).join("");
  for (let i = seats.length; i < MAX_SEATS; i++) h += `<li class="empty">${tr("n_empty")}</li>`;
  $("#lobbySeats").innerHTML = h;
  $("#lobbyBot").hidden = !L.host;
  const full = seats.length >= MAX_SEATS;
  $("#addBot").disabled = full; $$("#segBotLv button").forEach(b => { b.disabled = full; b.classList.toggle("on", b.dataset.v === PREFS.botLv); });
  $$("#segLenL button").forEach(b => { b.classList.toggle("on", +b.dataset.v === (L.len || 7)); b.disabled = !L.host; });
  $("#lobbyStart").hidden = !L.host;
  $("#lobbyStart").disabled = seats.length < MIN_SEATS;
  $("#lobbyStart").textContent = tr("n_start", seats.length);
  $("#lobbyMsg").textContent = L.host ? (L.code ? tr("n_wait_host") : tr("n_connecting")) : tr("n_wait_guest");
}
function ruleFigs() {
  $("#figSet").innerHTML = `<span style="display:flex;gap:4px;flex-wrap:wrap">${Array.from({ length: CARDS }, (_, c) => cardHTML(c)).join("")}</span><span style="display:flex;gap:5px;align-items:center">${[0, 0, 1, 1, 2, 2, 3].map(k => chipHTML(k)).join("")}</span>`;
  const mini = (rs, sum) => `<div class="stand s2"><div class="stack" style="--tiers:${Math.ceil(rs.length / 3)}">${rs.map((c, i) => rockHTML(c, "", "", i)).join("")}</div><div class="slab"><b>${sum}</b><small>/13</small></div><svg class="atlas" viewBox="0 0 200 172"><use href="#atlas"/></svg></div>`;
  $("#figPen").innerHTML = `${mini([6, 0, 4], 10)}<span class="ar">+</span>${rockHTML(3)}<span class="ar">→</span><span class="tx bad">−3</span>${mini([3], 3)}<span class="tx" style="flex-basis:100%">${tr("fig_pen")}</span>`;
}
function applyLang() {
  document.documentElement.lang = LANG; document.title = tr("title") + " · Twistboard";
  $$("[data-i18n]").forEach(e => { e.innerHTML = tr(e.dataset.i18n); });
  $("#joinCode").placeholder = tr("m_code_ph"); $("#myName").placeholder = tr("def_name");
  ruleFigs();
  for (const el of [$("#players"), $("#mCards"), $("#mChips"), $("#mCtl"), $("#log"), $("#info")]) { el._sig = null; el._h = null; }
  $("#pMain")._h = $("#pSub")._h = null;
  if (!$("#mMode").hidden) syncModeUI();
  if (NET.role && !$("#mLobby").hidden) showLobby();
  if (V && V.over && !$("#mOver").hidden) renderOver(true);
  render();
}
function setLang(l) {
  if (l !== "vi" && l !== "en" || l === LANG && document.documentElement.lang === l) return;
  LANG = l; try { localStorage.setItem("lang", l); } catch (e) {}
  applyLang();
  if (window.TB) TB.setLang(l);
}
if (window.TB) TB.onLang(l => setLang(l));
function fit() {
  PORTRAIT = innerWidth < 700;
  document.body.classList.toggle("portrait", PORTRAIT);
  document.body.classList.toggle("short", !PORTRAIT && innerHeight < 820);
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
$("#btnNew").onclick = () => openMode();
$("#btnRules").onclick = () => { $("#mRules").hidden = false; };
$("#rulesOk").onclick = () => { $("#mRules").hidden = true; if (!PLAYED && !T && !V && !NET.role) openMode(); };
$("#segVs").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.vs = b.dataset.v; syncModeUI(); } };
$("#segBots").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.bots = +b.dataset.v; syncModeUI(); } };
$("#segLen").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.len = +b.dataset.v; savePrefs(); syncModeUI(); } };
$("#segLenL").onclick = e => { const b = e.target.closest("button"); if (b && NET.role === "host" && !NET.started) { PREFS.len = +b.dataset.v; savePrefs(); lobbyUpdate(); } };
$("#botLevels").onclick = e => { const b = e.target.closest("button[data-i]"); if (b) { PREFS.levels[+b.dataset.i] = b.dataset.v; PREFS.level = b.dataset.v; syncModeUI(); } };
$("#segNet").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.net = b.dataset.v; syncModeUI(); if (PREFS.net === "join") $("#joinCode").focus(); } };
$("#joinCode").oninput = e => { e.target.value = normCode(e.target.value); };
$("#joinCode").onkeydown = e => { if (e.key === "Enter") modeStart(); };
$("#myName").onkeydown = e => { if (e.key === "Enter") modeStart(); };
$("#modeStart").onclick = modeStart;
$("#modeCancel").onclick = () => { $("#mMode").hidden = true; if (!PLAYED) $("#mRules").hidden = false; };
$("#netCopy").onclick = () => {
  const inp = $("#netLink"), done = () => { $("#netCopy").textContent = tr("n_copied"); setTimeout(() => { $("#netCopy").textContent = tr("n_copy"); }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); document.execCommand("copy"); done(); });
  else { inp.select(); document.execCommand("copy"); done(); }
};
$("#segBotLv").onclick = e => { const b = e.target.closest("button"); if (b) { PREFS.botLv = b.dataset.v; savePrefs(); showLobby(); } };
$("#addBot").onclick = () => {
  if (NET.role !== "host" || NET.started || NET.lobby.length >= MAX_SEATS) return;
  const used = new Set(NET.lobby.map(x => x.name)), name = shuffle(BOT_NAMES.filter(n => !used.has(n)), Math.random)[0] || "Bot";
  NET.lobby.push({ id: "bot" + Math.random().toString(36).slice(2, 8), name, kind: "bot", level: PREFS.botLv, conn: null });
  lobbyUpdate();
};
$("#lobbySeats").onclick = e => {
  const lvb = e.target.closest("[data-lv]");
  if (lvb && NET.role === "host" && !NET.started) {   // bấm nhãn mức của máy: 1 → 2 → 3 sao → 1
    const x = NET.lobby[+lvb.dataset.lv];
    if (x && x.kind === "bot") { x.level = LEVELS[(LEVELS.indexOf(x.level || "easy") + 1) % 3]; lobbyUpdate(); }
    return;
  }
  const b = e.target.closest("[data-rm]");
  if (!b || NET.role !== "host" || NET.started) return;
  const i = +b.dataset.rm, x = NET.lobby[i];
  if (!x || i === 0) return;
  if (x.conn) { const c = x.conn; sendTo(c, { t: "err", code: "kicked" }); setTimeout(() => { try { c.close(); } catch (er) {} }, 400); }
  NET.lobby.splice(i, 1);
  lobbyUpdate();
};
$("#lobbyStart").onclick = hostStart;
$("#lobbyLeave").onclick = () => { leaveAll(); render(); openMode(); };
$("#netClose").onclick = () => { $("#mNet").hidden = true; if (!T && !V) openMode(); };
$("#overClose").onclick = () => { $("#mOver").hidden = true; };
$("#overNew").onclick = () => {
  $("#mOver").hidden = true;
  if (MODE && MODE.kind === "online" && NET.role === "host") hostToLobby();
  else if (MODE && MODE.kind === "bot") startBotGame();
  else openMode();
};
function selCard(c) {
  if (!V || V.phase !== "pick" || V.seats[ME].picked || !(V.hand >> c & 1)) return;
  SEL.c = SEL.c === c ? -1 : c; sfx("card"); render();
}
// st: cân đã bấm khi chip màu đó hết và phải dùng chip cầu vồng thay (tới lượt đặt thì cân này được chọn sẵn)
function selChip(k, st = -1) {
  if (!V || V.phase !== "pick" || V.seats[ME].picked || V.chips[k] <= 0) return;
  SEL.k = SEL.k === k ? -1 : k; SEL.st = SEL.k === RAINBOW ? st : -1; sfx("tick"); render();
}
// bấm cân lúc chọn: chọn chip màu của cân; hết chip màu đó mà còn cầu vồng thì chọn cầu vồng
function pickStand(st) {
  if (!V || V.phase !== "pick" || V.seats[ME].picked) return;
  if (V.chips[st] > 0) { if (SEL.k !== st) selChip(st); return; }
  if (V.chips[RAINBOW] <= 0) return;
  if (SEL.k === RAINBOW) { if (SEL.st !== st) { SEL.st = st; sfx("tick"); render(); } }
  else selChip(RAINBOW, st);
}
$("#mCards").onclick = e => { const c = e.target.closest("[data-c]"); if (c) selCard(+c.dataset.c); };
$("#mChips").onclick = e => { const b = e.target.closest("[data-k]"); if (b && !b.disabled) selChip(+b.dataset.k); };
$("#stands").onclick = e => {
  const s = e.target.closest(".stand");
  if (!s || !V) return;
  const st = +s.dataset.st, p = V.seats[ME] && V.seats[ME].pick;
  if (V.phase === "pick") { pickStand(st); return; }   // đang chọn: bấm cân = chọn chip màu đó (hết thì cầu vồng)
  if (V.phase === "place" && V.queue[0] === ME && p && p.k === RAINBOW) { SEL.st = st; sfx("tick"); render(); }
};
$("#mCtl").onclick = e => {
  const b = e.target.closest("[data-b]");
  if (!b || b.disabled) return;
  const a = b.dataset.b, p = V && V.seats[ME] && V.seats[ME].pick;
  if (a === "new") openMode();
  else if (a === "lock") doPick();
  else if (a === "pass") { sfx("pass"); doPlace({ pass: true }); }
  else if (a === "place" && p) doPlace({ st: p.k === RAINBOW ? SEL.st : p.k });
  else if (a === "next") { if (isHost()) nextRound(); }
  else if (a === "view") renderOver(true);
  else if (a === "again") $("#overNew").click();
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { for (const id of ["#mRules", "#mMode"]) if (!$(id).hidden) { $(id).hidden = true; return; } return; }
  if (e.ctrlKey || e.metaKey || e.altKey || !V || $$(".modal").some(m => !m.hidden) || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (V.phase === "pick") {
    if (/^[0-6]$/.test(k)) selCard(+k);
    else if ("rgbw".includes(k) && k.length === 1) { const i = "rgbw".indexOf(k); if (i < 3 && V && V.chips[i] <= 0) pickStand(i); else selChip(i); }
    else if (k === "enter") doPick();
  } else if (V.phase === "place" && V.queue[0] === ME) {
    const p = V.seats[ME].pick;
    if (p && p.k === RAINBOW && /^[1-3]$/.test(k)) { SEL.st = +k - 1; render(); }
    else if (k === "enter" && p && (p.k !== RAINBOW || SEL.st >= 0)) doPlace({ st: p.k === RAINBOW ? SEL.st : p.k });
    else if (k === "p" && V.canPass) doPlace({ pass: true });
  } else if (V.phase === "done" && k === "enter" && isHost() && !V.over) nextRound();
});
let fitT = 0;
window.addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(() => { fit(); $("#players")._sig = null; render(); }, 80); });
window.addEventListener("beforeunload", () => { if (NET.role) netClose(true); });

window.game = { get T() { return T; }, get V() { return V; }, get MODE() { return MODE; }, NET, HOST, SEL, doPick, doPlace, nextRound, startBotGame, botPick, botPlace, viewFor };

/* ---------- KHỞI ĐỘNG ---------- */
(function init() {
  if (window.TB && TB.closeX) TB.closeX({ "#mRules": "#rulesOk", "#mMode": "#modeCancel", "#mLobby": "#lobbyLeave", "#mNet": "#netClose", "#mOver": "#overClose" });   // nút × góc trên phải mỗi popup
  buildStands();
  fit();
  applyLang();
  const room = normCode((location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1]);
  if (room.length === CODE_LEN) {
    PLAYED = true;
    if (PREFS.name) startGuest(room);
    else { PREFS.vs = "online"; PREFS.net = "join"; openMode(); $("#joinCode").value = room; $("#myName").focus(); }
  } else $("#mRules").hidden = false;   // mở trang: Luật chơi trước, "Đã hiểu" → bảng chọn cách chơi
  render();
})();
</script>
</body>
</html>
