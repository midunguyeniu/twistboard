<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs>
  <radialGradient id="felt" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#36b374"/><stop offset=".6" stop-color="#17794a"/><stop offset="1" stop-color="#0c4e2f"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f4a20b"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#04301b" flood-opacity=".45"/></filter>
  <pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#4a6fd8"/><rect width="6" height="12" fill="#3b5fc9"/></pattern>
</defs>
<rect width="400" height="400" fill="url(#felt)"/>
<ellipse cx="200" cy="200" rx="172" ry="118" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3" stroke-dasharray="10 8"/>
<!-- quân chip -->
<g filter="url(#sh)">
  <g transform="translate(62 306)"><ellipse cx="0" cy="10" rx="34" ry="12" fill="#a8222f"/><rect x="-34" y="-8" width="68" height="18" fill="#c8323f"/><ellipse cx="0" cy="-8" rx="34" ry="12" fill="#ef3f5a"/><ellipse cx="0" cy="-8" rx="22" ry="7.5" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="7 6"/></g>
  <g transform="translate(62 284)"><ellipse cx="0" cy="10" rx="34" ry="12" fill="#2d4ba8"/><rect x="-34" y="-8" width="68" height="18" fill="#3b5fc9"/><ellipse cx="0" cy="-8" rx="34" ry="12" fill="#4a6fd8"/><ellipse cx="0" cy="-8" rx="22" ry="7.5" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="7 6"/></g>
  <g transform="translate(340 308)"><ellipse cx="0" cy="10" rx="30" ry="11" fill="#1d7a43"/><rect x="-30" y="-6" width="60" height="16" fill="#25934f"/><ellipse cx="0" cy="-6" rx="30" ry="11" fill="#2ea65a"/><ellipse cx="0" cy="-6" rx="19" ry="7" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="6 5"/></g>
</g>
<!-- lá bài xoè -->
<g filter="url(#sh)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
  <g transform="translate(100 200) rotate(-16)"><rect x="-46" y="-64" width="92" height="128" rx="13" fill="url(#back)" stroke="#2d4ba8" stroke-width="3"/><circle r="17" fill="#6f8ff0"/></g>
  <g transform="translate(162 186) rotate(-6)"><rect x="-46" y="-64" width="92" height="128" rx="13" fill="#fff" stroke="#d6dae4" stroke-width="3"/><text y="26" font-size="72" fill="#1d2330">6</text><g fill="#f0a020"><circle cx="-32" cy="-50" r="4"/><circle cx="-21" cy="-50" r="4"/></g></g>
  <g transform="translate(226 184) rotate(4)"><rect x="-46" y="-64" width="92" height="128" rx="13" fill="#fff8f1" stroke="#d6dae4" stroke-width="3"/><rect x="-38" y="-56" width="76" height="112" rx="9" fill="none" stroke="#e0682b" stroke-opacity=".3" stroke-width="2.5"/><text y="27" font-size="80" fill="#e0682b">×</text></g>
  <g transform="translate(290 196) rotate(14)"><rect x="-46" y="-64" width="92" height="128" rx="13" fill="#fff" stroke="#d6dae4" stroke-width="3"/><text y="26" font-size="72" fill="#1d2330">4</text><g fill="#f0a020"><circle cx="-32" cy="-50" r="4"/><circle cx="-21" cy="-50" r="4"/><circle cx="-10" cy="-50" r="4"/></g></g>
</g>
<!-- mục tiêu 1 và 20 -->
<g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle" filter="url(#sh)">
  <g transform="translate(64 102)"><circle r="40" fill="#fff"/><circle r="33" fill="none" stroke="#2f6fd6" stroke-width="4"/><text y="18" font-size="50" fill="#2f6fd6">1</text></g>
  <g transform="translate(334 100)"><circle r="48" fill="url(#gold)"/><circle r="40" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4"/><text y="19" font-size="52" fill="#7a3d00">20</text></g>
  <g transform="translate(200 300)"><rect x="-74" y="-28" width="148" height="56" rx="28" fill="#1d2330"/><text y="15" font-size="38" fill="#ffc928">= 20</text></g>
