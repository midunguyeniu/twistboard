<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d7fe0"/><stop offset="1" stop-color="#2450a8"/></linearGradient>
  <linearGradient id="house" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3350"/><stop offset="1" stop-color="#1a1f30"/></linearGradient>
  <radialGradient id="lr" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ff9a9e"/><stop offset=".7" stop-color="#d93b41"/></radialGradient>
  <radialGradient id="ly" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffe08a"/><stop offset=".7" stop-color="#e9a514"/></radialGradient>
  <radialGradient id="lg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#7ef0ab"/><stop offset=".7" stop-color="#1f9d55"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1d45" flood-opacity=".45"/></filter>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<!-- đèn giao thông nằm ngang -->
<g filter="url(#sh)">
  <rect x="96" y="66" width="208" height="76" rx="38" fill="url(#house)"/>
  <rect x="190" y="142" width="20" height="18" fill="#1a1f30"/>
</g>
<circle cx="140" cy="104" r="30" fill="#ff5a5f" opacity=".55" filter="url(#glow)"/>
<circle cx="200" cy="104" r="30" fill="#ffc23a" opacity=".55" filter="url(#glow)"/>
<circle cx="260" cy="104" r="30" fill="#3ee08a" opacity=".55" filter="url(#glow)"/>
<circle cx="140" cy="104" r="25" fill="url(#lr)"/>
<circle cx="200" cy="104" r="25" fill="url(#ly)"/>
<circle cx="260" cy="104" r="25" fill="url(#lg)"/>
<!-- bảng đoán: 2 hàng 9 ô -->
<rect x="12" y="172" width="376" height="140" rx="22" fill="url(#house)" filter="url(#sh)"/>
<g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="25" text-anchor="middle">
  <!-- lượt đoán 12+3×4=24 chấm theo đáp án 24−3^2=15 bằng feedback() của game -->
  <g transform="translate(24 186)">
    <rect x="0" width="34" height="50" rx="8" fill="#e9a514"/><text x="17" y="34" fill="#3a2a00">1</text>
    <rect x="40" width="34" height="50" rx="8" fill="#e9a514"/><text x="57" y="34" fill="#3a2a00">2</text>
    <rect x="80" width="34" height="50" rx="8" fill="#d93b41"/><text x="97" y="34" fill="#fff">+</text>
    <rect x="120" width="34" height="50" rx="8" fill="#1f9d55"/><text x="137" y="34" fill="#fff">3</text>
    <rect x="160" width="34" height="50" rx="8" fill="#d93b41"/><text x="177" y="34" fill="#fff">×</text>
    <rect x="200" width="34" height="50" rx="8" fill="#e9a514"/><text x="217" y="34" fill="#3a2a00">4</text>
    <rect x="240" width="34" height="50" rx="8" fill="#1f9d55"/><text x="257" y="34" fill="#fff">=</text>
    <rect x="280" width="34" height="50" rx="8" fill="#e9a514"/><text x="297" y="34" fill="#3a2a00">2</text>
    <rect x="320" width="34" height="50" rx="8" fill="#d93b41"/><text x="337" y="34" fill="#fff">4</text>
  </g>
  <g transform="translate(24 248)">
    <rect x="0" width="34" height="50" rx="8" fill="#1f9d55"/><text x="17" y="34" fill="#fff">2</text>
    <rect x="40" width="34" height="50" rx="8" fill="#1f9d55"/><text x="57" y="34" fill="#fff">4</text>
    <rect x="80" width="34" height="50" rx="8" fill="#1f9d55"/><text x="97" y="34" fill="#fff">−</text>
    <rect x="120" width="34" height="50" rx="8" fill="#1f9d55"/><text x="137" y="34" fill="#fff">3</text>
    <rect x="160" width="34" height="50" rx="8" fill="#1f9d55"/><text x="177" y="40" fill="#fff" font-size="34">^</text>
    <rect x="200" width="34" height="50" rx="8" fill="#1f9d55"/><text x="217" y="34" fill="#fff">2</text>
    <rect x="240" width="34" height="50" rx="8" fill="#1f9d55"/><text x="257" y="34" fill="#fff">=</text>
    <rect x="280" width="34" height="50" rx="8" fill="#1f9d55"/><text x="297" y="34" fill="#fff">1</text>
    <rect x="320" width="34" height="50" rx="8" fill="#1f9d55"/><text x="337" y="34" fill="#fff">5</text>
  </g>
</g>
</svg>
